 demand:"题目要求判断「收益是否大于成本」(whether the benefits outweigh the costs)，并点名一个自选国家。官方允许收益作 KAA、成本作评价（或反之）。范文以中国为自选国家：收益侧用比较优势（comparative advantage）与贫困下降，成本侧用不平等、剥削与外部性（externality），最后给出有条件的净判断。注意：本题官方评价（成本）清单后段未逐字核全，范文的评价角度与官方已核对部分及同系列口径一致，成本清单以官方 MS 原文为准。",
 command:"Evaluate + outweigh：核心动作是「权衡并下判断」，不是把收益和成本各写一半就结束。本题要求结合一个自选国家，不点名国家会削弱应用（KAA 是否封顶以该题官方 MS 为准）；没有 informed judgement，Evaluation 进不了 Level 3。",
 structure:[["第 1 段 · 定义与判断预告","定义全球化（globalisation）；预告判断：对中国整体而言收益大于成本，但结论依赖再分配与规制。"],
 ["第 2 段 · 收益一：比较优势与增长（KAA）","专业化（specialisation） → 世界产出↑ → 出口导向增长 → 收入与税收（taxation）↑；PPC 图：消费超出生产可能性边界（production possibility curve, PPC）。"],
 ["第 3 段 · 收益二：消费者与贫困（KAA）","价格↓、选择↑、消费者剩余（consumer surplus）↑；中国出口部门就业与绝对贫困（absolute poverty）大幅下降；技术转移（technology transfer）与规模经济（economies of scale）。"],
 ["第 4 段 · 成本一：不平等与劳工（评价）","国内不平等加剧、沿海与内陆差距；出口工厂的低工资、长工时与安全问题；涓滴理论缺乏证据（trickle-down theory；官方原话）。"],
 ["第 5 段 · 成本二：外部性与脆弱性（vulnerability；评价）","生产与运输的污染、资源消耗；对出口需求与外部冲击的依赖（external shock；以中国放缓对全球的传导反证依存度）。"],
 ["第 6 段 · 判断","分主体、分时间比较后下判断：收益更大但非自动——取决于税收再分配、劳工与环境规制（environmental regulation）是否跟上。"]],
 ao:[["AO1 Knowledge","收益五点取二三写深（比较优势、消费者、贫困）；成本五点取二写深（不平等、外部性）。定义与 PPC 图到位。"],
 ["AO2 Application","全程绑定中国：出口导向增长、贫困下降、沿海/内陆差距——国家不是点缀，是每条链的落点。"],
 ["AO3 Analysis","收益链与成本链都走满 4 环以上，并说明机制（为什么价格下降、为什么不平等上升）。"],
 ["AO4 Evaluation","outweigh 的判断必须给条件：再分配、规制、时间跨度；并引用官方对涓滴理论的否定作为批判证据。"]],
 paras:[
 "Globalisation is the increasing integration of national economies, shown by rising trade, foreign direct investment, migration and technology transfer. Whether its benefits outweigh its costs cannot be answered in the abstract: it depends on the country, on who gains and who loses within it, and on the policies that accompany it. This essay uses China, the largest single beneficiary — and contributor — of the last four decades of integration. On balance, for China the benefits have outweighed the costs, but the margin depends critically on redistribution and regulation, and the costs are concentrated on groups least able to bear them.",
 "The central benefit comes from the law of comparative advantage. By specialising in labour-intensive manufactures, where its opportunity cost was lowest, and importing capital- and technology-intensive goods, China moved to consumption and production possibilities beyond what its own resources allowed: specialisation raised world output, and trade let China share in that gain. Export production at world scale generated economies of scale, lowering long-run average costs and raising competitiveness further, in a cumulative process. Export earnings and FDI inflows raised investment and AD, producing decades of rapid growth. Government tax revenues rose with profits and incomes, funding infrastructure and public services that reinforced the process. The diagram of a production possibility curve captures the static gain: after specialisation and trade, the consumption point lies outside the curve that constrained the economy in autarky.",
 "Consumers and workers gained directly. Competition from imports and the expansion of supply lowered prices and increased choice, raising consumer surplus and allocative efficiency, while technology transfer and new managerial techniques diffused through joint ventures and supply chains. Most importantly for a developing economy, higher real GDP in export-led sectors created hundreds of millions of jobs and produced a historic fall in absolute poverty: workers moved from low-productivity agriculture into higher-productivity industry, raising real incomes across the economy. Labour migration within the integrated world economy has similarly reduced geographical inequality elsewhere, for example Eastern European workers moving to Western Europe within the EU.",
 "Against this stand serious costs, and they qualify the judgement in three ways. First, inequality rose sharply within China: the gains accrued disproportionately to coastal provinces, to owners of capital and to skilled workers, while interior regions and unskilled workers gained far less. The claim that higher earnings at the top eventually trickle down to everyone is weak — the official verdict on trickle-down theory is that there is very little evidence that it works in practice. Second, integration was partly built on exploited labour: low wages, long hours and poor health and safety in export factories. Third, there are external costs. Expanded production and long-distance freight increased pollution and the consumption of non-renewable resources, imposing costs on others and on future generations, and making sustainable growth harder to achieve.",
 "A further cost is vulnerability. An economy specialised for export markets is exposed to external shocks: when global demand falls, or when a partner raises tariffs, the export sector transmits the shock directly into domestic employment. The same interdependence works in reverse — when China's own growth slowed to 5% in 2024, its import demand fell (imports were $2.6 trillion in 2024), reducing the export earnings and growth of the commodity and capital-goods producers that supply it. Over-dependence on imports can also worsen the current account of countries on the other side of the relationship. These costs are real, but note their character: they are mostly costs of how globalisation is governed — weak labour and environmental standards, absent redistribution — rather than proof that trade itself reduces welfare.",
 "Weighing the two sides for China, the benefits outweigh the costs. The gains — higher output, lower prices, mass employment and the largest reduction in absolute poverty in history — are economy-wide and cumulative, while the main costs fall on identifiable groups and can be mitigated by the very tax revenues globalisation generates: transfers and retraining for displaced workers, enforced labour standards and pollution controls. The judgement is nevertheless conditional. For a country that cannot tax, regulate or retrain — or a primary exporter facing deteriorating terms of trade — the same forces could plausibly produce costs exceeding benefits. Globalisation's net effect is therefore not a fact about trade but a fact about policy."],
 chains:"收益链：比较优势专业化 → 世界产出↑、规模经济 → 出口与 FDI↑ → AD 与税收↑ → 就业与收入↑ → 绝对贫困↓、消费者剩余↑。成本链：低标准竞争 → 劳工剥削 + 沿海/技能群体独享收益 → 国内不平等↑；产量与运输↑ → 污染与资源耗竭（负外部性（negative externality））；出口专业化 → 外部冲击直接传导至就业。",
 whyEval:"评价有效的原因：(1) 分主体——消费者、企业、劳工、政府、环境各自结算，而不是笼统说「有利有弊」；(2) 用官方证据批判涓滴理论，把「收益会自动扩散」这一隐含假设拆掉；(3) 区分成本的性质——治理成本 vs 贸易本身的成本，这决定了判断的方向；(4) 判断带条件（能征税、能规制、能再培训的国家 vs 不能的国家），符合 Level 3「informed judgement」的定义。",
 whyJudge:"判断有说服力，因为它先承认成本的真实性与集中性，再论证收益的规模（经济整体性、累积性）与成本的可治理性能构成不对称，最后把结论落到可检验的条件上——读者能清楚知道什么证据会推翻这个判断。",
 lose:["本题要求自选国家却全程不点名——应用明显削弱（封顶以官方 MS 为准）","写全球化的「成因」——阅卷报告明确指出离题不得分","收益与成本只罗列名词、没有机制链","判断句缺席或只有「有利有弊」——Evaluation 停在 Level 1–2","把涓滴理论当作无条件成立的收益——与官方表述相反"],
 zh:["全球化是各国经济一体化（economic integration）程度不断加深的过程，表现为贸易、外国直接投资（foreign direct investment, FDI）、移民（migration）和技术转移的增加。「收益是否大于成本」无法抽象地回答：它取决于具体的国家、国内谁得益谁受损，以及与之配套的政策。本文以中国为例——中国是过去四十年一体化（integration）最大的单一受益者，也是最大的贡献者。总体而言，对中国来说收益大于成本，但优势幅度关键取决于再分配和规制，而且成本集中落在最无力承受的群体身上。",
 "核心收益来自比较优势法则。中国专业化于劳动密集型制成品——其机会成本（opportunity cost）最低的领域——并进口资本与技术密集型产品，从而达到了仅靠自身资源无法实现的消费和生产水平：专业化提高了世界产出，贸易使中国分享了这一收益。以世界规模进行出口生产带来了规模经济，压低了长期平均成本（long-run average cost, LRAC），进一步提高了竞争力，形成累积过程。出口收入和 FDI 流入提高了投资和总需求（aggregate demand, AD），带来了数十年的高速增长。政府税收随利润和收入上升，为基础设施和公共服务（public service）提供资金，又反过来强化这一过程。生产可能性边界图刻画了这一静态收益：专业化和贸易之后，消费点位于自给自足时约束经济的那条曲线之外。",
 "消费者和劳动者直接受益。进口竞争和供给扩张压低了价格、增加了选择，提高了消费者剩余和配置效率（allocative efficiency）；技术转移和新管理技术通过合资企业（joint venture）和供应链（supply chain）扩散。最重要的是，对一个发展中经济体（developing economy）而言，出口导向部门更高的实际 GDP（real GDP） 创造了数以亿计的就业，并使绝对贫困出现了历史性下降：劳动者从低生产率（productivity）的农业转移到高生产率的工业，全经济的实际收入（real income）上升。在一体化世界经济中的劳动力迁移（labour migration）同样缩小了其他地方的地区不平等，例如欧盟内东欧工人迁往西欧。",
 "与之相对的是严重的成本，它们从三个方面限定上述判断。第一，中国国内不平等急剧加剧：收益不成比例地流向沿海省份、资本所有者和技能劳动者，而内陆地区和非技能劳动者获益要少得多。「顶端收入更高最终会涓滴到所有人」的说法站不住脚——官方对涓滴理论的结论是：几乎没有证据表明它在实践中有效。第二，一体化部分建立在被剥削的劳动之上：出口工厂的低工资、长工时和差的健康安全条件。第三，存在外部成本（external cost）。生产扩张和长途货运增加了污染和不可再生资源消耗，把成本加诸他人和后代，使可持续增长更难实现。",
 "另一个成本是脆弱性。为出口市场专业化的经济体暴露于外部冲击：当全球需求下降，或伙伴国提高关税（tariff）时，出口部门会把冲击直接传导到国内就业。同样的相互依存（interdependence）也反向运作——当中国自身增长在 2024 年放缓到 5% 时，其进口需求下降（2024 年进口 2.6 万亿美元），压低了向其供应大宗商品（commodity）和资本品的生产者的出口收入和增长。对进口的过度依赖（over-dependence）也会恶化关系另一端国家的经常账户（current account）。这些成本是真实的，但要注意它们的性质：它们大多是全球化「如何被治理」的成本——薄弱的劳工与环境标准、缺失的再分配——而不是贸易本身降低福利的证明。",
 "对中国权衡两侧，收益大于成本。收益——更高的产出、更低的价格、大规模就业和历史上最大规模的绝对贫困削减——是全经济范围且累积的；而主要成本落在可识别的群体身上，并且可以用全球化本身产生的税收来缓解：对被替代/失业（unemployment）工人的转移支付（transfer payment）和再培训（retraining）、强制执行的劳工标准（labour standard）和污染管制。但这一判断是有条件的。对一个无法征税、无法规制或无法再培训的国家——或一个面临贸易条件（terms of trade）恶化的初级产品（primary product）出口国——同样的力量完全可能产生超过收益的成本。因此，全球化的净效应不是关于贸易的事实，而是关于政策的事实。"]},

 structure:[["第 1 段 · 定义与选定国家","定义专业化与比较优势；选定英国（comparative advantage；服务业专业化国），预告判断。"],

 paras:[
 "Specialisation means concentrating resources on producing a narrower range of goods and services, and the law of comparative advantage states that a country gains by specialising in what it can produce at the lowest opportunity cost and trading for the rest. The United Kingdom illustrates the question: services account for a much higher share of UK (and US) GDP than in Italy or Canada, reflecting a comparative advantage in financial, professional and creative services. This essay evaluates the benefits of that specialisation for the UK, and argues that they are substantial but conditional on the terms of trade obtained and on the economy's capacity to adjust.",
 "The fundamental benefit is that trade allows consumption beyond the production possibility curve. If the UK devotes resources to services, in which its opportunity cost is low, and imports manufactures in which its opportunity cost is high, total world output rises because each unit of resources is used where it is relatively most productive. Through trade at a price between the two countries' opportunity cost ratios, the UK can consume a combination of goods and services outside its own PPC — a combination that is simply unattainable in autarky. Living standards rise because the same national resources now command a larger bundle of goods and services. This is a real-income gain, and it is the analytical core of every other benefit.",
 "Specialisation also generates dynamic gains through economies of scale. Concentrating on services lets UK firms serve a world market rather than a domestic one of 67 million people; as output expands, firms move down their long-run average cost curves, spreading the fixed costs of technology, compliance and reputation over far more transactions. Lower LRAC means lower export prices for services, which raises the UK's international competitiveness in exactly the sectors where world demand is growing fastest. The result is a stronger trade balance in services, higher AD and growth, and increased investment and employment in the service sector. There is a further welfare gain: greater allocative efficiency in world markets lowers prices generally, contributing to lower global inflation.",
 "These benefits, however, rest on a model with unrealistic assumptions, and this is the first qualification. The comparative advantage model ignores transport costs, which for some traded services and goods eat into the margin that makes trade worthwhile. More seriously, it assumes factors of production are perfectly mobile between industries with no diminishing returns. In reality, workers released from declining UK manufacturing face occupational immobility — their skills, location and age do not transfer costlessly to financial services in London — so specialisation creates structural unemployment and regional decline during the adjustment, a cost the static model simply assumes away. The benefits also depend on which services a country specialises in and how far it can specialise: a narrow specialisation in volatile financial services transmits global shocks straight into the domestic economy, as in 2008.",
 "Second, specialisation increases vulnerability. A country that imports most of its food, energy or manufactures is exposed to changes in global commodity prices and to suppressed global demand, and long supply chains run on just-in-time principles break down when key components are in short supply, producing shortages and higher prices for consumers. There is also a distributional and intertemporal catch: trade after specialisation is mutually beneficial only if the terms of trade settle between the two opportunity cost ratios; if the UK's export prices deteriorate relative to its import prices, part of the gain leaks abroad. Finally, expanded output can mean over-exploitation of resources and external costs, such as the pollution and global warming caused by increased transportation, which the PPC diagram does not record.",
 "Overall, the benefits of specialisation and trade for the UK outweigh these qualifications: the PPC gain and the scale economies in services are large, permanent and reinforced by growing world demand for services, whereas the main costs are transitional (adjustment and structural unemployment) or manageable through policy (diversification of suppliers, strategic reserves, retraining). But the judgement is genuinely conditional — the benefits are largest when the terms of trade lie comfortably inside the opportunity cost range and when labour markets can reallocate workers; a developed country that specialised narrowly, on deteriorating terms of trade, with immobile labour, would capture far less of the theoretical gain."],
 chains:"收益链：比较优势（服务业机会成本低）→ 专业化 → 世界产出↑ → 贸易后消费超出 PPC；规模链：世界市场（world market） → 产量↑ → 沿 LRAC 下行 → 出口价格↓ → 竞争力↑ → 服务贸易顺差（trade surplus）、AD↑、就业↑。风险链：要素不完全流动 → 衰退（recession）行业工人职业流动性障碍（occupational immobility of labour） → 结构性失业；专业化过窄 + 长供应链 → 外部冲击与中断直接传导。",
 whyEval:"评价有效的原因：(1) 假设批判不停留在「不现实」，而是逐个落到后果（运输成本吃掉贸易边际、要素不流动产生结构性失业）；(2) 提出贸易互利的精确条件——贸易条件须落在机会成本比率之间，这是官方清单里最能显示理解深度的评价点；(3) 脆弱性用了 2008 与供应链中断作证据。这样的评价是「critical of the evidence」，不是套话。",
 whyJudge:"判断有说服力，因为它把收益与成本按性质分类：收益是大的、永久的、被需求增长强化的；成本是过渡性的或可由政策管理的——分类本身给出了权衡的理由，最后再用三个可检验条件收口。",
 lose:["不选定发达国家——应用落空，本题最常见的丢分（封顶以官方 MS 为准）","只写收益不评价：Evaluate 题没有判断进不了高档","比较优势只背定义、不做机会成本/PPC 推导，链条停在 Level 2","评价只说「模型假设不现实」而不展开后果","混淆绝对优势（absolute advantage）与比较优势：用「英国服务业产出大」论证应出口服务"],
 zh:["专业化是指把资源集中于生产较窄范围的商品和服务；比较优势法则指出，一国专业化于其机会成本最低的产品、其余靠贸易获得，即可获益。英国正是本题的例证：服务业占英国（和美国）GDP 的比重远高于意大利和加拿大，反映了其在金融、专业和创意服务上的比较优势。本文评价这种专业化对英国的收益，并认为收益可观，但以所获贸易条件和经济的调整能力为条件。",
 "最根本的收益是贸易使消费能够超出生产可能性边界（production possibility curve, PPC）。如果英国把资源投入机会成本低的服务业，进口机会成本高的制成品，由于每一单位资源都被用在相对最有效率的地方，世界总产出上升。通过按介于两国机会成本比率之间的价格进行贸易，英国可以消费一个位于自身 PPC 之外的商品与服务组合——一个在自给自足下根本无法达到的组合。生活水平上升，因为同样的国民资源现在能换得更大的商品与服务束。这是实际收入（real income）的收益，也是其他一切收益的分析核心。",
 "专业化还通过规模经济产生动态收益（dynamic gains）。专注于服务业使英国企业面对的是世界市场，而不是 6700 万人的国内市场；随着产量扩大，企业沿长期平均成本（long-run average cost, LRAC）曲线下行，把技术、合规和声誉的固定成本分摊到多得多的交易上。LRAC 下降意味着服务出口价格更低，这恰好提高了英国在世界需求增长最快的部门中的国际竞争力（international competitiveness）。结果是服务贸易差额更强、总需求（aggregate demand, AD）和增长更高、服务业投资和就业增加。还有一层福利收益：世界市场配置效率的提高普遍压低价格，有助于降低全球通胀（inflation）。",
 "然而，这些收益建立在一个假设不现实的模型之上，这是第一点限定。比较优势模型忽略运输成本，而对某些贸易的服务和商品来说，运费会吃掉使贸易值得进行的边际。更严重的是，它假设生产要素在产业间完全流动且没有递减收益。现实中，从衰落的英国制造业（manufacturing sector）释放出的工人面临职业流动性障碍——他们的技能、地点和年龄无法无成本地转移到伦敦的金融服务业——因此专业化在调整期会造成结构性失业和地区衰落，而静态模型把这种成本直接假设掉了。收益还取决于一国专业化于哪些服务、能专业化到什么程度：狭窄地专业化于波动性大的金融服务，会把全球冲击直接传导到国内经济，2008 年就是如此。",
 "第二，专业化增加了脆弱性。一个大部分食品、能源或制成品依赖进口的国家，暴露于全球大宗商品（commodity）价格变动和全球需求受压之下；建立在准时制原则上的长供应链在关键部件短缺时会断裂，造成短缺和消费者价格上升。还有分配和跨期的问题：专业化之后的贸易只有在贸易条件落在两个机会成本比率之间时才互利；如果英国的出口价格相对进口价格恶化，部分收益就会漏到国外。最后，产出扩张可能意味着资源的过度开发和外部成本（external cost），如运输增加造成的污染和全球变暖，而 PPC 图并不会记录这些。",
 "总体而言，专业化与贸易对英国的收益大于这些限定：PPC 收益和服务业的规模经济是巨大的、永久的，并被世界服务需求的增长所强化；而主要成本是过渡性的（调整与结构性失业）或可由政策管理的（供应商多元化、战略储备、再培训（retraining））。但这一判断确实是有条件的——当贸易条件稳稳落在机会成本区间内、且劳动力市场能重新配置工人时，收益最大；一个狭窄专业化、贸易条件恶化、劳动力无法流动的发达国家，能获得的理论收益要少得多。"]}

 demand:"题目用 WTO 数据锚定现象：1995–2022 年发展中经济体（developing economy）出口份额上升、发达经济体（developed economy）份额下降；要求评价「影响国家间贸易格局（pattern of trade）的因素」。贸易格局 = 构成（交易什么）+ 地理分布（与谁交易），每个因素都必须落到这两个维度之一，并结合自选国家展开应用。",

 structure:[["第 1 段 · 定义与框架","定义贸易格局（构成 + 流向）；预告两个主因素：比较优势（comparative advantage）的转移、新兴经济体（emerging economy）开放与 FDI；判断先行：组合作用大于单一因素。"],

 ao:[["AO1 Knowledge","贸易格局定义准确；因素取官方清单：比较优势、新兴经济体开放、贸易集团/双边协定、汇率、保护主义、竞争力、FDI、去工业化（industrialisation）。"],
 ["AO2 Application","WTO 份额数据（1995–2022）要嵌入论证；国家例子：中国、东欧、美英去工业化。"],
 ["AO3 Analysis","每个因素走满链：成本/制度变化 → 企业选址与专业化（specialisation） → 出口构成变化 → 份额变化。"],
 ["AO4 Evaluation","回流、汇率波动、报复与退出集团构成「可逆性」评价；结尾给组合与排序判断。"]],
 paras:[
 "The pattern of trade describes both the composition of a country's exports and imports — what is traded — and their geographical distribution — with whom it is traded. Between 1995 and 2022, according to the WTO, the share of developing economies in world exports rose while the share of developed economies fell. This essay argues that the shift is explained mainly by a movement in comparative advantage towards emerging economies, made effective by their opening to the world economy and by large inflows of FDI; trading blocs, exchange rates and protectionism then modified the speed and direction of the change. No single factor suffices: the pattern changed because the factors acted together.",
 "The deepest factor is comparative advantage, which is not fixed. A country exports goods in which its opportunity cost is lowest, and opportunity costs change as wages, technology and endowments change. In the 1990s China's unit labour costs in manufacturing were a small fraction of those in the USA or UK, while its workforce was increasingly literate and disciplined; its comparative advantage therefore lay in labour-intensive manufactures. As resources worldwide were reallocated towards that advantage, the composition of world trade changed: manufactures increasingly originated in developing economies, while developed economies, losing their low-cost manufacturing, specialised further in services and high-technology goods in which their opportunity costs were lower. The geographical pattern changed with the composition — trade routes and supply chains re-centred on East Asia. A numerical or PPC illustration makes the mechanism precise: when relative opportunity costs move, the specialisation pattern, and hence the pattern of trade, must move with them.",
 "Comparative advantage alone, however, explains potential rather than actual trade; two institutional factors converted it into the observed shift. First, political opening: the collapse of communism and the reform of China brought previously closed economies into the world market, and FDI followed — multinational firms built manufacturing capacity inside developing economies, which directly raised those economies' manufactured exports. Second, the growth of trading blocs and bilateral trading agreements increased trade creation between members, redirecting flows towards partner countries; China's 28 free-trade agreements and its membership of RCEP, a bloc contributing one-third of world GDP, are the clearest current example. Developed economies meanwhile experienced deindustrialisation, with manufacturing shrinking as a share of national output, which entrenched the new pattern from the other side.",
 "Several qualifications limit any single-factor story. The law of comparative advantage rests on unrealistic assumptions — constant costs and perfectly mobile resources — so actual adjustment is slower and more painful than the model implies. More concretely, the process contains its own brake: as Chinese wages and transport costs rise, the cost advantage narrows, and some manufacturing has already returned to developed economies or moved to other developing economies (reshoring and near-shoring), partially reversing the pattern. Exchange rates add instability: they are highly volatile, and a currency movement — or a deliberate policy of preventing appreciation, as China has been accused of practising — can redraw relative prices and flows again in the long run. Protectionism cuts both ways, since tariffs and subsidies make imports relatively more expensive and provoke retaliation, and countries leaving trading blocs can suddenly reverse years of trade creation.",
 "Time horizon matters throughout. In the short run, contracts, sunk investment in factories and existing supply chains fix the pattern; in the long run, costs, technology and policy all move. The factors also differ in importance between economies: exchange-rate policy matters most for countries managing their currencies, bloc membership most for small open economies, and FDI most for economies with the infrastructure to absorb it.",
 "In conclusion, the changing pattern of trade since 1995 is best explained by comparative advantage shifting towards emerging economies as their costs and capabilities changed, with opening, FDI and trading agreements determining how fast the shift occurred; China's trajectory is the paradigm case. But the pattern is not locked in: rising wages, reshoring, volatile exchange rates and protectionist retaliation can each bend it back, so the most defensible judgement is that cost-driven comparative advantage sets the direction, institutions set the pace, and policy shocks set the exceptions."],
 chains:"因素一链：工资/技术变化 → 机会成本移动 → 制造业比较优势移向新兴经济体 → 专业化与流向重塑 → 发展中份额↑。因素二链：政治开放 → FDI 流入建产能 → 制成品出口↑；集团/双边协定 → 贸易创造 → 流向向成员国集中。评价链：工资↑+运费↑ → 成本优势收窄 → 回流 → 格局部分逆转。",
 whyEval:"评价有效的原因：(1) 指出模型假设与现实调整的差距（成本不变、要素完全流动）；(2) 提出自我制动机制——成功本身推高工资、侵蚀优势，这是高阶评价而非清单式「缺点」；(3) 汇率与报复说明格局的可逆性；(4) 明确短长期与国家差异。官方清单中的评价点几乎全部落地，且组织成论证而非罗列。",
 whyJudge:"判断有说服力，因为它给因素分工：方向（比较优势）、速度（制度）、例外（政策冲击）——这种「分层判断」比简单排序更能解释 1995–2022 的数据，也能解释为什么同一时期不同国家轨迹不同。",
 lose:["把贸易格局写成贸易量（trade volume）——构成与流向一个不落才算切题","因素罗列 4 个以上、每个只有两环（阅卷报告点名的典型低分形态）","不结合具体国家，应用停留在抽象层面","评价与 KAA 重复：把因素换个说法再说一遍","漏掉 FDI 与开放这两个把「潜在优势」变成「实际格局」的通道"],
 zh:["贸易格局既指一国进出口的构成——交易什么——也指其地理分布——与谁交易。据 WTO 数据，1995 年至 2022 年间，发展中经济体在世界出口中的份额上升，发达经济体的份额下降。本文认为，这一变化主要由比较优势向新兴经济体的转移来解释，而新兴经济体向世界经济开放和大规模 FDI 流入使这种转移成为现实；贸易集团、汇率和保护主义则改变了变化的速度和方向。没有任何单一因素足够：格局之所以改变，是因为各因素共同作用。",
 "最深层的因素是比较优势，而比较优势不是固定的。一国出口其机会成本最低的商品，而机会成本随工资、技术和禀赋的变化而变化。1990 年代，中国制造业的单位劳动成本（unit labour cost, ULC）只是美国或英国的零头，其劳动力识字率（literacy rate）和纪律性又不断提高；因此其比较优势在于劳动密集型制成品。随着全球资源向这一优势重新配置，世界贸易的构成改变了：制成品越来越多地源自发展中经济体，而发达经济体在失去低成本制造业后，进一步专业化于其机会成本更低的服务和高技术商品。地理格局随构成一起改变——贸易路线和供应链（supply chain）重新以东亚为中心。数值例或 PPC 图可以把机制说精确：当相对机会成本移动时，专业化格局、进而贸易格局必然随之移动。",
 "然而，比较优势本身解释的是潜在贸易而非实际贸易；两个制度因素把潜力转化成了观察到的变化。第一是政治开放：共产主义的垮台和中国的改革把此前封闭的经济体带入世界市场（world market），FDI 随之而来——跨国公司（multinational company, MNC）在发展中经济体内部建设制造产能，直接提高了这些经济体的制成品出口。第二，贸易集团和双边贸易协定（bilateral trading agreement）的增长增加了成员之间的贸易创造，把流向重新导向伙伴国；中国签署的 28 个自由贸易协定（free-trade agreement）及其加入的 RCEP——一个贡献世界 GDP 三分之一的集团——是当前最清晰的例子。与此同时，发达经济体经历了去工业化，制造业占国民产出的比重下降，从另一侧固化了新格局。",
 "几点限定使任何单一因素叙事都站不住。比较优势法则基于不现实的假设——成本不变、资源完全流动——因此实际调整比模型暗示的更慢、更痛苦。更具体地说，这个过程包含自身的刹车：随着中国工资和运输成本上升，成本优势收窄，一些制造业已经回流发达国家或转移到其他发展中国家（developing country；回流与近岸化），部分逆转了格局。汇率增加了不稳定性：汇率高度波动，一次货币变动——或像中国被指责的那样蓄意阻止升值（appreciation）的政策——长期内可以重新绘制相对价格和流向。保护主义的作用是双向的：关税（tariff）和补贴（subsidy）使进口相对变贵并引发报复，而国家退出贸易集团可以突然逆转多年的贸易创造。",
 "时间维度贯穿始终。短期内，合同、工厂的沉没投资和既有供应链固定了格局；长期内，成本、技术和政策都在移动。各因素对不同经济体的重要性也不同：汇率政策对管理本币（domestic currency）的国家最重要，集团成员资格对小型开放经济体最重要，FDI 对有基础设施承接它的经济体最重要。",
 "总之，1995 年以来贸易格局的变化，最好由比较优势随新兴经济体成本和能力变化而转移来解释，开放、FDI 和贸易协定（trade agreement）决定了转移的速度；中国的轨迹是典范案例。但格局并未锁定：工资上升、回流、汇率波动和保护主义报复都可能使其回摆。因此最站得住的判断是：成本驱动的比较优势决定方向，制度决定速度，政策冲击决定例外。"]},
"202310-8":{ch:"Ch.25",diagram:"adas",
 demand:"题目给数据：2000–2020 年直布罗陀贸易条件（terms of trade）恶化 44.6%、希腊恶化 14.3%；问「哪些因素可能导致一国贸易条件恶化」。本题官方核对硬规则：只写 2 个因素、每个走多环节箭头链；必须点名国家（不点名 KAA 封顶 Level 3 即 9 分）；只写因素不写影响；评价须对两因素排序并给出有依据的判断（informed judgement）。范文选「汇率（exchange rate）贬值（depreciation）」与「相对生产率（productivity）上升」两因素。",
 command:"Evaluate factors：与 202101-8（问影响）正好镜像——本题写「影响」整段偏题。KAA 12 分看两条链的深度与国家应用；Evaluation 8 分看排序、幅度、持续时间与国家类型差异。注：本题官方评价清单未逐字核全，范文评价按排序/幅度/短长期/净进口-出口国等官方同系列口径展开。",
 structure:[["第 1 段 · 定义与框架","定义贸易条件 + 公式；声明只深写两个因素：贬值、相对生产率上升；预告排序判断。"],
 ["第 2 段 · 因素一：汇率贬值（KAA）","贬值 → 外币（foreign currency）计价出口价↓、本币（domestic currency）计价进口价↑ → Px/Pm↓ → 贸易条件恶化；以希腊/欧元区背景与英镑贬值作国家落点。"],
 ["第 3 段 · 因素二：相对生产率上升（KAA）","生产率↑（含资本投资驱动）→ 单位成本（unit cost）↓ → 出口价格↓ → 贸易条件恶化；以德国式制造业（manufacturing sector）生产率作落点，并点明反直觉性。"],
 ["第 4 段 · 评价一：排序与幅度（Evaluation）","对两国数据排序：直布罗陀 −44.6% 远大于希腊 −14.3%；贬值是价格水平（price level）的即时冲击，生产率是缓慢趋势——持续性与可逆性不同。"],
 ["第 5 段 · 评价二：恶化≠受害（Evaluation）","生产率型恶化伴随数量与收入上升；贬值型恶化的差额后果取决于马歇尔-勒纳；净进口/出口国、大宗商品（commodity）构成改变哪类因素占主导。"],
 ["第 6 段 · 判断","对大多数国家，汇率渠道是短期内最强因素；生产率渠道决定长期趋势；哪一因素主导取决于该国的贸易构成与汇率制度（exchange rate system）。"]],
 ao:[["AO1 Knowledge","贸易条件定义与公式准确；因素取官方清单中的两个（贬值、相对生产率↑——含资本投资→生产率一条）。"],
 ["AO2 Application","题干两国数据（−44.6% / −14.3%）用进评价排序；链条中点名具体国家与情境。"],
 ["AO3 Analysis","每条因素链至少 4 环，且方向逐步推导（价格如何一步步传导到 Px/Pm）。"],
 ["AO4 Evaluation","排序 + 幅度 + 持续时间/可逆性 + 净进口/出口国差异 + 「恶化≠福利受损」的批判性判断。"]],
 paras:[
 "The terms of trade measure the ratio of a country's export prices to its import prices, expressed as an index: (index of export prices ÷ index of import prices) × 100. A worsening, or deterioration, means that each unit of exports now buys fewer imports. Between 2000 and 2020 the terms of trade worsened by 44.6% in Gibraltar and by 14.3% in Greece. Many factors can produce such a deterioration, but this essay examines two in depth — a depreciation of the exchange rate, and a rise in relative productivity — and argues that depreciation is normally the more powerful short-run factor, while productivity determines the long-run trend.",
 "First, depreciation of the currency worsens the terms of trade directly through prices. When a currency depreciates, the price of the country's exports expressed in foreign currency falls, because foreign buyers now need less of their own currency to buy them; at the same time the price of imports expressed in domestic currency rises, because each unit of foreign currency costs more. Export prices therefore fall relative to import prices, and the terms of trade index falls. The mechanism is immediate and mechanical: it requires no change in real quantities at all. Greece illustrates the constraint version of this channel — as a euro member it could not depreciate externally after 2010, so adjustment took other forms — whereas a country with its own floating currency, such as the UK when sterling fell sharply in 2016, experiences an instant deterioration in its terms of trade through exactly this price channel, with import prices rising across the whole basket of traded goods.",
 "Second, a rise in relative productivity worsens the terms of trade, paradoxically, by making the country more efficient. If productivity in a country's export industries rises faster than in its trading partners — for example through higher levels of capital investment, which raise output per worker — then unit labour costs fall. Facing competition in world markets, firms pass part of the cost reduction into lower export prices to gain market share. Import prices, determined abroad, are unchanged, so export prices fall relative to import prices and the terms of trade deteriorate. This is the channel associated with persistently efficient manufacturing exporters such as Germany: decades of productivity growth in export industries have been partly given away to foreign consumers through lower prices rather than fully retained as higher domestic incomes. Lower relative labour costs and lower relative inflation work through the same route — anything that holds export prices down relative to import prices worsens the index.",
 "Evaluating the two factors, they differ in speed, size and reversibility. Depreciation is fast and can be large: a sharp currency fall moves every export and import price at once, which is consistent with a deterioration on the scale of Gibraltar's 44.6% over a period that includes major currency and price shocks. Productivity-driven deterioration is slow and cumulative — a trend of a fraction of a percent a year, closer in character to Greece's 14.3% over two decades. Depreciation can also reverse if the currency recovers, whereas productivity gains are permanent. On magnitude and speed, therefore, the exchange rate is the more significant factor for explaining a large worsening over a defined period; on persistence, productivity matters more.",
 "A second evaluation point is that a worsening caused by these factors is not necessarily harmful, and this affects how much weight each factor deserves in explaining welfare-relevant change. Cheaper exports after a depreciation sell in larger quantities, so export revenue and the current account may improve even as the terms of trade worsen, provided the Marshall–Lerner condition holds — the sum of the price elasticities of demand for exports and imports exceeding one. Likewise, productivity-driven deterioration accompanies rising output and real incomes: the country gives away part of its efficiency gain in prices but keeps the rest in volume. Which factor dominates also depends on the country's trade structure: for a net exporter of commodities, a fall in commodity prices can swamp both channels, while for a net importer the same price movement improves the terms of trade instead.",
 "In conclusion, a country's terms of trade worsen when export prices fall relative to import prices, and of the two factors examined, depreciation is the more powerful explanation of a large deterioration in the short run because it reprices all trade immediately, while rising relative productivity produces a slower, permanent deterioration that is partly a sign of economic strength. The ranking reverses over long horizons, and for commodity-dependent economies both can be overridden by world commodity prices — the correct judgement is therefore conditional on the period and on the structure of the country's trade, as the contrast between Gibraltar's 44.6% and Greece's 14.3% deterioration itself suggests."],
 chains:"因素一链：贬值 → 外币计价出口价格↓ + 本币计价进口价格↑ → Px/Pm↓ → 贸易条件恶化（即时、纯价格效应）。因素二链：资本投资（capital investment）↑ → 生产率↑ → 单位劳动成本（unit labour cost, ULC）↓ → 竞争迫使出口价格↓ → Px 相对 Pm↓ → 贸易条件恶化（缓慢、趋势性）。",
 whyEval:"评价有效的原因：(1) 排序有维度——速度、幅度、可逆性、持续性四个标准逐项比较两个因素，而不是笼统说「都很重要」；(2) 用题干数据作排序证据（−44.6% 的量级更像汇率/价格冲击，−14.3% 更像趋势）；(3) 拆穿「恶化 = 受害」的直觉：数量效应（马歇尔-勒纳）与生产率的收入效应使福利判断反转；(4) 指出第三类因素（大宗商品价格）何时压倒前两者，判断因此有边界。",
 whyJudge:"判断有说服力，因为它不给绝对排名，而是「短期汇率主导、长期生产率主导、商品依赖型经济例外」的条件式结论——与题目给出的两国数据差异相互印证，考官能看到判断是从证据里长出来的。",
 lose:["写贸易条件恶化的「影响」——本题问因素，影响整段偏题（与 202101-8 串答案是最典型的翻车）","写 3–4 个因素每个都很浅：官方规则是 2 个因素写深","不点名国家：KAA 封顶 Level 3（9 分）","把 Prebisch-Singer 或弹性当作评价主体堆砌：本题评价的核心是排序、幅度、持续时间与国家类型","因素链断裂：只说「贬值使贸易条件恶化」不推导价格传导的中间环节"],
 zh:["贸易条件衡量一国出口价格与进口价格的比率，以指数表示：（出口价格指数 ÷ 进口价格指数）× 100。恶化意味着每单位出口现在能换回的进口更少。2000 年至 2020 年间，直布罗陀的贸易条件恶化了 44.6%，希腊恶化了 14.3%。许多因素可以造成这种恶化，但本文深入考察其中两个——汇率贬值和相对生产率上升——并认为贬值通常是更强的短期因素，而生产率决定长期趋势。",
 "第一，货币贬值（currency depreciation）通过价格直接恶化贸易条件。当一国货币贬值时，以外币表示的该国出口价格下降，因为外国买家现在只需更少本币即可购买；与此同时，以本币表示的进口价格上升，因为每单位外币的成本更高。因此出口价格相对进口价格下降，贸易条件指数（terms of trade index）下跌。这一机制即时且机械：它根本不需要实际数量发生任何变化。希腊展示了这一渠道的受约束版本——作为欧元成员国，它在 2010 年后无法对外部贬值，调整只能采取其他形式——而拥有自己浮动货币的国家，如 2016 年英镑大幅下跌时的英国，会通过完全相同的价格渠道经历贸易条件的即时恶化，整个贸易品篮子的进口价格上升。",
 "第二，相对生产率上升会恶化贸易条件——悖论在于，它是通过让国家更有效率来实现的。如果一国出口产业的生产率上升快于其贸易伙伴——例如通过更高水平的资本投资提高人均产出——那么单位劳动成本下降。面对世界市场（world market）的竞争，企业把成本下降的一部分转化为更低的出口价格以争夺市场份额。进口价格由国外决定、保持不变，因此出口价格相对进口价格下降，贸易条件恶化。这是与德国这类持续高效的制造业出口国相联系的渠道：出口产业数十年的生产率增长，有一部分通过更低的价格让给了外国消费者，而没有完全以更高的国内收入形式保留下来。较低的相对劳动成本（labour cost）和较低的相对通胀（inflation）通过同一路径起作用——凡是把出口价格相对进口价格压低的因素，都会使指数恶化。",
 "在评价这两个因素时，它们在速度、幅度和可逆性上不同。贬值快且可以很大：一次大幅的货币下跌会同时重新定价所有出口和进口价格，这与直布罗陀在包含重大货币和价格冲击的时期内 44.6% 的恶化量级相符。生产率驱动的恶化缓慢而累积——每年零点几个百分点的趋势，性质上更接近希腊二十年里 14.3% 的变化。贬值在货币回升时也可以逆转，而生产率收益是永久的。因此，在幅度和速度上，汇率是解释一段确定时期内大幅恶化的更重要因素；在持续性上，生产率更重要。",
 "第二个评价点是：由这些因素造成的恶化未必有害，这影响每个因素在解释与福利相关的变化时应占的权重。贬值后更便宜的出口品销量更大，因此即使贸易条件恶化，出口收入和经常账户（current account）也可能改善，前提是马歇尔-勒纳条件（Marshall–Lerner condition）成立——进出口需求价格弹性（price elasticity of demand, PED）之和大于 1。同样，生产率驱动的恶化伴随着产出和实际收入（real income）的上升：国家在价格上让出了一部分效率收益，但以数量形式保留了其余部分。哪个因素占主导还取决于国家的贸易结构：对大宗商品净出口国（net exporter）来说，大宗商品价格下跌可以压倒这两个渠道，而对净进口国（net importer），同样的价格变动反而改善贸易条件。",
 "总之，当出口价格相对进口价格下降时，一国贸易条件恶化；在所考察的两个因素中，贬值是短期内大幅恶化更有力的解释，因为它即时重新定价全部贸易；而相对生产率上升产生更缓慢、永久性的恶化，且部分是经济强健的标志。这一排序在长期会逆转，对依赖大宗商品的经济体，两者都可能被世界大宗商品价格压倒——因此正确的判断取决于时期和该国贸易结构，正如直布罗陀 44.6% 与希腊 14.3% 的恶化对比本身所提示的。"]}
});

<script>
/* ============ MCQ 自编练习题（依据已核对的 Section A 考查范围；非 Pearson 官方真题。官方原题 36 道见下方第二轮数据块 MCQ_OFF） ============ */
const MCQ_SRC="自编练习题 · 依据官方 Specification 范围与已核对的 Section A 考点（如贸易条件计算）编写，非官方真题";
const MCQS=[
{id:"mcq01",kp:"kp25a",ch:"Ch.25",spec:"主题 2 · 2.4 贸易条件计算",
 q:"In the base year, a country's index of export prices and index of import prices are both 100. In the current year, the index of export prices is 108 and the index of import prices is 120. What is the country's terms of trade index in the current year, and what has happened to its terms of trade?",
 qzh:"基年一国出口价格指数与进口价格指数均为 100。今年出口价格指数为 108、进口价格指数为 120。该国今年的贸易条件指数（terms of trade index）是多少，贸易条件（terms of trade）如何变化？",
 opts:["90 — the terms of trade have worsened","90 — the terms of trade have improved","111.1 — the terms of trade have improved","111.1 — the terms of trade have worsened"],ans:0,
 why:"ToT = (108 ÷ 120) × 100 = 90。指数低于 100（基年）→ 每单位出口换回的进口减少 → 贸易条件恶化 (worsening)。",
 wrong:["—","指数 90 < 100 表示出口相对变便宜，是恶化不是改善，方向判断错误。","111.1 是把公式倒置（120÷108）的结果，且方向随之全错。","111.1 来自公式倒置；即便指数大于 100 也应是改善，前后矛盾。"]},
{id:"mcq02",kp:"kp25b",ch:"Ch.25",spec:"主题 2 · 2.4 贸易条件改善因素",
 q:"Which of the following would, other things being equal, cause an improvement in a country's terms of trade?",
 qzh:"在其他条件不变时，下列哪一项会使一国贸易条件（terms of trade）改善？",
 opts:["A rise in the country's relative productivity","A depreciation of the country's currency","A rise in the country's relative rate of inflation","A fall in the country's relative labour costs"],ans:2,
 why:"相对通胀率（inflation rate）较高 → 出口价格涨得比进口价格快 → Px/Pm 上升 → 贸易条件改善。这是官方清单中的反直觉点：高通胀（inflation）在算术上「改善」贸易条件（但损害竞争力）。",
 wrong:["生产率（productivity）上升 → 单位成本（unit cost）下降 → 出口价格下降 → 贸易条件恶化，方向相反。","贬值（depreciation） → 出口价格（外币（foreign currency）计）下降、进口价格上升 → 贸易条件恶化。","—","相对劳动成本（labour cost）下降 → 出口价格下降 → 贸易条件恶化。"]},
{id:"mcq03",kp:"kp23a",ch:"Ch.23",spec:"主题 2 · 2.1 比较优势",
 q:"Country X can produce 1 unit of cloth with 2 hours of labour and 1 unit of wine with 4 hours. Country Y can produce 1 unit of cloth with 6 hours and 1 unit of wine with 8 hours. In which good does Country X have a comparative advantage?",
 qzh:"X 国用 2 小时生产 1 单位布、4 小时生产 1 单位酒；Y 国用 6 小时生产 1 单位布、8 小时生产 1 单位酒。X 国在哪个商品上有比较优势（comparative advantage）？",
 opts:["Wine, because it has an absolute advantage in both goods","Cloth, because its opportunity cost of cloth is lower","Wine, because its opportunity cost of wine is lower","Neither good, because it has an absolute advantage in both"],ans:1,
 why:"机会成本（opportunity cost）：X 生产 1 单位布 = 2/4 = 0.5 单位酒；Y 生产 1 单位布 = 6/8 = 0.75 单位酒。X 的布机会成本更低 → 比较优势在布。X 在两种商品上都有绝对优势（absolute advantage），但比较优势只能在一个商品上。",
 wrong:["绝对优势不决定专业化（specialisation）方向；且 X 的酒机会成本（2 单位布）高于 Y（约 1.33 单位布），酒恰是其比较劣势。","—","X 生产 1 单位酒的机会成本是 2 单位布，Y 约为 1.33 单位布，X 更高，判断反了。","比较优势必然存在：机会成本比率不同，两国各在一个商品上有比较优势。"]},
{id:"mcq04",kp:"kp21b",ch:"Ch.21",spec:"主题 1 · 1.2 全球化成因",
 q:"Which of the following is most directly a cause of increased globalisation over the last 50 years?",
 qzh:"下列哪一项最直接是过去 50 年全球化（globalisation）加深的成因？",
 opts:["A rise in world income inequality","Containerisation reducing the cost of transporting goods","A fall in absolute poverty in developing countries","An increase in the number of multinational companies' overseas profits"],ans:1,
 why:"集装箱化（containerisation）使运输成本骤降（集装箱量 1980–2020 约增 20 倍），是官方清单的首要成因。其余三项都是全球化的「影响/结果」，不是成因——这正是 202201-8 阅卷报告点名的离题陷阱。",
 wrong:["不平等加剧是全球化的影响之一，不是成因。","—","绝对贫困（absolute poverty）下降是全球化（尤其出口导向增长）带来的结果。","跨国公司（multinational company, MNC）海外利润增加是企业全球布局的结果；跨国公司扩张本身可算渠道，但「利润增加」是结果不是成因。"]},
{id:"mcq05",kp:"kp25d",ch:"Ch.25",spec:"主题 2 · 2.4 贸易条件效应",
 q:"A country depreciates its currency. According to the Marshall–Lerner condition, the depreciation will improve its trade balance only if:",
 qzh:"一国货币贬值（currency depreciation）。根据马歇尔-勒纳条件（Marshall–Lerner condition），贬值（depreciation）只有在什么条件下才会改善其贸易差额（trade balance）？",
 opts:["The price elasticity of demand for exports is greater than one","The sum of the price elasticities of demand for exports and imports is greater than one","The price elasticity of demand for imports is zero","Export prices fall by more than import prices rise"],ans:1,
 why:"马歇尔-勒纳条件讨论的是贬值对贸易差额的影响：PEDx + PEDm > 1 时，贬值带来的数量效应超过价格效应，贸易差额改善。注意它不是「贸易条件（terms of trade）一下降、差额就改善」的通用规则——贸易条件还可能因进口价格上涨、相对生产率（productivity）变化等原因恶化，那些情形不能套用本条件，要按具体成因分析数量反应。",
 wrong:["只要求出口弹性 > 1 不够：条件是两者之和大于 1，单个弹性可以小于 1。","—","进口弹性为 0 意味着进口量完全不响应价格变化，反而使改善更难，不是条件。","这是对贬值后相对价格变化的描述，不是差额改善的弹性条件。"]},
{id:"mcq06",kp:"kp24a",ch:"Ch.24",spec:"主题 2 · 2.3 贸易格局",
 q:"Between 1995 and 2022, WTO data show that the share of world exports accounted for by developing economies rose. Which combination of factors best explains this change in the pattern of trade?",
 qzh:"WTO 数据显示，1995–2022 年发展中经济体（developing economy）占世界出口的份额上升。下列哪组因素最能解释这一贸易格局（pattern of trade）变化？",
 opts:["Rising protectionism in developed economies and falling FDI into developing economies","The opening of China and Eastern Europe, rising FDI into developing economies, and a shift in comparative advantage towards low-cost manufacturing","A general appreciation of developing-economy currencies and falling transport costs to developed economies","Developed economies specialising in manufactured goods and developing economies in services"],ans:1,
 why:"官方清单（202401-9）：新兴经济体开放（emerging economy；中国、东欧）+ FDI 流入建立制造业（manufacturing sector）产能 + 比较优势（comparative advantage）向低成本制造业转移，三者共同解释份额变化。",
 wrong:["保护主义（protectionism）上升会压低而非提高发展中经济体出口；FDI 下降方向也相反。","—","发展中经济体货币普遍升值（appreciation）会削弱其出口竞争力，与份额上升矛盾；运费下降是全球性因素，不能单独解释份额转移。","方向写反了：发达经济体（developed economy）转向服务与高技术，发展中经济体承接制造业。"]},
{id:"mcq07",kp:"kp22a",ch:"Ch.22",spec:"主题 1 · 1.3 全球化的影响",
 q:"Which of the following is a benefit of globalisation for consumers in an importing country?",
 qzh:"对进口国消费者而言，下列哪一项是全球化（globalisation）的收益？",
 opts:["Higher prices due to reduced competition","Greater consumer surplus from lower prices and more choice","Reduced product variety","Protection of domestic producers from foreign competition"],ans:1,
 why:"官方收益清单：进口竞争使价格下降、选择增加 → 消费者剩余（consumer surplus） 上升、配置效率（allocative efficiency）提高。",
 wrong:["竞争加剧使价格下降，不是上升；且价格上升对消费者是成本不是收益。","—","全球化增加而非减少产品种类。","保护国内生产者是生产者（且以消费者为代价）的收益，不是消费者收益。"]},
{id:"mcq08",kp:"kp23b",ch:"Ch.23",spec:"主题 2 · 2.2 模型局限",
 q:"A government argues that specialisation based on comparative advantage will automatically benefit all workers in the economy. The strongest economic objection to this claim is that the model assumes:",
 qzh:"某政府声称基于比较优势（comparative advantage）的专业化（specialisation）会自动使所有劳动者受益。对这一说法最有力的经济学反驳是：该模型假设了什么？",
 opts:["Transport costs are high","Factors of production are perfectly mobile between industries","Governments intervene to support declining industries","The terms of trade always improve after specialisation"],ans:1,
 why:"模型假设要素完全流动：衰退（recession）行业的工人能无成本转入扩张行业。现实中存在职业流动性障碍（occupational immobility of labour） → 结构性失业（structural unemployment），所以「所有工人自动受益」不成立——这是 202110-9 官方评价清单的核心点。",
 wrong:["模型恰恰假设运输成本为零（被忽略），不是假设其高。","—","政府干预（government intervention）不是模型的假设，且干预存在与否不决定模型结论是否成立。","贸易条件（terms of trade）是否落在机会成本（opportunity cost）比率之间决定互利，但这不是「所有工人受益」假设的关键——关键是要素流动（factor mobility）性假设。"]},
{id:"mcq09",kp:"kp25e",ch:"Ch.25",spec:"主题 2 · 2.4 长期趋势",
 q:"The Prebisch–Singer hypothesis predicts that, in the long run, the terms of trade of countries dependent on primary product exports will tend to:",
 qzh:"普雷维什-辛格假说（Prebisch–Singer hypothesis） 预测，长期来看，依赖初级产品（primary product）出口的国家的贸易条件（terms of trade）趋于：",
 opts:["Improve, because demand for primary products is income-elastic","Deteriorate, because demand for primary products is income-inelastic relative to manufactures","Remain constant, because primary product prices are set by the WTO","Improve, because primary products become scarcer"],ans:1,
 why:"机制：收入增长时，初级产品需求增长慢于制成品（收入弹性低），且初级产品供给竞争激烈 → 其相对价格长期下行 → 依赖初级产品出口的国家贸易条件趋于恶化。",
 wrong:["方向与弹性都反了：初级产品需求收入弹性（income elasticity of demand）低，正是恶化的原因。","—","WTO 不设定商品价格；假说讲的是市场趋势，不是恒定。","稀缺性可能阶段性推高价格（如大宗商品（commodity）超级周期），但假说的长期机制基于需求收入弹性差异，不是稀缺。"]},
{id:"mcq10",kp:"kp22b",ch:"Ch.22",spec:"主题 1 · 1.3 全球化的成本",
 q:"Which of the following is identified in official mark schemes as a cost of globalisation for developing economies?",
 qzh:"下列哪一项被官方评分要点列为全球化（globalisation）给发展中经济体（developing economy）带来的成本？",
 opts:["A guaranteed improvement in their terms of trade","Exploitation of labour, including low wages and poor health and safety","A reduction in income inequality within the country","Complete insulation from external economic shocks"],ans:1,
 why:"官方成本清单：劳动剥削（labour exploitation；童工（child labour）与女性劳工、低工资、长工时、安全卫生差）是明确列出的成本；同时还有负外部性（negative externality）、不平等加剧与脆弱性（vulnerability）。",
 wrong:["全球化不保证贸易条件（terms of trade）改善；初级产品（primary product）出口国长期还可能恶化（Prebisch–Singer）。","—","官方清单指出全球化往往加剧国内不平等，不是减少。","相互依存（interdependence）使发展中经济体更易受外部冲击（external shock）传导，不是绝缘。"]},
{id:"mcq11",kp:"kp21a",ch:"Ch.21",spec:"主题 1 · 1.1 全球化的特征",
 q:"Which set of flows is included in the definition of globalisation?",
 qzh:"下列哪一组流动包含在全球化（globalisation）的定义之中？",
 opts:["Goods only","Goods and services only","Goods, services, capital, labour and technology","Goods, services and government tax revenues"],ans:2,
 why:"官方定义：全球化是各国经济融入单一国际市场，包含商品、服务、资本、劳动力、技术与观念的更自由流动。只答「贸易」是不完整的。",
 wrong:["只含商品，漏掉服务、资本、劳动力与技术。","仍漏掉资本、劳动力与技术流动（如 FDI、移民（migration）、技术转移（technology transfer））。","—","税收（taxation）是政府收入，不是跨境流动（cross-border flow）的构成；定义里没有这一项。"]},
{id:"mcq12",kp:"kp25a",ch:"Ch.25",spec:"主题 2 · 2.4 贸易条件（Section A 已核对考点）",
 q:"A country's export prices have fallen faster than its import prices. What has happened to its terms of trade?",
 qzh:"一国出口价格的下降速度快于进口价格。该国贸易条件（terms of trade）发生了什么变化？（考点与 Oct 2021 Section A 已核对题一致）",
 opts:["They have improved","They have worsened","They are unchanged","They cannot be determined without quantity data"],ans:1,
 why:"ToT = Px/Pm：分子下降快于分母 → 比率下降 → 贸易条件恶化。贸易条件是价格比率，不需要数量数据即可判断方向（数量只影响差额与福利）。",
 wrong:["出口相对变便宜是恶化，不是改善。","两边都下降但速度不同，比率必然变化。","—","判断贸易条件方向只需价格指数；数量数据是判断贸易差额（trade balance）时才需要的。"]}
];

{id:"jun25a",ds:"Jun 2025 · 01A",date:"Tuesday 3 June 2025",paper:"WEC14/01A",log:"P78819A",theme:"阿根廷 (Argentina)",title:"The economy of Argentina",

 pts:{"b": ["KAA：经常账户改善（出口更便宜/更有竞争力，或进口更贵/竞争力下降）；资本与金融账户改善（capital and financial account；更多 FDI 流入，或更少 FDI 流出）。", "应用：经常账户从 2023 年的赤字转为 2024 年的盈余。", "评价：取决于价格弹性与马歇尔-勒纳条件（Marshall–Lerner condition）；J 曲线效应（J-curve effect；先恶化后改善）；利润/利息/股息汇回属于第一收入流出；严格的资本/货币管制（currency control）延缓效果；取决于贬值幅度；短期与长期/波动性、可能升值（appreciation）。"], "c": ["政策：卖出美元 / 买入比索（减少比索供给 / 增加比索需求）；提高利率（interest rate；更高回报 → 比索需求 ↑）；结束量化宽松（quantitative easing, QE）（减少货币供给）。", "应用：2023 年 11 月至 12 月，比索约 360→800/USD（约 122%）；2023 年 1 月至 2024 年 9 月，约 200→900（约 350%）。"], "d": ["绝对贫困（absolute poverty）知识：低于 $2.15/天（2017 年购买力平价（purchasing power parity, PPP））；无法满足基本需求；缺乏食物、住所、衣物、清洁用水、卫生、医疗与教育。", "应用：自 2004 年以来生活水平（living standard）下降、实际工资（real wage）下降；绝对贫困人口占比上升 11 个百分点，2024 年上半年达 53%（2004–2024 年从 42% 升至 53%）。"], "e": ["KAA（10 点，压缩）：公共支出是 AD 的组成部分/注入，削减 → AD ↓ → 负乘数（multiplier）效应 → 增长下降（「2024 年经济规模小了 3%」）；收入与生活水平下降（「自 2004 年以来生活水平下降，实际工资下降」）；失业率通过派生需求上升（derived demand；2024 年第二季度 7.6%）；通胀压力减小（AD ↓、物价水平 ↓、见图 1）；收入不平等加剧（income inequality；转移支付（transfer payment）削减、养老金/福利）；预算改善、借贷减少/偿还债务（「2024 年每月都有财政盈余（budget surplus）」）；机会成本下降（opportunity cost；债务利息减少）；挤出效应减小（crowding out；利率更低、生产要素流向私营部门）；基础设施/教育/医疗削减 → 潜在产出（potential output；LRAS） 下降（「能源与交通补贴（subsidy）」削减）；公共服务（public service）质量/数量下降 → 生活水平下降。", "评价（7 点）：幅度：从 GDP 的 38% 降至 32%（6 个百分点，相对显著）；取决于公共支出占 AD 的比重；取决于乘数大小；若 GDP 增长更快，总支出可能仍上升；取决于闲置产能（spare capacity）/LRAS 弹性；挤出效应减小可能抵消 AD 下降（私人投资/消费 ↑）；取决于削减落点（削减福利 → 工作激励）。"]},

{id:"oct25a",ds:"Oct 2025 · 01A",date:"Thursday 30 October 2025",paper:"WEC14/01A",log:"P87430A",theme:"印度 (India)",title:"印度主题（Source Booklet 标题见官方 QP）",
 figs:[["Figure 1","实际 GDP（real GDP） 增长率 2019–2025（中文转述，逐年数值见官方 Source Booklet）","7(a) 引用：计算 2020 年与 2021 年之间实际 GDP 增长率的变化。"],["Figure 2","（7(b) 引用，与通胀率 (rate of inflation) 相关）","标题与数据见官方 Source Booklet，本轮未逐字核对，不编造。"]],

 pts:{"b": ["知识：价格水平（price level）/平均价格的百分比上升/变化。", "应用：2019–2022 年通胀（inflation）上升 1.88 个百分点；2024–2025 年预测下降 0.27 个百分点；2022 年 6.65% → 2024 年 4.37%；2022 年最高，2025 年预计最低。"], "c": ["KAA 冲击：美国保护主义威胁（protectionism；出口导向型增长 ↓、对美出口更贵）；大宗商品价格上升（commodity；生产成本 ↑、出口价格 ↑、竞争力下降）；供应链冲击（supply chain；原材料短缺、延误、运输成本 ↑）。", "应用：商品净出口国（net exporter），尤其是 IT 与制药业；大宗商品净进口国（net importer） → 通胀 ↑；频繁的自然灾害（气旋、洪水）+ 较差的公路/铁路基础设施 → 运输中断。", "评价：美国可能不实施保护主义；大宗商品价格波动，可能下跌；瓶颈可能激励国内采购/保护战略产业（strategic industry）；印度「处境良好」（6760 亿美元外汇储备（foreign exchange reserves）、最快实际 GDP 增长）；难以确定单一大冲击——很可能是多种冲击的组合。"], "d": ["KAA：基准利率下调的影响——消费 ↑/储蓄 ↓ → 通胀 ↑；投资 ↑ → 增长/就业 ↑；净贸易（net trade） ↑ → 经常账户（current account）改善。", "应用：基准利率 2025 年 1 月 6.5% → 2 月 6.25% → 4 月 6%（每次 0.25 个百分点）；通胀目标（inflation target） 4–6%；准确绘制并标注 AD 图可 +1 分。"], "e": ["KAA 供给侧政策（必须同时涉及增长与发展，否则最高 Level 2；未在材料中出现的政策最高 Level 2）：定义 + LRAS 图；「提高年轻劳动力的技能」（教育与培训 → 技能/人力资本/生产率 → 增长；就业能力、人均收入 ↑、发展；人均收入预计 +$2,000）；「鼓励更多创新」（生产率 ↑、单位成本（unit cost）/出口价格 ↓、效率/竞争力、FDI ↑、潜在产出（potential output） ↑、生活水平（living standard） ↑）；「基础设施投资」（investment in infrastructure；交通/通讯 → 贸易、效率、运输成本/时间下降、生产能力 ↑、就业 ↑、人均收入 ↑、发展）；「削减高昂的官僚成本」（bureaucratic cost；行政成本下降、盈利能力 ↑、创新投资、生产率 ↑、FDI ↑、就业、生活水平；「简化国内企业与跨国公司的融资流程」）。", "评价：干预主义政策 ↑ 公共支出（public expenditure）、机会成本（opportunity cost）/不利的公共财政（「2025 年资本支出预算 15 万亿卢比」）；技能与基础设施投资的规模；时间/执行滞后；挤出效应（implementation lag；crowding out；资源/金融）；各政策效果：技能取决于项目质量、受训者可能不从事受训岗位；创新不确定、耗时、风险高、缺乏熟练劳动力；基础设施取决于项目质量；削减官僚 → 监管监督减少、监测/控制不足。"]},

{id:"jan26a",ds:"Jan 2026 · 01A",date:"Wednesday 21 January 2026",paper:"WEC14/01A",log:"P87665A",theme:"全球收入不平等 (Global income inequality)",title:"全球收入不平等主题（Source Booklet 标题见官方 QP）",
 figs:[["Figure 1","Gini coefficient of global income inequality 2000–2020","显示 2000–2020 年全球基尼系数（Gini coefficient） 的变化（具体数值见官方 Source Booklet）；7(c) 引用，须配洛伦兹曲线（Lorenz curve） 图。"]],
 extracts:[["Extract A","（标题见官方 Source Booklet）","关于全球财富分配（wealth distribution）与收入不平等（income inequality）；第二段含 2000 年各收入群体财富份额数据（7(a) 引用，具体数字见官方材料）；line 15 涉及相对贫困（relative poverty）（7(b) 引用）。"]],
 parts:[["a","Calculate",2,"With reference to the second paragraph of Extract A, calculate the share of global wealth of high-income advanced countries and middle-income developing countries in 2000. You are advised to show your working.","高收入发达国家 71% + 12% = 83%；中等收入发展中国家 24% − 9% = 15%"],
 ["b","Explain",4,"Explain what is meant by 'relative poverty' (Extract A, line 15).",null],
 ["c","Analyse",6,"With reference to Figure 1, analyse the likely effect on global income inequality of the change in the global Gini coefficient from 2000 to 2020. Illustrate your answer with a Lorenz curve diagram.",null],
 ["d","Examine",8,"With reference to Extract A, examine two reasons why income inequality has increased within advanced economies.",null],
 ["e","Discuss",14,"With reference to Extract A and your own knowledge, discuss policies that a government could implement to reduce income inequality within its economy.",null]],
 pts:{"b": ["相对贫困知识：低于中位收入的 60%（median income；接受 50%）；缺乏维持平均生活水平（living standard）的最低收入。", "应用：许多发达经济体（developed economy）的相对贫困率（relative poverty rate）上升；日本/加拿大/德国/美国 +3 个百分点，法国 +2 个百分点；每 7 人中就有 1 人处于相对贫困。"], "c": ["洛伦兹曲线：正确标注坐标轴；正确标注原始曲线；基尼系数 2000 年 0.72，2020 年 0.67；新洛伦兹曲线位于原始曲线左侧；不平等下降 / 分配更平等；新曲线显示低收入群体所占收入比例更高（或高收入群体所占比例更低）。"], "d": ["KAA：不平等上升的原因——性别（机会更少、工资更低）；年龄（工资与经验/技能/生产率/教育相关）；居住地（城市收入更高、教育机会更好）；家庭债务（household debt；资金从负债的中等收入家庭流向金融部门（financial sector）/高收入者）；全球化（globalisation；非熟练劳动力需求相对下降）；自动化/技术变革（技能过时、结构性失业（structural unemployment））。", "应用：最富 1% 的份额从 9%（2000 年）升至 16%（2020 年）；女性每赚 $1 男性赚 $0.89，尽管女性学位更多；年轻人收入/财富更低；城市居民受教育程度更高；自 2005 年以来实际可支配收入（disposable income）下降，住房、医疗、教育成本上涨快于平均物价水平；家庭债务从可支配收入的 50%（2000 年）升至 120%（2020 年）；工资占全球 GDP 的份额下降。", "评价：各国显著性不同，工资最显著；数据可能不准确/不可靠，不平等变化很快；城市失业率（unemployment rate）更高且上升，长期不平等可能下降；去全球化（deglobalisation）可能减缓上升；很可能是多种原因的组合；显著性随时间变化。"], "e": ["KAA 政策：经济状况调查型福利（means-tested benefit；收入支持（income support）、住房福利（housing benefit）——非全民）；为无资格者提供教育与培训（education and training；技能、人力资本（human capital）、生产率、就业能力（employability））；国家提供公共服务（public service；医疗、社会住房（social housing））；减少歧视（discrimination；平等机会（equal opportunity）、更高工资/生活水平）；提高最低工资（minimum wage；帮助最低收入者脱贫、实际收入（real income） ↑）；更累进的税制（更多税档、更高免税额；支持在职穷人；「重新考虑如何分享经济收益」）。", "评价：福利复杂/昂贵，福利撤回导致贫困陷阱（poverty trap），未解决主要原因（低工资、技能缺口（skills gap））；取决于教育/培训质量，受训者可能不从事受训岗位，生产率（productivity）可能仍低；国家提供在发达经济体中效果可能相对不显著（已很广泛）；最低工资可能提高失业率与不平等；最高收入可能增长更快；对失业（unemployment）者/学生无影响；累进税（progressive tax）可能导致税收（taxation）流失、逃税（tax evasion）/避税、收入下降（tax avoidance；拉弗曲线（Laffer curve））、降低工作激励；部分性别/年龄差距可能反映文化规范；时间/执行滞后（implementation lag）。"]},

/* v5 审查修复第三批（第 4 项 · P1）：Data Response 进度持久化。U.drProg[paperId][part]={answer,score,updatedTs}；U.drProg.train={done,score}。老数据缺失时一律 {} 兜底。 */
function drProgRoot(){if(!U.drProg||typeof U.drProg!=="object"||Array.isArray(U.drProg))U.drProg={};return U.drProg;}
function drRec(paperId,part){const dp=drProgRoot();const pp=dp[paperId];if(!pp||typeof pp!=="object")return null;const r=pp[part];if(!r||typeof r!=="object")return null;return r;}
function drPartState(rec){if(!rec||rec.answer==null||String(rec.answer).trim()==="")return"未答";if(rec.score!=null)return"已自评";return"已答";}
function drTrainProg(){const dp=drProgRoot();if(!dp.train||typeof dp.train!=="object"||Array.isArray(dp.train))dp.train={done:{},score:0};if(!dp.train.done||typeof dp.train.done!=="object"||Array.isArray(dp.train.done))dp.train.done={};if(typeof dp.train.score!=="number"||isNaN(dp.train.score))dp.train.score=Object.keys(dp.train.done).filter(k=>dp.train.done[k]&&dp.train.done[k].ok).length;return dp.train;}

 let totAns=0;const totParts=Q7P.length*5;
 const perPaper=Q7P.map(p=>{let ans=0,scored=0;p.parts.forEach(pt=>{const r=drRec(p.id,pt[0]);const st=drPartState(r);if(st!=="未答")ans++;if(st==="已自评")scored++;});totAns+=ans;return{p:p,ans:ans,scored:scored,rate:Math.round(ans/5*100)};});
 const overallDen=totParts+DRTRAIN.length;const overallNum=totAns+trainDone;const overall=overallDen?Math.round(overallNum/overallDen*100):0;
 const hasAny=totAns>0||trainDone>0;

 h+='<p class="sm" style="margin:.3rem 0"><b>总体完成率 (Overall Completion)：</b>'+overall+'%（已答小问 '+totAns+' / '+totParts+' + 提取训练已答 '+trainDone+' / '+DRTRAIN.length+'）</p><div class="bar mint"><i style="width:'+overall+'%"></i></div>'
 +perPaper.map(x=>'<p class="sm" style="margin:.3rem 0"><b>'+esc(x.p.ds)+' · '+esc(x.p.paper)+' · '+esc(x.p.theme)+'</b>：已答 '+x.ans+' / 5 · 已自评 '+x.scored+' / 5 · 完成率 '+x.rate+'%</p><div class="bar"><i style="width:'+x.rate+'%"></i></div>').join("")
 +'<p class="sm" style="margin:.3rem 0"><b>材料信息提取与运用训练 (Extraction Training)：</b>'+(trainDone?'已答 '+trainDone+' / '+DRTRAIN.length+' 组 · 答对 '+trainOk+' 组 · 正确率 (Accuracy) '+Math.round(trainOk/trainDone*100)+'%':'尚未作答，暂无正确率。')+'</p>'
 +'<p class="sm mut">状态按内容推导：未答 / 已答 / 已自评（填了自评分数 (Self-assessment Score) 即为已自评；留空 = 未评分，填 0 = 0 分）。进度保存在本机并随 JSON 备份导出。</p></div>';
 return h;
}

function bindDrProg(){
 const root=$("#view");if(!root)return;
 function updStatus(paperId,part){
   const el=root.querySelector('[data-drstatus="'+paperId+":"+part+'"]');if(!el)return;
   const rec=drRec(paperId,part);const st=drPartState(rec);
   const paper=Q7P.find(x=>x.id===paperId);const pt=paper?paper.parts.find(x=>x[0]===part):null;const max=pt?pt[2]:"";
   el.textContent=st+(st==="已自评"?" · "+rec.score+" / "+max+" 分":"");
   el.className="tag "+(st==="已自评"?"mint":(st==="已答"?"gold":"grey"));
 }
 root.querySelectorAll("[data-drpaper]").forEach(ta=>{
   ta.addEventListener("input",()=>{
     const dp=drProgRoot();const pid=ta.dataset.drpaper,part=ta.dataset.drpart;
     if(!dp[pid]||typeof dp[pid]!=="object")dp[pid]={};
     const prev=dp[pid][part]&&typeof dp[pid][part]==="object"?dp[pid][part]:{answer:"",score:null,updatedTs:0};
     dp[pid][part]={answer:ta.value,score:(prev.score!=null?prev.score:null),updatedTs:Date.now()};
     saveUser();updStatus(pid,part);
   });
 });
 root.querySelectorAll("[data-drscore-paper]").forEach(inp=>{
   inp.addEventListener("change",()=>{
     const dp=drProgRoot();const pid=inp.dataset.drscorePaper,part=inp.dataset.drscorePart;const max=+inp.dataset.drmax||0;
     if(!dp[pid]||typeof dp[pid]!=="object")dp[pid]={};
     const prev=dp[pid][part]&&typeof dp[pid][part]==="object"?dp[pid][part]:{answer:"",score:null,updatedTs:0};
     let sc=null;
     if(inp.value!=null&&String(inp.value).trim()!==""){sc=+inp.value;if(isNaN(sc))sc=null;else if(sc<0){sc=0;toast("自评分数不能小于 0，已按 0 分计入");}else if(sc>max){sc=max;inp.value=max;toast("已按满分 "+max+" 分计入");}}
     dp[pid][part]={answer:(prev.answer!=null?prev.answer:""),score:sc,updatedTs:Date.now()};
     saveUser();updStatus(pid,part);toast(sc==null?"已清除自评分数（未评分）":"自评分数已保存");
   });
 });
}

function clampScore(raw,max){
 if(raw===""||raw==null)return{blank:true,val:"",over:false};
 const v=+raw;if(isNaN(v))return{blank:true,val:"",over:false};
 let over=false,out=v;if(out>max){out=max;over=true;}if(out<0){out=0;over=true;}
 return{blank:false,val:out,over:over};
}
function scoreDisp(raw,max){
 const c=clampScore(raw,max);

 return c.val+" 分"+(c.over?' <span class="tag red">待订正</span>':"");
}

function mcqPool(){if(MCQF==="official")return MCQ_OFF.slice();if(MCQF==="self")return MCQS.slice();return ALLMCQ.slice();}
function startMcq(mode,ch){
 if(mode==="one"){const q=mcqById(ch);if(!q){toast("找不到这道题");return;}stopMcqTimer();MCQSES={list:[q],idx:0,score:0,mode,answered:false,left:null};paintMcq();return;}
 let list=mcqPool();
 if(mode==="ch")list=list.filter(q=>q.ch===ch);
 if(mode==="wrong"){const wrongIds={};U.mcqLog.forEach(x=>{if(!x.correct)wrongIds[x.qid]=1;});list=list.filter(q=>wrongIds[q.id]);if(!list.length){toast("暂无错题记录，先做一组随机练习");return;}}
 if(!list.length){toast("当前筛选下没有题目，换个来源或章节试试");return;}
 list=list.sort(()=>Math.random()-0.5);
 if(mode==="timed")list=list.slice(0,10);
 if(mode==="mock")list=list.slice(0,6);
 MCQSES={list,idx:0,score:0,mode,answered:false,left:(mode==="timed"?600:mode==="mock"?600:null)};
 paintMcq();startMcqTimer();
}
function startMcqTimer(){stopMcqTimer();if(!MCQSES||MCQSES.left==null)return;mcqTimerInt=setInterval(()=>{MCQSES.left--;const t=$("#mcqtimer");if(t)t.textContent=fmtTime(MCQSES.left);if(MCQSES.left<=0){stopMcqTimer();finishMcq(true);}},1000);}
function fmtTime(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function paintMcq(){
 const st=$("#mcqstage");if(!st||!MCQSES)return;const s=MCQSES;const q=s.list[s.idx];
 if(!q){finishMcq(false);return;}
 const kp=q.kp?kpById(q.kp):null; const off=q.src==="official";
 st.innerHTML='<div class="card"><div class="secthead"><b>第 '+(s.idx+1)+" / "+s.list.length+' 题</b>'+(off?'<span class="tag mint">Pearson 官方原题 · Official Past Paper</span><span class="tag">'+esc(q.paper)+' '+esc(q.qn)+'</span>':'<span class="tag gold">自编练习题 · Original Practice</span>')+'<span class="tag">'+esc(q.ch)+'</span><span class="tag grey">'+esc(q.spec)+'</span>'+(s.left!=null?'<span class="timer" id="mcqtimer" style="font-size:1.2rem">'+fmtTime(s.left)+'</span>':"")+'</div>'
 +(off&&q.topic?'<p class="sm">主题（按题干归纳）：<b>'+esc(q.topic)+'</b> <span class="mut">（站内按题干与官方 MS 排除理由归纳，非官方分类）</span></p>':"")+'<p class="en" style="font-size:1.02rem">'+esc(q.q)+'</p>'
 +(q.tbl?tblHTML(q.tbl):"")+(q.fig?trendSVG(q.fig):"")+(q.figNote?'<p class="sm mut">'+esc(q.figNote)+'</p>':"")
 +'<p class="mut">'+(off?'中文题意（翻译，非官方原文）：':'')+esc(q.qzh)+'</p>'
 +(q.optHead?'<p class="sm mut">'+esc(q.optHead)+'</p>':"")
 +q.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'"><b>'+"ABCD"[i]+'.</b> '+esc(o)+'</button>').join("")
 +'<div id="mcqfb"></div>'
 +'<div class="btnrow">'+favBtn("mcq:"+q.id)+askBtn("请讲解这道 U4 选择题："+q.q+"\n选项："+q.opts.join(" / "))+(kp?'<button class="btn sm ghost" data-go="kb" data-param="'+kp.id+'">相关知识点：'+esc(kp.zh)+'</button>':"")+'</div>'
 +(off?'<p class="sm mut">来源：'+esc(q.paper)+' '+esc(q.qn)+' · MS 编号 '+esc(q.ms)+'（答案以 MS 为准）'+(q.note?'<br>'+esc(q.note):"")+'</p>':'<p class="sm mut">'+esc(MCQ_SRC)+'</p>')+'</div>';
 bindUserCtl(st);
 st.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",()=>answerMcq(+b.dataset.opt)));
}
function answerMcq(i){
 const s=MCQSES;if(!s||s.answered)return;s.answered=true;const q=s.list[s.idx];const ok=i===q.ans;
 if(ok)s.score++;
 U.mcqLog.push({qid:q.id,correct:ok,ts:Date.now(),mode:s.mode});
 if(!ok){
  if(!U.mistakes.some(m=>m.kind==="mcq"&&m.ref===q.id&&!m.resolved)){
   U.mistakes.push({id:"mk"+Date.now(),ts:Date.now(),kind:"mcq",ref:q.id,q:q.q,myAnswer:q.opts[i],correctAnswer:q.opts[q.ans],basis:q.why,errType:"",kp:q.kp,reviews:0,resolved:false,note:""});
  }
 }
 saveUser();
 const st=$("#mcqstage");
 st.querySelectorAll("[data-opt]").forEach((b,bi)=>{b.disabled=true;if(bi===q.ans)b.classList.add("right");else if(bi===i)b.classList.add("wrong");});
 $("#mcqfb").innerHTML='<div class="'+(ok?"chain":"")+'" style="'+(ok?"":"background:var(--red-soft);border-radius:10px;padding:10px 14px")+'"><p><b>'+(ok?"✓ 答对":"✗ 答错（已加入错题本）")+'</b></p><p>'+esc(q.why)+'</p><p class="sm"><b>其他选项为什么错：</b></p><ul class="tight">'+q.opts.map((o,oi)=>oi===q.ans?"":'<li><b>'+"ABCD"[oi]+'.</b> '+esc(q.wrong[oi]||"")+'</li>').join("")+'</ul></div>'
 +'<div class="btnrow"><button class="btn" id="mcqnext">'+(s.idx+1<s.list.length?"下一题":"查看结果")+'</button></div>';
 $("#mcqnext").addEventListener("click",()=>{s.idx++;s.answered=false;paintMcq();});
}
function finishMcq(timeout){
 stopMcqTimer();const s=MCQSES;const st=$("#mcqstage");if(!st||!s)return;
 st.innerHTML='<div class="card mint"><h3 style="margin-top:0">'+(timeout?"时间到 · ":"")+'练习完成</h3><p>得分：<b>'+s.score+" / "+s.list.length+'</b>（模式：'+esc(s.mode)+'）</p><p class="sm mut">错题已自动进入错题本；到「错题重练」或错题本里复习。把不确定的题点「问 Viaana」发到聊天里深挖。</p><div class="btnrow"><button class="btn" data-go="mcq">再来一组</button><button class="btn ghost" data-go="mistakes">打开错题本</button></div></div>';
 bindUserCtl(st);MCQSES=null;
}

 +'<p class="sm mut">%Δ =（新 − 旧）÷ 旧 × 100。例：贸易条件指数（terms of trade index） 100 → 90 即恶化 10%。注意区分「百分点 (percentage points)」与「百分比 (%)」。</p></div></div>';

 }));

/* ---------- Advanced Extension ---------- */
/* EXT_ITEMS 字段（7 个正文字段 + 深链）：[0]名称 [1]核心思想 [2]简单解释 [3]真实应用 [4]与 U4 的关联 [5]考试收益 [6]是否官方考点 [7]是否值得花时间 [8]站内深链 [视图, param, 按钮文案] 或 null（无合适单卡目标不硬链）。内容只取标准本科教科书常识，不编造与 U4 考纲有关的论断，不写成必考内容。 */
const EXT_ITEMS=[["Intermediate Microeconomics 入门","价格机制（price mechanism）与市场结构（market structure）的深化理解","本科中级微观（intermediate microeconomics） 在 A-level 供求（supply and demand）与市场失灵（market failure）的基础上，把价格如何协调成千上万个分散决策讲得更细：消费者怎么在预算内选最优组合，企业怎么在不同市场结构里定价。它把“为什么市场有效、什么时候失灵”说得更完整；本条只取结论与直觉，不做本科的数学推导。","外卖平台高峰期加价：需求突然上升时价格上涨，一部分人改时间或改吃别的，骑手供给增加——没有中央指挥，价格就把供需重新配平了。","深化 Ch.23 专业化（specialisation）与贸易收益、Ch.27 关税（tariff）与福利分析里的效率论证。","Essay 写竞争、效率与市场失灵时，论证可以多走一两步（从价格信号（price signal）讲到资源配置（resource allocation）），而不是只贴结论；但 A-level 评分只看考纲内的点，超纲推导不直接加分。","否","值得粗读——对效率类论证帮助直接，但只读结论与图示即可，不必做本科习题。",null],["Intermediate Macroeconomics 入门","增长模型与政策传导（policy transmission）的本科框架","本科中级宏观（intermediate macroeconomics） 把 A-level 的总需求/总供给（aggregate demand, AD；aggregate supply, AS；AD/AS） 与政策分析放进更完整的增长框架：长期增长靠资本积累（capital accumulation）、技术进步（technological progress）与劳动力，短期波动靠需求与政策传导。它帮你分清两个不同的问题——长期能长多快，和短期为什么波动。","2020 年代多国央行加息抗通胀（inflation）：利率（interest rate）上升先压住借贷与消费（短期需求），却不改变一国的长期潜在增长率——政策能平滑周期，改不了长期趋势。","深化主题三（国际收支（balance of payments）与汇率（exchange rate））、主题五（宏观政策）与主题六（增长与发展）的机制理解。","写政策评价时能分清短期效果与长期效果、区分需求侧（demand side）与供给侧（supply side），避免把“加息”写成万能答案。","否","有余力可读——对 U4 的直接帮助不如博弈论（game theory）与行为经济学（behavioural economics），考前冲刺不优先。",null],["Game Theory 基础","策略互动：贸易战（trade war）、报复与纳什均衡（Nash equilibrium）","博弈论（game theory） 研究“你的最优选择取决于对手怎么做”：每个人都先猜对方会怎么选，再决定自己的策略。纳什均衡 (Nash equilibrium) 是这样一种状态：给定别人不动，谁单方面改主意都不会更好，于是谁都不想动。","贸易战报复升级：A 国加关税（tariff），B 国报复，B 国报复后 A 国再加码——双方都清楚合作更好，却因为怕对方先违约而一步步走向互相伤害，这正是“囚徒困境（prisoner's dilemma）”的现实版。","直接对应 Ch.27 保护主义（protectionism）：报复机制、贸易战螺旋升级与世界贸易组织（World Trade Organization, WTO） 的作用。","保护主义评价段的现成框架：用“合作更好、单方面违约有诱惑、报复导致双输”三步写评价，比只列利弊更有说服力。","否","值得——8 条里对考试最直接的一条，保护主义题几乎年年可套用。",["kb","kp27e","打开 Ch.27 · 保护主义的理由"]],["Behavioural Economics 基础","有限理性（bounded rationality）与决策偏差","行为经济学（behavioural economics） 指出人并不总是完全理性的：我们会拖延、怕损失、跟从默认选项、被眼前的小利吸引。政策不一定要靠强制，改一下选择的设计，就能让人在不剥夺自由的情况下做出更好的决定。","默认选项与政策助推（nudge）：把养老金计划默认设为“自动加入、可退出”，参与率远高于“自愿加入”——选项本身没变，只是默认状态换了方向。","给政策评价加一个现实维度：解释为什么同样的补贴（subsidy）或税收（taxation）在不同国家效果不同（执行、习惯与预期在起作用）。","评价段可用“理性人假设不成立”作限定句：政策效果取决于人是否真的按模型反应，这是一句有分量的 Level 3 评价。","否","值得粗读——一句话的评价限定就能用上，不必系统学习。",null],["Development Economics 基础","贫困陷阱（poverty trap）、制度与发展","发展经济学（development economics） 问的是：为什么有些国家长期穷？一个常见答案是贫困陷阱 (poverty trap)：收入太低 → 存不下钱投资教育与健康 → 生产率（productivity）上不去 → 收入继续低，穷本身成了穷的原因。制度、债务与初级产品（primary product）依赖会把这个循环锁得更紧。","贫困陷阱：一个家庭收入仅够糊口，孩子很早就要打工而不是上学，下一代仍只能做低收入工作——没有外力（教育投入、基建或援助）打破循环，低收入会代代传下去。","主题六的评价纵深：增长与发展的衡量、制约因素与发展策略的讨论都需要这条逻辑。","主题六评价题的纵深素材：能讲清“为什么市场化策略（market-based strategy）在有些国家行不通”（陷阱与制度约束），而不是只罗列策略名称。","否","值得粗读——主题六是 U4 的大头，这条直接加深它的评价；但主题六知识卡本身尚未填充，先以考纲条目为准。",["kb","kp6x","打开主题六占位卡（内容待补充）"]],["International Economics 基础","汇率（exchange rate）与贸易模型的本科版本","本科国际经济学（international economics） 把 A-level 的贸易格局（pattern of trade）与汇率分析讲得更系统：贸易模型解释“谁出口什么、为什么”，汇率模型解释“货币为什么升值（appreciation）或贬值（depreciation）”。核心仍是比较优势（comparative advantage）与供求（supply and demand），只是把短期波动与长期均衡分得更清楚。","一国利率（interest rate）上升吸引外资流入，对本币（domestic currency）需求增加、本币升值，出口随之变贵——利率、汇率与贸易差额（trade balance）是连在一起的，不能只看其中一环。","主题二（贸易格局、贸易条件）与主题三（汇率、国际收支（balance of payments））的机制加固。","写汇率与贸易条件（terms of trade）题时，能把“利率→资本流动（capital flow）→汇率→出口竞争力”写成完整链条，而不是孤立的因果句。","否","有余力可读——与 U4 重叠度高，巩固理解有用，但考前直接复习 Ch.24–25 知识卡性价比更高。",null],["Econometrics 基础概念","相关 vs 因果、证据质量","计量经济学（econometrics） 是用数据检验经济想法的工具，但它最重要的一课是反直觉的：两个变量一起动，不等于一个导致另一个。相关 (correlation) 只是“一起出现”，因果 (causation) 需要排除其他解释——比如遗漏了第三个真正起作用的变量。","相关 vs 因果误读：某国出口增长快、同时贫困率（poverty rate）下降，就断言“出口增长减少了贫困”——可能真正的原因是同期教育投入增加或全球大宗商品（commodity）涨价，出口只是碰巧一起变好。","批判材料数据、支撑 Level 3 评价：读 Q7 材料与图表时先问“这张图能证明什么、不能证明什么”。","材料题 (e) 问与评价段的利器：一句“材料只显示相关、未控制其他因素，因此不能断言因果”就是合格的 Level 3 评价点。","否","考前冲刺不建议系统学——只记“相关≠因果”这一条就够用；有余力、想读研究报告时再深入。",["dataresponse","","打开材料题库 · 提取训练"]],["Research Methods 入门","如何读一份经济报告","研究方法（research methods） 教的是怎么判断一份报告可不可信：数据从哪来、样本是谁、结论有没有超出数据的范围。它不教你做研究，只教你别被数字骗——先看方法，再看结论。","一份报告说“某政策让就业上升 20%”：先问对照组是谁——如果没有比较对象，上升可能只是经济整体向好，与政策无关。","Research Lab 的方法论基础：读 Q7 材料与 HDI 这类发展指标表之前，先过一遍检查清单。","材料题读题不出错：先确认表里有什么、表里没有的数据就不推断，少丢“越界推断”的冤枉分。","否","值得——Research Lab 已有现成清单与 worked example，10 分钟就能用上，不必另学。",["researchlab","","打开 Research Lab"]]];

/* ---------- Revision Planner ---------- */
function kpSchedule(k){
 const DAY=86400000,now=Date.now();
 const prec=(U.planner||{})[k.id];
 const errs=U.mistakes.filter(m=>m.kp===k.id&&!m.resolved).length;
 const wrongLogs=U.mcqLog.filter(x=>!x.correct&&(ALLMCQ.find(q=>q.id===x.qid)||{}).kp===k.id).length;
 const errLoad=errs+wrongLogs;
 const acts=[];
 if(U.masteryTs&&U.masteryTs[k.id])acts.push(U.masteryTs[k.id]);
 U.mistakes.filter(m=>m.kp===k.id).forEach(m=>acts.push(m.lastReview||m.ts));
 U.mcqLog.filter(x=>(ALLMCQ.find(q=>q.id===x.qid)||{}).kp===k.id).forEach(x=>acts.push(x.ts));
 let last=acts.length?Math.max.apply(null,acts):null;
 if(prec&&prec.ts)last=last==null?prec.ts:Math.max(last,prec.ts);
 const m=U.mastery[k.id];
 const base=m==null?1:[1,2,4,7,14][m];
 let interval=Math.max(1,Math.round(base/(1+0.5*errLoad)));
 if(prec&&prec.interval)interval=Math.max(1,+prec.interval||1);
 if(last==null)return{fresh:true,interval,due:now,errLoad,overdueDays:0};
 const due=last+interval*DAY;
 return{fresh:false,interval,due,errLoad,overdueDays:Math.floor((now-due)/DAY)};
}
const PLANNER_RESULTS={remember:"记住",fuzzy:"模糊",forgot:"忘记"};
function plannerRecord(id,result){const k=kpById(id);if(!k||!PLANNER_RESULTS[result])return false;const cur=kpSchedule(k).interval;const next=result==="remember"?Math.min(cur*2,30):result==="fuzzy"?cur:1;U.planner=U.planner||{};U.planner[id]={result:result,ts:Date.now(),interval:next,prev:cur};saveUser();return true;}
function plannerDueList(){
 const full=KB.filter(k=>k.st==="full");
 const now=Date.now(),DAY=86400000;
 const sched=full.map(k=>({k,s:kpSchedule(k)}));
 let due=sched.filter(x=>!x.s.fresh&&x.s.due<=now);
 sched.forEach(x=>{const mi=dimMinInfo(x.k.id);if(mi&&mi.val<=1){x.dimReason=mi.label.split(" ")[0]+"维度仅 "+mi.val+" 级";if(!due.some(y=>y.k.id===x.k.id)){due.push({k:x.k,s:{fresh:false,interval:x.s.interval,due:now,errLoad:x.s.errLoad,overdueDays:0},dimReason:x.dimReason});}else{due.forEach(y=>{if(y.k.id===x.k.id)y.dimReason=x.dimReason;});}}});
 due.sort((a,b)=>(b.s.errLoad-a.s.errLoad)||(a.s.due-b.s.due));
 const soon=sched.filter(x=>!x.s.fresh&&x.s.due>now&&x.s.due<=now+7*DAY).sort((a,b)=>a.s.due-b.s.due);
 const fresh=sched.filter(x=>x.s.fresh);
 return{due:due,soon:soon,fresh:fresh};
}

 +'<p class="sm"><b>复查后补充修复（2026-11-19，针对 commit e16de9e5）· 第 6 项 · 保存版本号（Save Version Counter）：</b><b>复现（GPT 复查指出，已在代码核实并用旧逻辑复现属实）：</b>原 doWrite() 的事务完成回调（tx.oncomplete）无条件把待保存标记（savePending）置为 false。竞争场景：第一次修改的事务还在进行时，第二次修改进入 250ms 防抖（debounce）等待；第一次事务完成时把 savePending 误清为 false，但第二次修改仍在等待；此时若触发 pagehide / visibilitychange，保存刷新（flushSave）见 savePending 为 false 就不写盘，第二次修改丢失。用旧逻辑（无条件清标记）在 node 中按此场景复现：第一次事务完成后 savePending=false、第二次修改仍在防抖等待，flushSave 未创建任何事务、落盘数据仍是第一次修改的值——丢失确认。<b>修复：</b>① 新增保存版本号（Save Sequence）计数器 saveSeq，初始为 0，每次 saveUser() 调用时 +1，表示有新修改待保存；其余逻辑不变（savePending=true、显示「有未保存的修改（保存中…）」、250ms 合并写入保留）。② doWrite() 开始写盘时捕获当前版本号 const v=saveSeq；事务完成（tx.oncomplete）时比较版本号：只有 v===saveSeq（写盘期间没有新修改）才置 savePending=false 并显示「已自动保存 · 时间」；若 v&lt;saveSeq（写盘期间有新修改到达），不清除 savePending、也不显示已保存，立即再执行一次 doWrite() 写最新数据（同一对象存储（object store）的读写事务按创建顺序串行执行，后创建的事务写入更新的数据）。③ 事务出错（tx.onerror）、无数据库与异常分支保持原行为：savePending 保持 true、显示「保存失败，请到「设置」导出 JSON 备份」，以便 pagehide 时重试。④ flushSave() 与 pagehide / visibilitychange 的接法、关键操作后直接 flushSave 均未改；未改动保存的数据结构与字段，未动其他模块。<b>测试证据（node 抽取站内修复后的真实函数 saveUser / doWrite / flushSave，配模拟事务队列逐项验证，共 14 项断言全过）：</b>① 快速连续修改 3 次后立即触发 flushSave（模拟关闭/刷新）——通过：flush 立即创建事务，事务完成后落盘值等于最后一次修改，savePending 正确清零。② 事务完成与 pagehide 同时发生——通过：第一次事务进行中到达第二次修改（版本号 1→2），第一次事务完成时待保存标记未被清除、且立即补发一次写入最新数据的事务；同一瞬间再触发 flushSave 后逐个完成队列中的事务，最终落盘值为第二次修改，较新的修改不丢。③ 保存状态指示诚实——通过：防抖等待与补写期间状态栏只有「有未保存的修改（保存中…）」，从不出现「已自动保存」；全部写入完成后才显示「已自动保存 · 时间」。④ 全部 10 个 script 块通过 node --check。⑤ 关键操作保存行为回归——通过：普通单次输入经防抖正常落盘并清标记；事务出错与无数据库两条分支仍保持 savePending=true 并显示原失败文案（pagehide 时会重试），与上一轮行为一致；交卷、导入等关键操作仍走原 saveUser() / flushSave() 路径，代码未改。如实说明：② 的「同时发生」以模拟事务队列精确控制完成时点验证，未在真实浏览器中以肉眼时序复现；真实 IndexedDB 中同存储事务的串行顺序由规范保证，构建审计的设置页渲染冒烟见本次构建。</p>'

 +'<p class="sm"><b>第 4 项 · 修复：</b>① 新增字段 U.drProg（只加新字段）：每套已核实 Q7 整卷下为 (a)–(e) 每个小问加作答输入框 (textarea) 与自评分数 (Self-assessment Score) 输入，存为 U.drProg[paperId][part]={answer（答案文本）, score（自评分数，null = 未评分）, updatedTs（更新时间戳）}；状态按内容推导：未答 / 已答 / 已自评（填 0 分也是已自评，与未评分区分；超满分自动按满分计入并提示）；输入时经现有 saveUser() 保存（走第一批已修复的 flushSave 落盘路径），状态标签即时更新、不整页重渲染以免打断输入。② 提取训练进度移入 U.drProg.train={done:{},score:0}（与原内存结构同形），训练视图读写一律经持久化字段，原全局变量已删除；答错仍按原逻辑进错题本（错误类型默认应用错误 (Application Error)），该逻辑未改动。③ 材料题库页顶部新增进度汇总卡：每套已核实试卷的完成率（已答小问 / 5，含已自评数）、提取训练正确率（答对 / 已答）、Data Response 总体完成率（已答小问 + 训练已答 ÷ 小问总数 + 训练总数，卡内写明口径）；没有任何记录时显示空状态，不编造数据。④ JSON 导入导出：导出为整个 U 对象，drProg 自动包含在内；导入合并的默认对象已加入 drProg:{}，并加 drProg 类型校验与非对象兜底，备份中的 drProg 会被合并保留，旧备份（无 drProg）导入后补 {} 且收藏、笔记等原有数据不丢；导入确认信息新增材料题进度计数。⑤ 向后兼容：初始 U、读取 (loadUser)、导入合并、清空重置四处均已加 drProg 缺失默认 {}；未改动、未重置任何已有字段与结构。</p>'

 +'<p class="sm"><b>修复（五处，全部围绕新增统一默认值与清洗函数）：</b>① 新增统一默认值函数 defaultU() 与类型清洗函数 sanitizeUser（记录清洗 Record Sanitization）：对象字段（favs、notes、mastery、masteryTs、planner、dimMastery、tags、drProg、drafts、mock、selfeval）只接受非数组对象，数组字段（mistakes、mcqLog、essayLog、examList、mockHistory）只接受数组，settings 与默认值逐键合并，strategySeen 只接受布尔值，未知字段原样保留（向前兼容）；初始 U 改为 let U=defaultU()，字段与原来一致并补 drafts/mock/selfeval 三个空对象。② 读取改用清洗函数：loadUser 中逐项兜底整段替换为 U=sanitizeUser(rec)；上一阶段已删除的「把 auto 强制改成 dark」一行未加回，settings 的 auto 仍由 applyTheme 正常处理。③ 导入 merged 改用清洗函数：原 14 字段默认值 Object.assign 加三行修复，改为 const merged=sanitizeUser(d) 并删除那三行；pendingRaw=d 保持不变，合并导入（Merge Import）仍用原始 d，合并函数 mergeImportBackup 本身未动。④ 校验补全并拒收 null（纵深防御 Defense in Depth）：原 8 条校验的「!=null」一律改为「!==undefined」（字段存在但为 null 或坏类型即报错），并追加 9 条——masteryTs、planner、dimMastery、tags、drafts、mock、selfeval 为对象校验，examList、mockHistory 为数组校验，报错文案统一为「XX 字段类型错误（应为对象/数组）」；校验失败仍不改动现有数据、提示文案不变。⑤ 清空重置用统一默认值：U=defaultU();saveUser();flushSave()，其余不变；导出随之自动包含全部字段（含 drafts/mock/selfeval）。⑥ 附带两处小优化（审计观察项）：写入函数 doWrite() 入口加 clearTimeout(saveTimer);saveTimer=null，避免补写后旧定时器再发一次同版本写盘；Essay Log 手动保存按钮（保存这条练习记录）处理后加 flushSave()，与交卷、归档、导入等关键操作一致；材料题（Data Response）作答/自评输入保持 250ms 防抖（debounce）不变，仍由 pagehide 兜底。</p>'

function isMobileNav(){return window.matchMedia?window.matchMedia("(max-width:860px)").matches:false;}
function openMobileNav(){
  $("#sidebar").classList.add("open");$("#scrim").classList.add("on");
  $("#menubtn").setAttribute("aria-expanded","true");
  if(!isMobileNav())return;
  const m=$("#main");if(m){m.inert=true;m.setAttribute("aria-hidden","true");}
  const first=$("#sidebar").querySelector("button,[href],input,select,textarea,[tabindex]:not([tabindex='-1'])");
  if(first)first.focus();
}
function closeMobileNav(returnFocus){
  $("#sidebar").classList.remove("open");$("#scrim").classList.remove("on");
  $("#menubtn").setAttribute("aria-expanded","false");
  const m=$("#main");if(m){m.inert=false;m.removeAttribute("aria-hidden");}
  if(returnFocus&&isMobileNav()){const b=$("#menubtn");if(b)b.focus();}
}
document.addEventListener("keydown",function(e){
  if(!$("#sidebar").classList.contains("open")||!isMobileNav())return;
  if(e.key==="Escape"){e.preventDefault();closeMobileNav(true);return;}
  if(e.key!=="Tab")return;
  const items=Array.from($("#sidebar").querySelectorAll("button,[href],input,select,textarea,[tabindex]:not([tabindex='-1'])")).filter(function(el){return !el.disabled;});
  if(!items.length)return;
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
$("#menubtn").addEventListener("click",openMobileNav);
$("#scrim").addEventListener("click",()=>closeMobileNav(true));
const _skip=document.querySelector(".skip-link");
if(_skip)_skip.addEventListener("click",()=>{const m=$("#main");if(m)m.focus();});
