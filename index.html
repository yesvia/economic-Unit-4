 $("#sidebar").innerHTML='<div class="brand"><b>Elite Economist System</b><span>Edexcel IAL Economics · Unit 4<br>WEC14/01 · 目标 80/80（训练目标，非保证）</span></div>'+
 NAV.map(gr=>'<div class="navgroup">'+esc(gr.g)+'</div>'+gr.items.map(it=>'<button class="navitem'+(curView===it[0]?" active":"")+'" data-nav="'+it[0]+'"><span class="dot"></span>'+esc(it[1])+'</button>').join("")).join("");
 $$("#sidebar [data-nav]").forEach(b=>b.addEventListener("click",()=>{go(b.dataset.nav);$("#sidebar").classList.remove("open");$("#scrim").classList.remove("on");}));
}
function go(view,param){curView=view;curParam=param||null;buildNav();render();window.scrollTo(0,0);}
function render(){
 const v=$("#view");const fn=VIEWS[curView]||VIEWS.dashboard;
 try{v.innerHTML=fn(curParam);const bind=BINDS[curView];if(bind)bind(curParam);}
 catch(e){v.innerHTML='<div class="empty"><b>页面加载出错。</b><br>错误信息：'+esc(e.message)+'<br>请刷新重试；若反复出现，请到「设置」导出 JSON 备份你的数据。</div>';}
}
/* ================= 通用小组件 ================= */
function favBtn(id,label){const on=!!U.favs[id];return '<button class="favbtn'+(on?" on":"")+'" data-fav="'+esc(id)+'">'+(on?"♥ 已收藏":"♡ 收藏")+(label?" "+esc(label):"")+'</button>';}
function askBtn(text){return '<button class="askbtn" data-ask="'+esc(text)+'">问 Viaana</button>';}
function masteryCtl(id){const m=U.mastery[id];return '<span class="mastery" data-mastery="'+esc(id)+'">'+[0,1,2,3,4].map(i=>'<button data-mv="'+i+'" class="'+(m===i?"on":"")+'" title="'+esc(MASTERY_LABELS[i])+'">'+i+'</button>').join("")+'</span> <small>'+(m==null?"未标记掌握程度":esc(MASTERY_LABELS[m]))+'</small>';}
function noteBox(id,ph){return '<textarea class="notebox" data-note="'+esc(id)+'" placeholder="'+esc(ph||"我的笔记（自动保存到本机）")+'">'+esc(U.notes[id]||"")+'</textarea>';}
function userCtl(id,askText){return '<div class="btnrow">'+favBtn(id)+askBtn(askText)+'</div><div><span class="sm mut">掌握程度：</span>'+masteryCtl(id)+'</div>'+noteBox(id);}
function bindUserCtl(root){
 root.querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.fav;if(U.favs[id])delete U.favs[id];else U.favs[id]=Date.now();saveUser();const on=!!U.favs[id];$$('[data-fav="'+CSS.escape(id)+'"]').forEach(x=>{x.classList.toggle("on",on);x.textContent=on?"♥ 已收藏":"♡ 收藏";});toast(on?"已收藏":"已取消收藏");}));
 root.querySelectorAll("[data-ask]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.ask)));
 root.querySelectorAll("[data-mastery]").forEach(w=>{w.querySelectorAll("[data-mv]").forEach(btn=>btn.addEventListener("click",()=>{U.mastery[w.dataset.mastery]=+btn.dataset.mv;U.masteryTs=U.masteryTs||{};U.masteryTs[w.dataset.mastery]=Date.now();saveUser();render();}));});
 root.querySelectorAll("[data-note]").forEach(t=>t.addEventListener("change",()=>{U.notes[t.dataset.note]=t.value;saveUser();toast("笔记已保存");}));
 root.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go,b.dataset.param||null)));
}
function specCoverage(){let f=0,t=0;SPEC.forEach(s=>s.items.forEach(i=>{t++;if(i.st==="full")f++;}));return{f,t};}
function kpById(id){return KB.find(k=>k.id===id);}
function essayByCode(code){return ESSAYS.find(e=>e.code===code);}
function mcqStats(){const L=U.mcqLog;if(!L.length)return null;const c=L.filter(x=>x.correct).length;return{n:L.length,c,acc:Math.round(c/L.length*100)};}
function daysToExam(){if(!U.settings.examDate)return null;const d=new Date(U.settings.examDate+"T23:59:59");const now=new Date();return Math.ceil((d-now)/86400000);}
/* ================= VIEWS ================= */
const VIEWS={}, BINDS={};
VIEWS.dashboard=function(){
 const cov=specCoverage();const ms=mcqStats();const dte=daysToExam();
 const fullKPs=KB.filter(k=>k.st==="full");const mastered=fullKPs.filter(k=>(U.mastery[k.id]||0)>=3).length;
 const started=fullKPs.filter(k=>U.mastery[k.id]!=null).length;
 const unres=U.mistakes.filter(m=>!m.resolved).length;
 let h='<h1>Dashboard · 学习总览</h1><p class="mut">Pearson Edexcel International A Level Economics（YEC11）· Unit 4 — Developments in the Global Economy（WEC14/01）· 2 小时 / 80 分：Section A 选择题 6 分 · Section B 材料题 34 分 · Section C Essay 三选二 40 分。这里只显示你的真实学习记录，没有记录时显示空状态。</p>';
 h+='<div class="grid">'
 +'<div class="stat"><b>'+cov.f+" / "+cov.t+'</b><span>官方考纲条目内容覆盖（已核对填充 / 全部条目）</span></div>'
 +'<div class="stat"><b>'+(started?mastered+" / "+fullKPs.length:"—")+'</b><span>已填充知识点达到「能独立应用」（掌握度 ≥3）</span></div>'
 +'<div class="stat"><b>'+(ms?ms.acc+"%":"—")+'</b><span>MCQ 练习正确率'+(ms?"（共 "+ms.n+" 题次）":"")+'</span></div>'
 +'<div class="stat"><b>'+unres+'</b><span>错题本未解决条目</span></div>'
 +'<div class="stat"><b>'+Object.keys(U.favs).length+'</b><span>我的收藏</span></div>'
 +'<div class="stat"><b>'+(dte==null?"未设置":dte+" 天")+'</b><span>距离考试（在「设置」填写你的真实考试日期）</span></div></div>';
 if(!ms&&!started&&!U.mistakes.length){
  h+='<div class="empty"><b>还没有学习记录。</b>建议的起步顺序：① 先看「知识库」顶部的官方考纲核对清单，确认六大主题全貌；② 学 Ch.21 第一个知识点并标记掌握程度；③ 到 MCQ Bank 做一组练习——你的正确率、错题和薄弱点会自动从真实记录生成，不会用假数据填充。</div>';
 }
 h+='<div class="card pink"><h3 style="margin-top:0">双轨架构 · Elite Economist System</h3><div class="grid2"><div><span class="tag">TRACK A</span><b>考试卓越</b><p class="sm mut">Knowledge Base · Essay Library · Exam Frequency · AI Practice Room · Mock Examination（模拟考试在后续轮次接入真实题组）</p></div><div><span class="tag mint">TRACK B</span><b>思维卓越</b><p class="sm mut">First Principles · Logic Challenge · Advanced Evaluation · Unseen Scenarios · Research Lab（在 Elite Economist Training 模块）</p></div></div><p class="sm">底层共享：个人记忆、错题、收藏、训练记录、复习计划、IndexedDB 持久化数据库——全部模块读写同一份你的数据。</p><p class="sm mut">初始时间分配建议（后续按真实表现调整，临近考试提高 Track A 比重）：官方知识与考试能力 45% · Essay 写作与批改 25% · 经济学思维与逻辑训练 20% · 大学级拓展 10%。</p><p class="sm"><i>不要成为一个能够背出所有经济学答案的人，要成为一个即使遇到从未见过的经济学问题，也能够自己推导出答案的人。</i></p></div>';
 /* Personal Exam Strategy */
 h+='<h2>Personal Exam Strategy · 个人考试策略分析</h2>';
 if(!ms&&!U.mistakes.length&&!started){
  h+='<div class="card"><p><span class="tag gold">示意数据</span><small>以下为界面示意数据，并非你的真实成绩。等你有了练习记录，这里会自动换成基于真实数据的分析。</small></p>'
  +[["Knowledge",88,"较强",""],["Application",58,"需要加强",""],["Analysis",52,"需要加强",""],["Evaluation",34,"重点薄弱项",""]].map(r=>'<p style="margin:.2rem 0"><b>'+r[0]+'</b> <span class="tag '+(r[1]>70?"mint":r[1]>45?"gold":"red")+'">'+r[2]+'</span></p><div class="bar'+(r[1]>70?" mint":"")+'"><i style="width:'+r[1]+'%"></i></div>').join("")
  +'<p class="sm"><b>系统建议（示意）：</b>下一阶段优先训练 Evaluation 和 Analysis，而不是继续重复已经掌握的定义。</p></div>';
 }else{
  const byKp={};U.mistakes.filter(m=>!m.resolved).forEach(m=>{if(m.kp)byKp[m.kp]=(byKp[m.kp]||0)+1;});
  const worst=Object.keys(byKp).sort((a,b)=>byKp[b]-byKp[a]).slice(0,3);
  const low=fullKPs.filter(k=>(U.mastery[k.id]==null||U.mastery[k.id]<=1)).slice(0,5);
  h+='<div class="card mint"><p class="sm mut">以下全部来自你的真实记录（MCQ '+(ms?ms.n:0)+' 题次 · 未解决错题 '+unres+' 条）。</p>'
  +(worst.length?'<p><b>错题最集中的知识点：</b>'+worst.map(id=>{const k=kpById(id);return k?esc(k.ch+" "+k.zh)+"（"+byKp[id]+" 条）":id;}).join("；")+'</p>':"")
  +(ms?'<p><b>MCQ 正确率：</b>'+ms.acc+'%——'+(ms.acc>=80?"知识识别较稳，下一步把重心放到 Essay 的分析与评价链条。":ms.acc>=60?"先回知识库补对应知识点的「MCQ 易错点」，再重练错题。":"正确率偏低：按章节回炉知识点，先求定义与机制准确，再做限时练习。")+'</p>':"")
  +(low.length?'<p><b>下一周最值得投入的知识点（掌握度最低优先）：</b></p><ul class="tight">'+low.map(k=>'<li>'+esc(k.ch+" · "+k.zh)+' <button class="btn sm ghost" data-go="kb" data-param="'+k.id+'">去学习</button></li>').join("")+'</ul>':"")
  +'<p class="sm mut">Analysis 与 Evaluation 哪个更薄弱、哪类题型最易失分，需要 Essay/材料题批改记录才能判断——写完答案后用「问 Viaana」发到聊天批改，结论会记在错题本的错误类型里。</p></div>';
 }
 h+='<h2>今日建议</h2><div class="card"><ul class="tight">'
 +(unres?'<li>先清错题本：还有 <b>'+unres+'</b> 条未解决错题。<button class="btn sm ghost" data-go="mistakes">打开错题本</button></li>':"")
 +'<li>按考纲顺序推进：知识库里标「已填充」的 Ch.21–25 是本轮已核对内容；其余主题条目已列、内容待补充，不会用编造内容填充。</li>'
 +'<li>写 Essay 后点任意题目旁的「问 Viaana」，把题目和你的答案复制到聊天里按官方 AO 批改——站内没有实时 AI，不会用模板假装批改。</li></ul></div>';
 return h;
};
BINDS.dashboard=function(){bindUserCtl($("#view"));};
/* ---------- Knowledge Base ---------- */
VIEWS.kb=function(param){
 if(param&&kpById(param))return kbDetail(param);
 let h='<h1>Knowledge Base · 知识库</h1><p class="mut">严格按官方 Specification 六大主题组织。主题一（Ch.21–22）与主题二（Ch.23–25 及贸易集团/保护主义 Ch.26–27）内容已填充，其中 Ch.21–25 按官方 Mark Scheme 核对报告核对；其余主题条目与结构已建，内容标「待补充」，不编造。去全球化/慢全球化等拓展概念已单独标注，不是独立官方条目。</p>';
 h+='<div class="card"><h3 style="margin-top:0">官方考纲核对清单（Specification Checklist）</h3>';
 SPEC.forEach(s=>{const th=THEMES[s.t-1];const f=s.items.filter(i=>i.st==="full").length;
  h+='<details><summary>主题 '+th.n+" · "+esc(th.zh)+' <span class="sm mut en">'+esc(th.en)+'</span> <span class="tag '+(f===s.items.length?"mint":"gold")+'">已填充 '+f+" / "+s.items.length+'</span></summary><div>'
  +s.items.map(i=>'<div class="checkrow"><span class="st tag '+(i.st==="full"?"mint":"gold")+'">'+(i.st==="full"?"已填充":"待补充")+'</span><div><b>'+esc(i.zh)+'</b><br><span class="sm mut en">'+esc(i.en)+'</span>'+(i.kp?' <button class="btn sm ghost" data-go="kb" data-param="'+i.kp+'">打开知识点</button>':"")+'</div></div>').join("")+'</div></details>';});
 h+='<p class="sm mut">覆盖原则：不因低频删除任何官方条目；状态以逐条核对为准。来源：Pearson Edexcel IAL Economics Specification（2018, Issue 2）与官方 Mark Schemes 核对报告。</p></div>';
 h+='<h2>知识点</h2><div class="pill-nav">'+THEMES.map(t=>'<button data-th="'+t.n+'">主题'+t.n+" "+esc(t.zh)+'</button>').join("")+'</div><div id="kplist"></div>';
 return h;
};
function kbListHTML(theme){
 const list=KB.filter(k=>!theme||k.theme===theme);
 return list.map(k=>{
  if(k.st==="pending")return '<div class="card"><span class="tag gold">内容待补充</span> <b>'+esc(k.zh)+'</b><br><span class="sm mut en">'+esc(k.en)+'</span><p class="sm mut">对应考纲：'+esc(k.spec)+'。条目与结构已建，内容将在后续轮次按官方资料逐条填充，本轮不编造。</p></div>';
  const m=U.mastery[k.id];
  return '<div class="card"><div class="secthead"><b>'+esc(k.ch)+" · "+esc(k.zh)+'</b><span class="tag mint">已核对</span>'+(m!=null?'<span class="tag">掌握度 '+m+'</span>':"")+'</div><p class="sm mut en">'+esc(k.en)+'</p><p class="sm">'+esc(k.defZh)+'</p><div class="btnrow"><button class="btn sm" data-go="kb" data-param="'+k.id+'">展开学习</button>'+favBtn(k.id)+askBtn("请讲解这个 U4 知识点并考我："+k.ch+" "+k.zh+"（"+k.en+"）。定义："+k.defZh)+'</div></div>';
 }).join("");
}
BINDS.kb=function(param){
 bindUserCtl($("#view"));
 if(param&&kpById(param))return;
 const list=$("#kplist");if(!list)return;
 const paint=t=>{list.innerHTML=kbListHTML(t);bindUserCtl(list);$$("#view .pill-nav button").forEach(b=>b.classList.toggle("on",+b.dataset.th===t));};
 $$("#view .pill-nav button").forEach(b=>b.addEventListener("click",()=>paint(+b.dataset.th)));
 paint(0);
};
function kbDetail(id){
 const k=kpById(id);if(!k||k.st!=="full")return '<div class="empty">该知识点内容待补充。</div>';
 const row=(t,v)=>v?'<p class="kv"><b class="t">'+t+'：</b>'+v+'</p>':"";
 let h='<button class="btn ghost sm" data-go="kb">← 返回知识库</button><h1 style="margin-top:10px">'+esc(k.ch)+" · "+esc(k.zh)+'</h1><p class="mut en">'+esc(k.en)+'</p><p><span class="tag mint">已核对 · 官方 Mark Scheme 口径</span><span class="tag grey">'+esc(k.spec)+'</span></p>';
 h+=userCtl(k.id,"请详细讲解并考我这个知识点："+k.ch+" "+k.zh+"（"+k.en+"）\n英文定义："+k.defEn+"\n因果链："+k.chain);
 h+='<div class="card">'
 +row("英文定义 (Definition)",'<span class="en">'+esc(k.defEn)+'</span>')
 +row("中文解释",esc(k.defZh))
 +row("核心原理",esc(k.principle))
 +row("形成原因",esc(k.causes))
 +row("运行机制",esc(k.mechanism))
 +'<p class="kv"><b class="t">完整因果逻辑链：</b></p><div class="chain">'+arrows(k.chain)+'</div>'
 +(k.diagram?diagramHTML(k.diagram)+(k.diagramNote?'<p class="sm mut">'+esc(k.diagramNote)+'</p>':""):"")
 +row("现实案例",esc(k.caseTxt))
 +row("Essay 应用",esc(k.essayUse))
 +row("Data Response 应用",esc(k.drUse))
 +row("MCQ 易错点",esc(k.mcqTrap))
 +row("常见概念混淆",esc(k.confusion))
 +row("常见失分原因",esc(k.lose))
 +'</div>';
 if(k.qs&&k.qs.length){h+='<div class="card"><h3 style="margin-top:0">相关历年真题</h3>'+k.qs.map(c=>{const e=essayByCode(c);const p=parseCode(c);return '<p><button class="btn sm ghost" data-go="essays" data-param="'+c+'">'+c+'</button> '+(e?esc(e.zh):"")+' <span class="sm mut">'+p.section+" · "+(p.marks?p.marks+" 分":"")+'</span></p>';}).join("")+'</div>';}
 return h;
}
</script>

<script>
/* ---------- Essay Library ---------- */
let essayFilter={sec:"all",cat:"all",q:""};
VIEWS.essays=function(param){
 if(param&&essayByCode(param))return essayDetail(param);
 let h='<h1>Essay Library · 范文库</h1><p class="mut">84 道题完整目录（2020.10–2026.05，21 个考试季），按真实 Section 分开：题号 7(e) 属 Section B（14 分），8/9/10 属 Section C（20 分，三选二）。代码含 A 的是 WEC14/01A 中国地区卷，与 WEC14/01 分开标注、不混用。目录原书把两者混标为「Section B 论述题」，此处已按真实结构纠正。<b>第一轮修复说明：</b>202506A-1 经指出为 June 2025 WEC14/01A 的 Section A 选择题（Lewis 双部门模型与工业化），已移出 Essay 分类；另有 4 条目录题号只写到 Q7（如 202506A-7、202605A-7、202601A-7、202510A-7），其小问尚未逐条核对官方试卷，标「题号待核实」——不未经核实就改成 7(e)。</p>';
 h+='<div class="btnrow"><input type="search" id="eq" placeholder="搜索题号 / 中文题意 / 英文原文…" style="flex:1;min-width:200px" value="'+esc(essayFilter.q)+'">'
 +'<select id="esec"><option value="all">全部 Section</option><option value="Section B">Section B · 7(e)</option><option value="Section C">Section C · 8/9/10</option></select>'
 +'<select id="ecat"><option value="all">全部分类</option>'+CATS.map(c=>'<option'+(essayFilter.cat===c?" selected":"")+'>'+c+'</option>').join("")+'</select></div><div id="elist"></div>';
 return h;
};
function essayListHTML(){
 const q=essayFilter.q.trim().toLowerCase();
 const list=ESSAYS.filter(e=>{const p=parseCode(e.code);
  if(essayFilter.sec!=="all"&&p.section!==essayFilter.sec)return false;
  if(essayFilter.cat!=="all"&&e.cat!==essayFilter.cat)return false;
  if(q){const en=(VER[e.code]||{}).en||"";if(!(e.code.toLowerCase().includes(q)||e.zh.includes(q)||en.toLowerCase().includes(q)))return false;}
  return true;});
 if(!list.length)return '<div class="empty">没有符合条件的题目。换个关键词试试。</div>';
 return '<p class="sm mut">共 '+list.length+' 道</p>'+list.map(e=>{const p=parseCode(e.code);const v=VER[e.code];
  return '<div class="card" style="padding:12px 16px"><div class="secthead"><b>'+e.code+'</b>'
  +'<span class="tag">'+p.section+(p.marks?" · "+p.marks+" 分":"")+'</span>'
  +(p.unverified?'<span class="tag red">题号待核实</span>':"")
  +(p.china?'<span class="tag gold">01A 中国地区卷</span>':"")
  +'<span class="tag grey">'+esc(e.cat)+'</span><span class="tag grey">'+esc(e.ch)+'</span>'
  +(MODELS[e.code]?'<span class="tag mint">有范文</span>':v?'<span class="tag mint">原文+评分要点已核对</span>':'<span class="tag gold">范文待补充</span>')
  +'</div><p style="margin:.3rem 0"><b>'+esc(e.zh)+'</b>'+(v?'<br><span class="sm en mut">'+esc(v.en)+'</span>':"")+'</p>'
  +'<div class="btnrow"><button class="btn sm" data-go="essays" data-param="'+e.code+'">打开</button>'+favBtn("essay:"+e.code)+askBtn("请讲解这道 U4 真题的思路："+e.code+" "+e.zh+(v?"\n英文原文："+v.en:""))+'</div></div>';}).join("");
}
BINDS.essays=function(param){
 bindUserCtl($("#view"));
 $$("#view [data-copyessay]").forEach(b=>b.addEventListener("click",()=>{const mo=MODELS[b.dataset.copyessay];if(mo)copyText("题目 "+b.dataset.copyessay+" 的 AI 参考范文（非官方范文）与我的问题：\n\n"+mo.paras.join("\n\n"));}));
 if(param&&essayByCode(param))return;
 const paint=()=>{$("#elist").innerHTML=essayListHTML();bindUserCtl($("#elist"));};
 $("#eq").addEventListener("input",e=>{essayFilter.q=e.target.value;paint();});
 $("#esec").addEventListener("change",e=>{essayFilter.sec=e.target.value;paint();});
 $("#ecat").addEventListener("change",e=>{essayFilter.cat=e.target.value;paint();});
 $("#esec").value=essayFilter.sec;paint();
};
function essayDetail(code){
 const e=essayByCode(code);const p=parseCode(code);const v=VER[code];const mo=MODELS[code];

let MCQSES=null, mcqTimerInt=null;
function stopMcqTimer(){if(mcqTimerInt){clearInterval(mcqTimerInt);mcqTimerInt=null;}}
VIEWS.mcq=function(){
 return '<h1>MCQ Bank · 选择题库</h1><p class="mut">Section A 在真考中是 6 道题、6 分。本库严格区分来源：<span class="tag grey">Pearson Official Past Paper Questions · 官方原题：0 道（待补充）</span> <span class="tag gold">Original Practice Questions · 自编练习题：'+MCQS.length+' 道（下方全部）</span>。自编题依据已核对的 Section A 考查范围编写，不是 Pearson 官方原题；每题都带来源标签。每题含中英双语、详细解析与每个错误选项的原因。答错会自动进入错题本。</p>'
 +'<div class="card"><h3 style="margin-top:0">选择练习模式</h3><div class="btnrow">'
 +'<button class="btn" data-mode="random">随机练习（全部 '+MCQS.length+' 题）</button>'
 +'<button class="btn ghost" data-mode="wrong">错题重练'+(U.mcqLog.some(x=>!x.correct)?"":"（暂无错题）")+'</button>'
 +'<button class="btn ghost" data-mode="timed">限时练习（10 题 · 10 分钟）</button>'
 +'<button class="btn mint" data-mode="mock">模拟 Section A（6 题）</button></div>'
 +'<div class="btnrow"><span class="sm mut" style="align-self:center">按章节：</span>'+["Ch.21","Ch.22","Ch.23","Ch.24","Ch.25"].map(c=>'<button class="btn sm ghost" data-mode="ch" data-ch="'+c+'">'+c+'</button>').join("")+'</div>'
 +'<p class="sm mut">'+esc(MCQ_SRC)+'。已练习 '+(mcqStats()?mcqStats().n:0)+' 题次。</p></div><div id="mcqstage"></div>';
};
function startMcq(mode,ch){
 let list=MCQS.slice();
 if(mode==="ch")list=list.filter(q=>q.ch===ch);
 if(mode==="wrong"){const wrongIds={};U.mcqLog.forEach(x=>{if(!x.correct)wrongIds[x.qid]=1;});list=list.filter(q=>wrongIds[q.id]);if(!list.length){toast("暂无错题记录，先做一组随机练习");return;}}
 list=list.sort(()=>Math.random()-0.5);
 if(mode==="timed")list=list.slice(0,10);
 if(mode==="mock")list=list.slice(0,6);
 MCQSES={list,idx:0,score:0,mode,answered:false,left:(mode==="timed"?600:mode==="mock"?600:null)};
 paintMcq();startMcqTimer();
}
function startMcqTimer(){stopMcqTimer();if(!MCQSES||MCQSES.left==null)return;mcqTimerInt=setInterval(()=>{MCQSES.left--;const t=$("#mcqtimer");if(t)t.textContent=fmtTime(MCQSES.left);if(MCQSES.left<=0){stopMcqTimer();finishMcq(true);}},1000);}
function fmtTime(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function paintMcq(){
 const st=$("#mcqstage");if(!st||!MCQSES)return;const s=MCQSES;const q=s.list[s.idx];
 if(!q){finishMcq(false);return;}
 const kp=kpById(q.kp);
 st.innerHTML='<div class="card"><div class="secthead"><b>第 '+(s.idx+1)+" / "+s.list.length+' 题</b><span class="tag gold">自编练习题 · Original Practice</span><span class="tag">'+esc(q.ch)+'</span><span class="tag grey">'+esc(q.spec)+'</span>'+(s.left!=null?'<span class="timer" id="mcqtimer" style="font-size:1.2rem">'+fmtTime(s.left)+'</span>':"")+'</div>'
 +'<p class="en" style="font-size:1.02rem">'+esc(q.q)+'</p><p class="mut">'+esc(q.qzh)+'</p>'
 +q.opts.map((o,i)=>'<button class="opt" data-opt="'+i+'"><b>'+"ABCD"[i]+'.</b> '+esc(o)+'</button>').join("")
 +'<div id="mcqfb"></div>'
 +'<div class="btnrow">'+favBtn("mcq:"+q.id)+askBtn("请讲解这道 U4 选择题："+q.q+"\n选项："+q.opts.join(" / "))+(kp?'<button class="btn sm ghost" data-go="kb" data-param="'+kp.id+'">相关知识点：'+esc(kp.zh)+'</button>':"")+'</div>'
 +'<p class="sm mut">'+esc(MCQ_SRC)+'</p></div>';
 bindUserCtl(st);
 st.querySelectorAll("[data-opt]").forEach(b=>b.addEventListener("click",()=>answerMcq(+b.dataset.opt)));
}
function answerMcq(i){
 const s=MCQSES;if(!s||s.answered)return;s.answered=true;const q=s.list[s.idx];const ok=i===q.ans;
 if(ok)s.score++;
 U.mcqLog.push({qid:q.id,correct:ok,ts:Date.now(),mode:s.mode});
 if(!ok){
  if(!U.mistakes.some(m=>m.kind==="mcq"&&m.ref===q.id&&!m.resolved)){
   U.mistakes.push({id:"mk"+Date.now(),ts:Date.now(),kind:"mcq",ref:q.id,q:q.q,myAnswer:q.opts[i],correctAnswer:q.opts[q.ans],basis:q.why,errType:"",kp:q.kp,reviews:0,resolved:false,note:""});
  }
 }
 saveUser();
 const st=$("#mcqstage");
 st.querySelectorAll("[data-opt]").forEach((b,bi)=>{b.disabled=true;if(bi===q.ans)b.classList.add("right");else if(bi===i)b.classList.add("wrong");});
 $("#mcqfb").innerHTML='<div class="'+(ok?"chain":"")+'" style="'+(ok?"":"background:var(--red-soft);border-radius:10px;padding:10px 14px")+'"><p><b>'+(ok?"✓ 答对":"✗ 答错（已加入错题本）")+'</b></p><p>'+esc(q.why)+'</p><p class="sm"><b>其他选项为什么错：</b></p><ul class="tight">'+q.opts.map((o,oi)=>oi===q.ans?"":'<li><b>'+"ABCD"[oi]+'.</b> '+esc(q.wrong[oi]||"")+'</li>').join("")+'</ul></div>'
 +'<div class="btnrow"><button class="btn" id="mcqnext">'+(s.idx+1<s.list.length?"下一题":"查看结果")+'</button></div>';
 $("#mcqnext").addEventListener("click",()=>{s.idx++;s.answered=false;paintMcq();});
}
function finishMcq(timeout){
 stopMcqTimer();const s=MCQSES;const st=$("#mcqstage");if(!st||!s)return;
 st.innerHTML='<div class="card mint"><h3 style="margin-top:0">'+(timeout?"时间到 · ":"")+'练习完成</h3><p>得分：<b>'+s.score+" / "+s.list.length+'</b>（模式：'+esc(s.mode)+'）</p><p class="sm mut">错题已自动进入错题本；到「错题重练」或错题本里复习。把不确定的题点「问 Viaana」发到聊天里深挖。</p><div class="btnrow"><button class="btn" data-go="mcq">再来一组</button><button class="btn ghost" data-go="mistakes">打开错题本</button></div></div>';
 bindUserCtl(st);MCQSES=null;
}

/* ---------- Revision Planner ---------- */
function kpSchedule(k){
 const DAY=86400000,now=Date.now();
 const errs=U.mistakes.filter(m=>m.kp===k.id&&!m.resolved).length;
 const wrongLogs=U.mcqLog.filter(x=>!x.correct&&(MCQS.find(q=>q.id===x.qid)||{}).kp===k.id).length;
 const errLoad=errs+wrongLogs;
 const acts=[];
 if(U.masteryTs&&U.masteryTs[k.id])acts.push(U.masteryTs[k.id]);
 U.mistakes.filter(m=>m.kp===k.id).forEach(m=>acts.push(m.lastReview||m.ts));
 U.mcqLog.filter(x=>(MCQS.find(q=>q.id===x.qid)||{}).kp===k.id).forEach(x=>acts.push(x.ts));
 const last=acts.length?Math.max.apply(null,acts):null;
 const m=U.mastery[k.id];
 const base=m==null?1:[1,2,4,7,14][m];
 const interval=Math.max(1,Math.round(base/(1+0.5*errLoad)));
 if(last==null)return{fresh:true,interval,due:now,errLoad,overdueDays:0};
 const due=last+interval*DAY;
 return{fresh:false,interval,due,errLoad,overdueDays:Math.floor((now-due)/DAY)};
}

 h+='<div class="card"><h3 style="margin-top:0">计时器</h3><div class="btnrow"><span class="timer" id="tktimer">120:00</span></div><div class="btnrow">'
 +'<button class="btn sm" data-tk="7200">整卷 120 分钟</button><button class="btn sm ghost" data-tk="3000">Section B 约 50 分钟</button><button class="btn sm ghost" data-tk="1800">Essay 30 分钟</button><button class="btn sm ghost" data-tk="600">Section A 约 10 分钟</button>'
 +'<button class="btn sm mint" id="tkgo">开始 / 暂停</button><button class="btn sm ghost" id="tkreset">重置</button></div>'
 +'<p class="sm mut">时间分配按 80 分对应 120 分钟（约 1.5 分钟/分）估算：Section C 每篇 20 分 Essay 约 30 分钟（含 5 分钟列两条链提纲）。</p></div>';
 h+='<div class="card"><h3 style="margin-top:0">指令词 (Command Words)</h3>'+COMMAND_WORDS.map(c=>'<p class="kv"><b class="t">'+esc(c[0])+'：</b>'+esc(c[1])+'</p>').join("")+'<p class="sm mut">注意：同一指令词在不同分值下要求不同（如 4 分与 8 分的 Examine 深度不同），且 Section B 每卷的小问分值与指令词逐卷不同——按该题的分值与官方 Mark Scheme 作答，不要把一种模板套到所有题目。</p></div>';
 h+='<div class="card"><h3 style="margin-top:0">官方等级描述（已核对 · 节选）</h3>'
 +'<p class="kv"><b class="t">Section C · KAA（12 分）：</b>L1 1–3 孤立/表面、无逻辑链；L2 4–6 只有两环链；L3 7–9 准确但链条未完全展开；<b>L4 10–12 知识准确精确、例子完全融入、多环节逻辑链</b>。注意：「不点名国家封顶 L3」只适用于题干明确要求国家例子（如 refer to a country of your choice）且官方 Mark Scheme 如此规定的题目——逐题核对，不是所有 20 分 Essay 的通用规则；题干未要求国家时不适用。</p>'
 +'<p class="kv"><b class="t">Section C · Evaluation（8 分）：</b>L1 1–3 泛泛而谈；L2 4–6 有备选观点但链条部分展开；<b>L3 7–8 识别不同观点/批判证据，形成有依据的判断 (informed judgement)</b>。评价没有 L4。</p>'
 +'<p class="kv"><b class="t">Section B · Q7(e)（14 分）：</b>KAA 8 分（L3 7–8）+ Evaluation 6 分（L3 5–6），结构与 Essay 不同，不要混用。</p>'
 +'<p class="sm mut">阅卷共识：两个点写深胜过罗列多点；Q7(e) 必须用材料数据（照抄材料 = L1）；分析与评价要分清；结尾给有优先级的判断。</p></div>';
 h+='<div class="card"><h3 style="margin-top:0">公式卡</h3><ul class="tight"><li>贸易条件指数 =（出口价格指数 ÷ 进口价格指数）× 100</li><li>百分比变化 =（新 − 旧）÷ 旧 × 100</li><li>马歇尔-勒纳条件：PEDx + PEDm > 1 时，货币贬值才改善贸易差额（该条件讨论的是贬值对差额的影响，不是所有贸易条件变化的通用判断；贸易条件还可因进口价格上涨、相对生产率变化等恶化，须按成因分析）</li><li>基尼系数 = 平等线与洛伦兹曲线间面积 ÷ 平等线以下总面积</li><li>经常账户 = 货物贸易差额 + 服务贸易差额 + 初次收入 + 二次收入</li></ul></div>';
 h+='<div class="card"><h3 style="margin-top:0">考前失分点清单</h3><ul class="tight"><li>题干要求点名国家（如 refer to a country of your choice）的 Section C 题不点名 → KAA 封顶 9 分（逐题以官方 MS 为准；题干未要求的题不适用此条）</li><li>因素题写成影响题（202310-8 vs 202101-8 最容易串）</li><li>链条只有两环 → KAA 封顶 Level 2</li><li>评价只罗列不排序、没有判断句</li><li>Q7(e) 不引用材料 / 照抄材料不解释</li><li>计算题不写过程、不标方向</li><li>贸易条件方向与福利判断混为一谈（不看弹性）</li></ul></div>';
 return h;
};
BINDS.toolkit=function(){
 bindUserCtl($("#view"));tkLeft=7200;
 const draw=()=>{const t=$("#tktimer");if(t)t.textContent=fmtTime(tkLeft);};draw();
 $$("#view [data-tk]").forEach(b=>b.addEventListener("click",()=>{tkLeft=+b.dataset.tk;draw();}));
 $("#tkgo").addEventListener("click",()=>{if(tkInt){clearInterval(tkInt);tkInt=null;return;}tkInt=setInterval(()=>{tkLeft--;draw();if(tkLeft<=0){clearInterval(tkInt);tkInt=null;toast("时间到");}},1000);});
 $("#tkreset").addEventListener("click",()=>{clearInterval(tkInt);tkInt=null;tkLeft=7200;draw();});
};

 +'<div class="card"><h3 style="margin-top:0">成绩与分数线</h3><p class="sm mut">本站记录你的<b>原始分</b>练习数据（见 Dashboard 与错题本）。各考试系列的官方等级分数线 (grade boundaries) 与 UMS 换算以 Pearson 官方发布为准，本轮<b>待补充</b>，不编造数字。80/80 是训练目标，不是本站或任何 AI 能保证的结果。</p></div>';

BINDS.settings=function(){
 bindUserCtl($("#view"));
 const th=$("#stheme"),ft=$("#sfont"),ex=$("#sexam");
 th.value=U.settings.theme||"dark";ft.value=String(U.settings.fontSize||100);
 th.addEventListener("change",()=>{U.settings.theme=th.value;saveUser();applyTheme();});
 ft.addEventListener("change",()=>{U.settings.fontSize=+ft.value;saveUser();applyTheme();});
 ex.addEventListener("change",()=>{U.settings.examDate=ex.value;saveUser();toast("考试日期已保存");});
 $("#sexport").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({app:"elite-economist-u4",version:1,exported:new Date().toISOString(),data:U},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="elite-economist-u4-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("备份文件已下载");});
 let pendingImport=null;
 $("#simport").addEventListener("change",ev=>{
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
   const obj=JSON.parse(r.result);
   if(typeof obj!=="object"||obj===null||Array.isArray(obj))throw new Error("文件不是备份对象");
   if(obj.app!=null&&obj.app!=="elite-economist-u4")throw new Error("应用标识不符，这不是 Elite Economist System 的备份");
   if(obj.version!=null&&(+obj.version)>1)throw new Error("备份版本 v"+obj.version+" 高于当前支持的 v1，可能不兼容，已拒绝导入");
   const d=obj.data||obj;
   if(typeof d!=="object"||d===null||Array.isArray(d))throw new Error("备份缺少数据区");
   const isObj=x=>typeof x==="object"&&x!==null&&!Array.isArray(x);
   if(d.favs!=null&&!isObj(d.favs))throw new Error("favs 字段类型错误（应为对象）");
   if(d.notes!=null&&!isObj(d.notes))throw new Error("notes 字段类型错误（应为对象）");
   if(d.mastery!=null&&!isObj(d.mastery))throw new Error("mastery 字段类型错误（应为对象）");
   if(d.mistakes!=null&&!Array.isArray(d.mistakes))throw new Error("mistakes 字段类型错误（应为数组）");
   if(d.mcqLog!=null&&!Array.isArray(d.mcqLog))throw new Error("mcqLog 字段类型错误（应为数组）");
   if(d.essayLog!=null&&!Array.isArray(d.essayLog))throw new Error("essayLog 字段类型错误（应为数组）");
   if(d.settings!=null&&!isObj(d.settings))throw new Error("settings 字段类型错误（应为对象）");
   const merged=Object.assign({favs:{},notes:{},mastery:{},masteryTs:{},mistakes:[],mcqLog:[],essayLog:[],settings:{theme:"dark",examDate:"",fontSize:100},planner:{}},d);
   merged.settings=Object.assign({theme:"dark",examDate:"",fontSize:100},d.settings||{});
   pendingImport=merged;
   const cnt=o=>Object.keys(o||{}).length, arr=a=>(a||[]).length;
   $("#simmsg").innerHTML="已读取并验证备份：收藏 "+cnt(merged.favs)+" · 笔记 "+cnt(merged.notes)+" · 掌握度 "+cnt(merged.mastery)+" · 错题 "+arr(merged.mistakes)+" · MCQ 记录 "+arr(merged.mcqLog)+" · Essay 记录 "+arr(merged.essayLog)+"。缺失字段已用默认值补齐。<b>导入会覆盖当前数据</b>，确认无误后再点下方按钮。<br><button class='btn sm' id='sconfirm' style='margin-top:6px'>确认导入并覆盖当前数据</button>";
   $("#sconfirm").addEventListener("click",()=>{U=pendingImport;pendingImport=null;saveUser();applyTheme();$("#simmsg").textContent="导入成功，数据已恢复。";toast("导入成功");render();});
  }catch(e){pendingImport=null;$("#simmsg").textContent="导入失败："+e.message+"。你的现有数据没有被改动。";}};
  r.onerror=()=>{$("#simmsg").textContent="导入失败：文件读取出错，请重试。你的现有数据没有被改动。";};
  r.readAsText(f);ev.target.value="";});
 let armed=false;const cl=$("#sclear");
 cl.addEventListener("click",()=>{if(!armed){armed=true;cl.textContent="再点一次确认清空（不可恢复）";setTimeout(()=>{armed=false;cl.textContent="清空全部个人数据";},4000);return;}
  U={favs:{},notes:{},mastery:{},masteryTs:{},mistakes:[],mcqLog:[],essayLog:[],settings:{theme:"dark",examDate:"",fontSize:100},planner:{}};saveUser();applyTheme();render();toast("个人数据已清空");});
};
/* ---------- Search ---------- */
let searchQ="";
VIEWS.search=function(){
 let h='<h1>双语搜索</h1><p class="mut">搜索范围：知识点、Essay、MCQ、术语、逻辑链、收藏、错题与笔记（中英文均可）。</p><input type="search" id="sq" placeholder="如：贸易条件 / terms of trade / 202310 / 比较优势…" style="width:100%" value="'+esc(searchQ)+'"><div id="sres" style="margin-top:12px"></div>';
 return h;
};
function searchHTML(q){
 q=q.trim().toLowerCase();if(q.length<2)return '<p class="mut">输入至少 2 个字符开始搜索。</p>';
 const hit=(...fields)=>fields.some(f=>f&&String(f).toLowerCase().includes(q));
 let h="";
 const ks=KB.filter(k=>k.st==="full"&&hit(k.zh,k.en,k.defZh,k.defEn,k.chain,k.principle));
 if(ks.length)h+='<h3>知识点（'+ks.length+'）</h3>'+ks.map(k=>'<div class="card" style="padding:10px 16px"><b>'+esc(k.ch+" · "+k.zh)+'</b> <span class="sm mut en">'+esc(k.en)+'</span><p class="sm">'+esc(k.defZh)+'</p><button class="btn sm" data-go="kb" data-param="'+k.id+'">打开</button></div>').join("");
 const es=ESSAYS.filter(e=>hit(e.code,e.zh,(VER[e.code]||{}).en,(VER[e.code]||{}).chain));
 if(es.length)h+='<h3>Essay（'+es.length+'）</h3>'+es.map(e=>'<div class="card" style="padding:10px 16px"><b>'+e.code+" · "+esc(e.zh)+'</b>'+(VER[e.code]?'<p class="sm en mut">'+esc(VER[e.code].en)+'</p>':"")+'<button class="btn sm" data-go="essays" data-param="'+e.code+'">打开</button></div>').join("");
 const mq=MCQS.filter(x=>hit(x.q,x.qzh));
 if(mq.length)h+='<h3>MCQ（'+mq.length+'）</h3>'+mq.map(x=>'<div class="card" style="padding:10px 16px"><b>'+esc(x.ch)+'</b><p class="sm">'+esc(x.qzh)+'</p><button class="btn sm" data-go="mcq">去练习</button></div>').join("");
 const fv=Object.keys(U.favs).filter(id=>{
  let txt=contentTitle(id);
  const k=kpById(id);if(k)txt+=" "+k.defZh+" "+k.defEn+" "+k.chain;
  if(id.indexOf("essay:")===0){const e=essayByCode(id.slice(6));if(e)txt+=" "+e.zh+" "+e.cat+" "+((VER[e.code]||{}).en||"");}
  if(id.indexOf("mcq:")===0){const qq=MCQS.find(x=>x.id===id.slice(4));if(qq)txt+=" "+qq.q+" "+qq.qzh;}
  return hit(txt);
 });
 if(fv.length)h+='<h3>我的收藏（'+fv.length+'）</h3>'+fv.map(id=>{const g=contentGo(id);return '<div class="card" style="padding:10px 16px"><b>♥ '+esc(contentTitle(id))+'</b>'+(U.notes[id]?'<p class="sm mut">笔记：'+esc(U.notes[id])+'</p>':"")+'<div class="btnrow"><button class="btn sm" data-go="'+g[0]+'" data-param="'+(g[1]||"")+'">打开原文</button></div></div>';}).join("");
 const mk=U.mistakes.filter(m=>hit(m.q,m.myAnswer,m.correctAnswer));
 if(mk.length)h+='<h3>错题（'+mk.length+'）</h3>'+mk.map(m=>'<div class="card" style="padding:10px 16px"><p class="sm">'+esc((m.q||"").slice(0,100))+'</p><button class="btn sm" data-go="mistakes">打开错题本</button></div>').join("");
 const nt=Object.keys(U.notes).filter(id=>hit(U.notes[id]));
 if(nt.length)h+='<h3>笔记（'+nt.length+'）</h3>'+nt.map(id=>'<div class="card" style="padding:10px 16px"><b>'+esc(contentTitle(id))+'</b><p class="sm">'+esc(U.notes[id])+'</p></div>').join("");
 return h||'<div class="empty">没有找到相关内容。试试英文术语（如 terms of trade）或题号（如 202310-8）。</div>';
}
BINDS.search=function(){bindUserCtl($("#view"));const inp=$("#sq"),res=$("#sres");const paint=()=>{res.innerHTML=searchHTML(inp.value);bindUserCtl(res);};inp.addEventListener("input",paint);paint();inp.focus();};

buildNav();
loadUser().then(()=>{render();});
