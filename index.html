<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />

<meta name="color-scheme" content="light dark" />

<title>Elite Economist System · Edexcel IAL Economics U4 (WEC14/01)</title>
<style>
:root{
  --bg:#FFF6F9; --bg2:#FFFDFE; --surface:#FFFFFF; --surface2:#FDEEF4; --surface3:#E9F9F0;
  --ink:#33182A; --ink2:#6E4A5E; --ink3:#7A5A6E;
  --pink:#D81B60; --pink-deep:#B3124F; --pink-soft:#FCE4EC; --pink-mid:#F78FB8;
  --mint:#0E9F7E; --mint-deep:#046A4D; --mint-soft:#D7F5E7; --mint-mid:#7BDDBE;
  --gold:#7A5200; --gold-soft:#FDF0D5;
  --on-pink:#fff; --on-mint:#fff;
  --red:#C62828; --red-soft:#FDE7E7;
  --line:#F3CFE0; --line2:#D9F0E4;
  --shadow:0 2px 14px rgba(216,27,96,.08);
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{
  --bg:#1C1017; --bg2:#241420; --surface:#2B1A26; --surface2:#38202F; --surface3:#17352A;
  --ink:#FBE9F2; --ink2:#D9AEC4; --ink3:#A97E95;
  --pink:#FF7EB0; --pink-deep:#FF9CC4; --pink-soft:#452233; --pink-mid:#C4507F;
  --mint:#4ADEB4; --mint-deep:#7BEBc9; --mint-soft:#14382C; --mint-mid:#2E7D63;
  --gold:#F2C14E; --gold-soft:#3D2F10;
  --red:#FF8A80; --red-soft:#402022;
  --line:#4A2C3E; --line2:#274A3B;
  --shadow:0 2px 14px rgba(0,0,0,.35);
  --on-pink:#1C1017; --on-mint:#1C1017;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,[role="button"],select,summary,input:not([type="checkbox"]),textarea{font-family:inherit}
button{min-height:2.25rem;cursor:pointer}
a{color:var(--pink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}
.skip-link{position:absolute;left:10px;top:-60px;z-index:100;background:var(--surface);color:var(--pink-deep);padding:8px 14px;border-radius:10px;border:2px solid var(--pink);font-weight:700;transition:top .15s ease}
.skip-link:focus{top:10px}
h1{font-size:1.55rem;line-height:1.3;margin:0 0 .4rem}
h2{font-size:1.25rem;margin:1.4rem 0 .6rem;line-height:1.35}
h3{font-size:1.05rem;margin:1.1rem 0 .45rem;line-height:1.4}
p{margin:.45rem 0}
small{color:var(--ink2)}
.en{font-family:Georgia,"Times New Roman",serif}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:238px;flex:0 0 238px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px 30px;z-index:40}
#sidebar .brand{padding:4px 8px 10px;border-bottom:2px solid var(--mint-soft);margin-bottom:10px}
#sidebar .brand b{font-size:1.02rem;color:var(--pink-deep);display:block;line-height:1.3}
#sidebar .brand span{font-size:.78rem;color:var(--ink2)}
.navgroup{font-size:.72rem;letter-spacing:.08em;color:var(--ink3);margin:14px 8px 4px;font-weight:700}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;font-size:.92rem;color:var(--ink);min-height:2.5rem}
.navitem:hover{background:var(--surface2)}
.navitem.active{background:var(--pink-soft);color:var(--pink-deep);font-weight:700}
.navitem .dot{width:8px;height:8px;border-radius:50%;background:var(--mint-mid);flex:0 0 8px}
.navitem.active .dot{background:var(--pink)}
#main{flex:1;min-width:0;padding:20px 22px 90px;max-width:1060px;margin:0 auto;width:100%}
#topbar{display:none}
#savebar{position:fixed;right:14px;bottom:14px;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem;color:var(--ink2);box-shadow:var(--shadow);max-width:calc(100vw - 28px)}
@media (max-width:860px){#savebar{left:14px;right:14px;text-align:center;bottom:10px;font-size:.78rem}}
#savebar b{color:var(--mint-deep)}
#savebar.fail{border-color:var(--red);background:var(--red-soft)}
#savebar.fail b{color:var(--red)}
#idbbanner{position:fixed;left:14px;right:14px;bottom:64px;z-index:61;background:var(--red-soft);border:2px solid var(--red);border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--ink);box-shadow:var(--shadow)}
#idbbanner b{color:var(--red)}
#idbbanner .btnrow{margin:8px 0 0}
@media (max-width:860px){#idbbanner{bottom:58px;font-size:.85rem}}
@media print{#idbbanner{display:none!important}}
@media (max-width:860px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);opacity:0;visibility:hidden;transition:transform .22s ease,opacity .22s ease,visibility 0s linear .22s;box-shadow:0 0 40px rgba(0,0,0,.25);width:262px;flex-basis:262px}
  #sidebar.open{transform:none;opacity:1;visibility:visible;transition:transform .22s ease,opacity .22s ease,visibility 0s}
  #topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line);margin:0 -14px 6px}
  #main{padding:12px 14px 90px}
  #scrim{display:none;position:fixed;inset:0;background:rgba(30,5,20,.4);z-index:35}
  #scrim.on{display:block}
}
/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.mint{border-color:var(--line2);background:linear-gradient(180deg,var(--surface),var(--surface3))}
.card.pink{background:linear-gradient(180deg,var(--surface),var(--surface2))}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--pink-soft);color:var(--pink-deep);margin:2px 4px 2px 0;vertical-align:middle}
.tag.mint{background:var(--mint-soft);color:var(--mint-deep)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.grey{background:var(--surface2);color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pink);background:var(--pink);color:var(--on-pink);border-radius:10px;padding:8px 14px;font-size:.9rem;font-weight:600;min-height:2.5rem}
.btn.ghost{background:var(--surface);color:var(--pink-deep)}
.btn.mint{background:var(--mint-deep);border-color:var(--mint-deep);color:var(--on-mint)}
.btn.mint.ghost{background:var(--surface);color:var(--mint-deep);border-color:var(--mint)}
.btn.sm{padding:5px 11px;font-size:.83rem;min-height:2.25rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input[type="search"],input[type="text"],input[type="date"],input[type="number"],select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.95rem;min-height:2.6rem}
textarea{width:100%;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{font-size:1.5rem;display:block;color:var(--pink-deep);line-height:1.2}
.stat span{font-size:.83rem;color:var(--ink2)}
.empty{border:1.5px dashed var(--pink-mid);border-radius:var(--radius);padding:18px;background:var(--surface2);color:var(--ink2)}
.chain{background:var(--mint-soft);border-radius:10px;padding:10px 14px;font-size:.93rem;line-height:1.8;color:var(--ink)}
.chain b{color:var(--mint-deep)}
.kv{margin:.3rem 0}
.kv b.t{color:var(--pink-deep)}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
details>summary{padding:11px 14px;font-weight:600;cursor:pointer;list-style:none;min-height:2.75rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>div{padding:2px 16px 14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
.tblwrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{color:var(--pink-deep);font-size:.82rem}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-mid),var(--pink));border-radius:99px}
.bar.mint i{background:linear-gradient(90deg,var(--mint-mid),var(--mint))}
.mastery{display:inline-flex;gap:4px;flex-wrap:wrap}
.mastery button{width:2.3rem;height:2.3rem;border-radius:50%;border:1.5px solid var(--mint-mid);background:var(--surface);color:var(--ink2);font-weight:700;padding:0}
.mastery button.on{background:var(--mint-deep);border-color:var(--mint-deep);color:var(--on-mint)}
.favbtn{border:1.5px solid var(--pink-mid);background:var(--surface);color:var(--pink);border-radius:999px;padding:5px 13px;font-size:.85rem;font-weight:700;min-height:2.3rem}
.favbtn.on{background:var(--pink);color:var(--on-pink)}
.askbtn{border:1.5px solid var(--mint);background:var(--surface);color:var(--mint-deep);border-radius:999px;padding:5px 13px;font-size:.85rem;font-weight:700;min-height:2.3rem}
.notebox{width:100%;min-height:64px;margin-top:8px}
.essaytext{font-family:Georgia,"Times New Roman",serif;font-size:1.03rem;line-height:1.85}
.essaytext p{margin:.7rem 0}
.zhtrans{line-height:1.9;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:7px 0;font-size:.97rem;min-height:3rem}
.opt:hover{border-color:var(--pink-mid)}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.timer{font-size:2rem;font-weight:800;color:var(--pink-deep);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.searchhit{background:var(--gold-soft)}
.mut{color:var(--ink2)} .sm{font-size:.86rem}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
ul.tight{margin:.3rem 0 .3rem 1.1rem;padding:0}
ul.tight li{margin:.28rem 0}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.checkrow .st{flex:0 0 auto}
.secthead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pill-nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill-nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;min-height:2.4rem}
.pill-nav button.on{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:700}
@media print{#sidebar,#topbar,#savebar,#toast,details.card{display:none!important}#main{padding:0}body,#main,.card,.stat{background:#fff!important;color:#000!important}.bar{background:#fff!important;border:1px solid #000}.bar i{background:#000!important}.tblwrap{overflow:visible!important}table{max-width:100%!important}td,th{overflow-wrap:break-word}}
.card p,.card li,.card td,.card th,.chain,.en{overflow-wrap:break-word;word-break:break-word}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>
<div id="app">
  <nav id="sidebar" aria-label="主导航"></nav>
  <div id="scrim"></div>
  <main id="main" tabindex="-1">
    <div id="topbar">
      <button id="menubtn" class="btn ghost sm" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">☰ 菜单</button>
      <b style="color:var(--pink-deep)">Elite Economist System</b>
      <span class="sm mut">WEC14/01 · U4</span>
    </div>
    <div id="view"><p class="mut">正在加载…</p></div>
    <footer><p class="sm mut">内容最后核对：2026-11-14（官方 Mark Scheme 核对报告） · 数据版本 v1 · 建议每周导出 JSON 备份（设置页 → 导出 JSON 备份）</p></footer>
  </main>
</div>
<div id="idbbanner" role="alert" hidden><b>⚠ 本机数据库不可用；数据仅本次有效——仅保存在本次打开期间，关闭/刷新可能丢失。请立即导出 JSON 备份。</b><div class="btnrow"><button class="btn sm" id="idb-goto-export">去设置导出备份</button><button class="btn sm ghost" id="idb-goto-import">去设置导入</button><button class="btn sm ghost" id="idb-retry">重试连接数据库</button></div></div>
<div id="savebar">数据：<b id="savestate">正在连接本机数据库…</b></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================= 工具函数 ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arrows=s=>esc(s).replace(/→/g,'<b>→</b>');
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600);}
function copyText(txt,okMsg){
  const done=()=>toast(okMsg||"已复制，去聊天里粘贴给 Viaana 吧");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("复制失败，请长按手动复制");}document.body.removeChild(ta);}

/* ================= 用户数据（IndexedDB，与内容数据分离） ================= */
const DBNAME="elite-economist-u4", STORE="userdata";
function defaultU(){return{favs:{},notes:{},mastery:{},masteryTs:{},mistakes:[],mcqLog:[],essayLog:[],settings:{theme:"dark",examDate:"",fontSize:100},planner:{},strategySeen:false,dimMastery:{},tags:{},examList:[],mockHistory:[],drProg:{},drafts:{},mock:{},selfeval:{},eliteLog:[]};}
function sanitizeUser(rec){ const out=defaultU(); if(!rec||typeof rec!=="object")return out; const isO=x=>typeof x==="object"&&x!==null&&!Array.isArray(x); ["favs","notes","mastery","masteryTs","planner","dimMastery","tags","drProg","drafts","mock","selfeval"].forEach(k=>{if(isO(rec[k]))out[k]=rec[k];}); ["mistakes","mcqLog","essayLog","examList","mockHistory","eliteLog"].forEach(k=>{if(Array.isArray(rec[k]))out[k]=rec[k];}); if(isO(rec.settings))out.settings=Object.assign({theme:"dark",examDate:"",fontSize:100},rec.settings); if(typeof rec.strategySeen==="boolean")out.strategySeen=rec.strategySeen; Object.keys(rec).forEach(k=>{if(!(k in out))out[k]=rec[k];}); return out; }
let U=defaultU();
let dbOK=false;
const IDB_WARN="本机数据库不可用；数据仅本次有效——仅保存在本次打开期间，关闭/刷新可能丢失。请立即导出 JSON 备份。";
function idbOpen(){if(typeof indexedDB==="undefined")return Promise.reject(new Error("IndexedDB 不可用"));return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
let db=null, saveTimer=null, savePending=false, saveSeq=0, lastSaveAt=null;
async function loadUser(){
  try{db=await idbOpen();dbOK=true;
    const rec=await new Promise((res,rej)=>{const tx=db.transaction(STORE,"readonly").objectStore(STORE).get("state");tx.onsuccess=()=>res(tx.result);tx.onerror=()=>rej(tx.error);});
    if(rec&&typeof rec==="object"){U=sanitizeUser(rec);}
    hideIdbWarning();
    setSave("已连接本机数据库（IndexedDB）");
  }catch(e){db=null;dbOK=false;setSaveFail(IDB_WARN);}
  applyTheme();
}
function setSave(txt){const el=$("#savestate");if(el)el.textContent=txt;}
/* P0-C：IndexedDB 失败的持久警告横幅（不是 toast，不会自动消失）。 */
function showIdbWarning(){const b=$("#idbbanner");if(b)b.hidden=false;const sb=$("#savebar");if(sb)sb.classList.add("fail");}
function hideIdbWarning(){const b=$("#idbbanner");if(b)b.hidden=true;const sb=$("#savebar");if(sb)sb.classList.remove("fail");}
function setSaveFail(txt){setSave(txt);showIdbWarning();}
async function retryIdb(){
  const btn=$("#idb-retry");if(btn)btn.disabled=true;
  try{
    db=await idbOpen();dbOK=true;
    hideIdbWarning();
    setSave("已连接本机数据库（IndexedDB）");
    doWrite();
  }catch(e){db=null;dbOK=false;setSaveFail("保存失败，请到「设置」导出 JSON 备份");}
  finally{if(btn)btn.disabled=false;}
}
function bindIdbBanner(){
  const ex=$("#idb-goto-export"),im=$("#idb-goto-import"),rt=$("#idb-retry");
  if(ex)ex.addEventListener("click",()=>{go("settings");setTimeout(()=>{const b=$("#sexport");if(b){b.scrollIntoView({block:"center"});if(b.focus)b.focus();}},80);});
  if(im)im.addEventListener("click",()=>{go("settings");setTimeout(()=>{const f=$("#simport");if(f)f.click();},80);});
  if(rt)rt.addEventListener("click",()=>{retryIdb();});
}
function doWrite(){
  clearTimeout(saveTimer);saveTimer=null;
  if(!db){savePending=true;setSaveFail("保存失败，请到「设置」导出 JSON 备份");return;}
  const v=saveSeq;
  try{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(JSON.parse(JSON.stringify(U)),"state");
    tx.oncomplete=()=>{if(v===saveSeq){savePending=false;lastSaveAt=Date.now();hideIdbWarning();setSave("已自动保存 · "+new Date().toLocaleTimeString("zh-CN",{hour12:false}));}else{doWrite();}};
    tx.onerror=()=>{savePending=true;setSaveFail("保存失败，请到「设置」导出 JSON 备份");};
  }catch(e){savePending=true;setSaveFail("保存失败，请到「设置」导出 JSON 备份");}
}
function saveUser(){
  saveSeq++;
  savePending=true;
  setSave("有未保存的修改（保存中…）");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saveTimer=null;doWrite();},250);
}
function flushSave(){
  clearTimeout(saveTimer);saveTimer=null;
  if(savePending)doWrite();
}
window.addEventListener("pagehide",()=>{mockPersistSync();flushSave();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){mockPersistSync();flushSave();}else mockRecheck();});
function applyTheme(){
  const t=U.settings.theme||"dark";
  const dark=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(dark)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");
  document.documentElement.style.fontSize=(U.settings.fontSize||100)+"%";
}

/* ================= 经济学图表（内嵌 SVG，含标注） ================= */
let svgUid=0;
function svgWrap(inner,label){svgUid++;const tid="svg-title-"+svgUid,did="svg-desc-"+svgUid;return '<svg viewBox="0 0 340 250" style="width:100%;max-width:430px;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px" role="img" aria-labelledby="'+tid+' '+did+'"><title id="'+tid+'">'+esc(label)+'</title><desc id="'+did+'">'+esc(label)+'</desc>'+inner+'</svg>';}
const AX='<line x1="45" y1="15" x2="45" y2="215" stroke="var(--ink2)" stroke-width="1.5"/><line x1="45" y1="215" x2="325" y2="215" stroke="var(--ink2)" stroke-width="1.5"/>';
const DIAGRAMS={
ppc:{name:"生产可能性边界 (Production Possibility Curve, PPC)",draw(){return svgWrap(AX+
 '<path d="M60 35 Q 200 60 300 190" fill="none" stroke="var(--pink)" stroke-width="2.5"/>'+
 '<circle cx="215" cy="98" r="4" fill="var(--mint)"/><text x="222" y="94" font-size="12" fill="var(--ink)">贸易后消费点</text>'+
 '<circle cx="180" cy="112" r="4" fill="var(--ink2)"/><text x="120" y="130" font-size="12" fill="var(--ink2)">贸易前消费点</text>'+
 '<text x="8" y="30" font-size="12" fill="var(--ink)">资本品</text><text x="255" y="235" font-size="12" fill="var(--ink)">消费品</text>',"PPC 图：专业化后消费点位于 PPC 之外");},

{id:"kp21b",theme:1,ch:"Ch.21",zh:"全球化（globalisation）的成因",en:"Factors contributing to globalisation",st:"full",
 defEn:"The drivers of globalisation are the forces that lower the cost of trading across borders and open economies to the world market.",
 defZh:"全球化的成因 (factors contributing to globalisation) 是降低跨境交易成本（cross-border transaction cost）、使各国经济向世界市场（world market）开放的力量。官方考纲 (s1-2) 明列五项：运输成本下降、通讯成本下降、贸易自由化（trade liberalisation）、贸易集团（trading bloc）、跨国公司（MNCs）；政治开放（前计划经济（planned economy）国家开放、市场化改革（market-oriented reform））是重要的制度背景，为上述因素创造条件，但不能替代考纲明列的跨国公司这一项。",
 principle:"每一个成因都通过同一机制起作用：降低跨境交易成本 → 企业全球采购与布局变得有利可图 → 贸易、FDI 与一体化（integration）上升。",
 causes:"(1) 运输成本下降：集装箱化（containerisation） 使海运成本骤降；(2) 通讯成本下降：互联网、移动技术、电子支付使跨国协调与交易成本（transaction cost）下降；(3) 贸易自由化 (trade liberalisation)：GATT/WTO 多轮谈判削减关税（tariff）与壁垒；(4) 贸易集团扩大：区域一体化（regional integration）加深 → 贸易创造（trade creation）；(5) 跨国公司 (MNCs) 与 FDI 扩张：跨国公司是跨国化生产与 FDI 的重要推动者与载体——通过建立跨国生产网络（transnational production network）、扩大企业内贸易（intra-firm trade）、技术转移（technology transfer）与管理经验、扩大 FDI，把生产环节配置到不同国家，直接推动贸易与一体化加深。另：政治开放（冷战结束、前计划经济国家如中国、东欧开放、加入 WTO）是制度背景，它降低了跨国经营的制度壁垒、为跨国公司进入新市场创造条件，但与跨国公司是不同类别的因素，不能互相替代。",
 mechanism:"成本下降使「在本国生产全部环节」不再最优：企业按比较优势（comparative advantage）把环节配置到不同国家，跨国公司通过 FDI 与跨国生产网络主动组织这种配置（设立海外子公司、开展企业内贸易、转移技术），与全球供应链（supply chain）扩张一起进一步压低价格、扩大贸易量（trade volume），形成自我强化的循环。跨国公司在这里不只是结果，更是推动全球化的行为主体；政治开放则是让这种跨国布局得以发生的制度前提，两者不能混为一谈。",
 chain:"集装箱化+互联网+WTO 削减壁垒+跨国公司 FDI 与跨国生产网络扩张（政治开放为制度背景，如中国等经济体开放） → 跨境交易成本大幅↓ → 企业全球采购、FDI↑ → 贸易与产出全球分工 → 全球化加速",
 diagram:"tariff",diagramNote:"贸易自由化可用关税图反向理解：关税削减使价格由 Pw+T 回落至 Pw，进口量扩大、贸易创造出现。",
 caseTxt:"集装箱运输量 1980 年 1 亿吨 → 2020 年 20 亿吨；WTO 成立（1995）后多边壁垒下降；中国 1978 年后开放、2001 年加入 WTO 是政治变化类成因的标准例子。",
 essayUse:"202201-8 只写 2 个因素写深：每个因素走「成本下降 → 企业行为改变 → 贸易/FDI 上升 → 一体化加深」多环节链，并点名国家（中国、东欧）。",
 drUse:"材料题给某国开放或基建数据时，先归类到考纲五项成因（运输、通讯、贸易自由化、贸易集团、跨国公司）中的哪一类，再展开机制；政治开放只作制度背景，不要脱离材料自创成因。",
 mcqTrap:"易错：跨国公司 (MNCs) 是考纲 s1-2 明列的成因，写它不会离题；但要写清机制（FDI、跨国生产网络、企业内贸易、技术转移），只写「跨国公司变多了」会被判为只写结果。另注意：政治开放是制度背景，不能用它替代考纲明列的跨国公司这一项。",
 confusion:"易混：贸易自由化（政策降低壁垒）≠ 贸易量增长（结果）；成因题只写结果类表述会被判离题。",
 lose:"失分点：只罗列因素不展开链条 = Level 1；评价只列点不排序不判断 = 评价 Level 1。官方评价角度：运输成本最重要（集装箱量 20 倍）；多哈回合（Doha Round）失败、2008 金融危机、贸易战（trade war）、英国脱欧、疫情供应链中断 → 慢全球化（slowbalisation）。",
 qs:["202201-8"],spec:"Specification 主题 1 · 1.2 推动全球化的因素"},
{id:"kp21c",theme:1,ch:"Ch.21",zh:"去全球化与慢全球化（deglobalisation；slowbalisation；评价）",en:"Deglobalisation and slowbalisation — evaluation",st:"full",
 defEn:"Slowbalisation is the slowing of the pace of global integration; deglobalisation is its reversal, e.g. through rising protectionism, trade wars and countries leaving trading blocs.",
 defZh:"慢全球化 (slowbalisation) 指一体化（integration）速度放缓；去全球化 (deglobalisation) 指一体化逆转，如保护主义（protectionism）上升、贸易战（trade war）、退出贸易集团（trading bloc）。",
 principle:"全球化（globalisation）不是单调上升的过程：外部冲击（external shock）与政策逆转可以使交易成本（transaction cost）重新上升、一体化停滞甚至倒退——这是 Essay 评价的高频角度。",
 causes:"多哈回合（Doha Round；2001 年启动）未能进一步削减壁垒、WTO 对非关税壁垒（non-tariff barrier）乏力；2008 全球金融危机；中美贸易战；英国脱欧及 Grexit/Italeave 讨论；2020 疫情供应链（supply chain）中断与劳动力短缺。",
 mechanism:"壁垒或冲击 ↑ → 跨境成本 ↑、不确定性 ↑ → 企业缩短供应链、回流（reshoring）或近岸布局 → 贸易与 FDI 增速下降。",
 chain:"贸易战/疫情冲击 → 供应链中断、关税（tariff）↑ → 企业近岸化（near-shoring） 与回流 (reshoring) → 贸易增速↓ → 一体化放缓",
 diagram:"",diagramNote:"",
 caseTxt:"英国退出欧盟是「国家退出贸易集团」的官方评价例子；疫情期间供应链中断在 202201-8 的官方评价中被列为「重要性随时间改变」的证据。",
 essayUse:"任何全球化 Essay 的评价段都可用：先排序主因，再用慢全球化证据说明「全球化并非不可逆」，最后给有条件判断。",
 drUse:"材料出现关税上调、供应链转移数据时，用本点解释其对一体化方向的含义，注意区分短期冲击与长期趋势。",
 mcqTrap:"易错：把一年的贸易下降直接等同于去全球化——需看趋势与结构性因素，短期波动不等于逆转。",
 confusion:"易混：慢全球化（增速放缓）≠ 去全球化（水平下降）；保护主义（政策）是去全球化的成因之一，不是同义词。",
 lose:"失分点：评价段只写「也有坏处」式罗列；官方要求：排序 (prioritisation) + 时间维度（短/长期）+ 幅度 (magnitude) + 有依据的判断（informed judgement）。",

{id:"kp22a",theme:1,ch:"Ch.22",zh:"全球化（globalisation）的收益",en:"Benefits of globalisation",st:"full",
 defEn:"The benefits of globalisation arise mainly from comparative advantage: specialisation and trade raise world output, lower prices and increase choice, while competition and technology transfer raise efficiency.",
 defZh:"全球化的收益 (benefits of globalisation) 主要来自比较优势（comparative advantage）：专业化（specialisation）与贸易提高世界产出、压低价格、增加选择；竞争与技术转移（technology transfer）提高效率。以下五点为官方评分要点。",
 principle:"五大收益（官方 Mark Scheme 核对）：(1) 比较优势 → 专业化 → 世界产出↑、生活水平（living standard）↑；(2) 消费者：价格↓、选择↑ → 消费者剩余（consumer surplus）↑、配置效率（allocative efficiency）↑；(3) 企业：市场扩大 → 规模经济（economies of scale）、收入与利润↑；(4) 技术转移与管理技术扩散（technology diffusion）；竞争加剧 → 生产效率↑（productive efficiency；X-低效率（X-inefficiency）下降）；(5) 政府税收（taxation）↑ → 公共服务（public service）支出↑；欠发达国家（less developed country）实际 GDP（real GDP）↑ → 绝对贫困↓（absolute poverty；取决于增长质量与分配）；劳动力迁移（labour migration）缩小地区差距（如东欧工人西迁）。",
 causes:"收益的来源是交易成本（transaction cost）下降后比较优势得以实现（见 kp21b、kp23a）。",
 mechanism:"每个主体的收益链：消费者——进口竞争压价；企业——市场规模突破本国需求上限后沿 LRAC 下行；政府——利润与收入扩大税基；欠发达国家——出口部门与 FDI 带来就业、收入与技术。",
 chain:"比较优势实现 → 专业化+贸易 → 世界产出↑ → 价格↓、选择↑、企业规模经济、技术转移 → 收入与税收↑ → 欠发达国家绝对贫困↓（取决于增长质量与分配）",
 diagram:"lrac",diagramNote:"企业收益用 LRAC 图：市场扩大使产量沿 LRAC 下行段移动，单位成本（unit cost）下降。消费者收益可用 PPC（消费点移出曲线外）。",
 caseTxt:"官方例子：欧盟内东欧劳动者向西欧迁移缩小地区收入差距；按比较优势出口的欠发达国家实现实际 GDP 增长、绝对贫困下降。",
 essayUse:"202210-9：收益作 KAA、成本作评价（或反之）官方均认可 (KAA can be treated as evaluation and vice versa)；本题要求结合一个自选国家展开，不点名国家会明显削弱应用（是否构成 KAA 封顶以该题官方 Mark Scheme 原文为准，不扩展为所有 Essay 的通用规则）。",
 drUse:"材料给某国出口/FDI/贫困数据时，把数据挂到五大收益链的对应环节上引用，避免只描述数据。",
 mcqTrap:"易错：「涓滴理论（trickle-down theory；trickle-down）」——官方原文指出几乎没有证据表明涓滴效应在实践中有效，不能把它当作无条件收益。",
 confusion:"易混：消费者剩余上升（价格下降）≠ 生产者剩余（producer surplus）上升；进口国消费者得益的同时本国竞争企业可能受损，要分主体写。",
 lose:"失分点：202210-9 阅卷反馈——写「全球化的成因」离题不得分；只列收益点不展开链条停留在 Level 1；没有有依据的判断（informed judgement）则评价封顶低档。",
 qs:["202210-9"],spec:"Specification 主题 1 · 1.3 全球化的影响（收益面）"},
{id:"kp22b",theme:1,ch:"Ch.22",zh:"全球化（globalisation）的成本与净效应判断",en:"Costs of globalisation and the net-effect judgement",st:"full",
 defEn:"The costs of globalisation include over-dependence on imports, labour exploitation, negative externalities, rising inequality and vulnerability to external shocks; whether benefits outweigh costs depends on the country, the time horizon and government policy.",
 defZh:"全球化的成本 (costs of globalisation) 包括：过度依赖（over-dependence）进口、劳动剥削（labour exploitation）、负外部性（negative externality）、不平等加剧、对外部冲击（external shock）的脆弱性（vulnerability）。净效应取决于国家、时间跨度与政府政策。",
 principle:"五大成本（官方 Mark Scheme 核对）：(1) 过度依赖进口 → 经常账户（current account）恶化；(2) 劳动剥削：童工（child labour）与女性劳工、低工资、长工时、安全卫生差；(3) 负外部性：生产与空运/海运的污染、不可再生资源加速消耗，损害后代实现可持续增长的能力；(4) 不平等加剧：发达与欠发达国家（less developed country）之间、以及各国内部；(5) 脆弱性：外部冲击跨境传导、衰退（recession）部门结构性失业（structural unemployment）。",
 causes:"成本的根源：各国劳动与环境标准不同、企业追逐最低成本、收益分配机制缺失、经济相互依存（interdependence）放大冲击传导。",
 mechanism:"成本链示例：企业迁往低标准国家 → 当地劳工被剥削 + 本国衰退行业工人结构性失业；贸易量（trade volume）↑ → 运输排放与资源消耗↑ → 负外部性由社会承担。",
 chain:"成本导向型全球布局 → 劳工标准竞次（labour standard；race to the bottom） + 污染与资源消耗↑ + 进口依赖↑ → 不平等↑、脆弱性↑ → 若无再分配与规制，净福利受损",
 diagram:"lorenz",diagramNote:"不平等成本用洛伦兹曲线（Lorenz curve）/基尼系数（Gini coefficient）表达：全球化后曲线更弯曲 = 国内不平等加剧（官方图表角度之一）。",
 caseTxt:"官方评价素材：中国增长放缓对全球经济的传导（202506A-8）正是「相互依存 → 冲击传导」的现实版：2024 年中国出口 3.6 万亿、进口 2.6 万亿美元，其需求下降直接压低伙伴国增长。",
 essayUse:"净效应判断模板（非机械套用）：先分主体（消费者/企业/劳工/政府/环境）与时间（短/长期）比较，再指出决定条件——是否有再分配（税收（taxation）与转移支付（transfer payment）、再培训（retraining））与环境规制（environmental regulation），最后给有优先级的判断。",
 drUse:"材料题中成本类数据（失业（unemployment）、排放、逆差）要链接到具体成本链，并用材料数字说明幅度 (magnitude)。",
 mcqTrap:"易错：把「经常账户逆差」本身说成全球化的必然结果——它取决于该国在分工中的位置与竞争力，不是全球化的定义性结果。",
 confusion:"易混：全球化导致的不平等有两层——国家之间 (between countries) 与国家内部 (within countries)，官方评分点分开计算，答题要分开写。",
 lose:"失分点：只写成本不比较收益（本题问 outweigh）；判断句没有条件与依据（depends on… 必须落到具体条件）；本题要求结合自选国家，全程不点名国家会削弱应用得分（封顶规则逐题以官方 MS 为准）。",
 qs:["202210-9","202506A-8"],spec:"Specification 主题 1 · 1.3 全球化的影响（成本面与判断）"},
{id:"kp23a",theme:2,ch:"Ch.23",zh:"绝对优势（absolute advantage）、比较优势（comparative advantage）与专业化（specialisation）",en:"Absolute advantage, comparative advantage and specialisation",st:"full",
 defEn:"A country has a comparative advantage in a good if it can produce it at a lower opportunity cost than another country. Countries gain by specialising in goods where they have a comparative advantage and trading for the rest.",
 defZh:"比较优势 (comparative advantage)：一国生产某商品的机会成本（opportunity cost） 低于另一国时，即在该商品上拥有比较优势。绝对优势 (absolute advantage) 指用更少要素投入生产同一商品。各国按比较优势专业化 (specialisation) 并进行贸易，双方消费都能超出各自的 PPC。",
 principle:"机会成本 = 生产 1 单位 B 所放弃的 A 的数量。专业化方向由机会成本低者决定，与绝对效率高低无关——这是全章最核心、也最常考错的一点。",
 causes:"比较优势的来源：要素禀赋（factor endowment）、气候、技术、劳动生产率（labour productivity）与技能结构不同（如英国、美国在服务业）。",
 mechanism:"各国把资源集中到机会成本最低的产品 → 世界总产出↑ → 按介于两国机会成本比率之间的贸易条件（terms of trade）交换 → 两国消费点都移到 PPC 之外。",
 chain:"机会成本不同 → 各自专业化于低机会成本产品 → 世界产出↑ → 交换后两国消费超出各自 PPC → 生活水平（living standard）↑",
 diagram:"ppc",diagramNote:"考试画法：两国各自 PPC + 专业化生产点 + 贸易后消费点（在 PPC 之外）。或用数值表算机会成本比率。贸易条件必须落在两国机会成本比率之间，双方才都有利。",
 caseTxt:"官方题干：英国与美国服务业（service sector）占 GDP 比重远高于意大利与加拿大——202110-9 即以发达国家（developed country）服务业专业化为情境。",
 essayUse:"202110-9 的第一段：定义 + 数值或图示比较优势 → 消费超出 PPC，这是 L4 KAA 要求「examples fully integrated」的标准开局。",
 drUse:"材料给两国产量/成本数据时，先算机会成本再判断专业化方向，不要凭「产量大」判断优势。",
 mcqTrap:"高频陷阱：产量更高（绝对优势）≠ 应该出口；判断出口方向只看机会成本。另一陷阱：贸易条件落在机会成本比率区间之外时，一方无利可图、不会自愿贸易。",
 confusion:"易混：比较优势看机会成本（相对概念），绝对优势看单位投入产出（绝对概念）；一国可以在所有产品上都有绝对优势，但不可能在所有产品上都有比较优势。",
 lose:"失分点：只背定义不做数值/图示推导；专业化段落不接贸易收益（产出、价格、就业），链条断裂停留在 Level 2。",
 qs:["202110-9","202401-9","202506-7e"],spec:"Specification 主题 2 · 2.1 比较优势与专业化"},
{id:"kp23b",theme:2,ch:"Ch.23",zh:"贸易收益、模型假设与局限",en:"Gains from trade; assumptions and limitations of the model",st:"full",
 defEn:"The gains from trade include higher world output, economies of scale, lower prices and greater choice; the comparative advantage model assumes no transport costs, perfect mobility of factors and constant costs — assumptions that often fail in reality.",
 defZh:"贸易收益 (gains from trade)：世界产出上升、规模经济（economies of scale）、价格下降、选择增加、贸易平衡与增长改善。模型假设：无运输成本、要素完全流动、无递减收益（成本不变）——现实中常不成立，这正是官方评价清单。",
 principle:"收益链（官方）：专业化（specialisation） → 规模经济 → LRAC↓ → 服务出口价格↓ → 国际竞争力（international competitiveness）↑ → 出口↑ → (X−M) 与 AD↑ → 增长、服务业（service sector）投资与就业↑、生活水平（living standard）↑；配置效率（allocative efficiency）提高还压低全球通胀（inflation）。",
 causes:"收益大小取决于：专业化程度、所专业化行业的需求与价格弹性、贸易条件（terms of trade）落在机会成本（opportunity cost）区间内的位置。",
 mechanism:"局限如何咬人：要素不能完全流动 → 衰退（recession）行业工人面临职业流动性障碍（occupational immobility of labour；occupational immobility） → 结构性失业（structural unemployment）；运输成本存在 → 部分「比较优势（comparative advantage）」被运费吃掉；长供应链/准时制（JIT） 在中断时造成短缺与涨价。",
 chain:"模型假设不成立 → 结构性失业 + 外部冲击（external shock）脆弱性（vulnerability） + 供应链中断风险 + 资源过度开发与运输污染 → 静态收益被动态成本部分抵消",
 diagram:"lrac",diagramNote:"收益面用 LRAC（规模经济）；局限面可用 PPC 说明资源错配，或文字说明贸易条件区间。",
 caseTxt:"官方评价例子：疫情与关键零部件短缺暴露长供应链脆弱性；发达国家（developed country）专业化于服务业后对进口制成品形成过度依赖（over-dependence）、外汇缺口（foreign exchange gap；foreign-currency gap） 风险。",
 essayUse:"202110-9 评价段直接取材本点：模型假设（运输成本、要素流动（factor mobility）、成本不变）+ 脆弱性 + 贸易条件区间 + 结构性失业，四选二写深，并做优先级判断。",
 drUse:"材料出现失业（unemployment）或供应链数据时，用「假设不成立」框架解释，而不是泛泛说「有坏处」。",
 mcqTrap:"易错：把「规模经济」说成比较优势的来源——规模经济是专业化的结果/收益，不是机会成本差异的来源。",
 confusion:"易混：静态收益（一次性产出与价格改善）vs 动态成本（脆弱性、失业调整成本（adjustment cost））；评价时要分开时间维度。",
 lose:"失分点：评价只写「模型不现实」一句不展开后果链；或收益段与局限段重复同一内容。官方要求评价须「recognises different viewpoints + informed judgement」。",
 qs:["202110-9"],spec:"Specification 主题 2 · 2.2 贸易收益与模型局限"},
{id:"kp24a",theme:2,ch:"Ch.24",zh:"贸易格局（pattern of trade）：定义、经验图景与影响因素",en:"Pattern of trade — definition, evidence and influencing factors",st:"full",
 defEn:"The pattern of trade is the composition of exports and imports (what is traded) and their geographical distribution (with whom). It is influenced by comparative advantage, emerging economies, trading blocs, exchange rates, protectionism, competitiveness and FDI.",
 defZh:"贸易格局 (pattern of trade) = 贸易的构成（交易什么）+ 地理分布（与谁交易）。影响因素（官方清单）：比较优势（comparative advantage）、新兴经济体（emerging economy）崛起、贸易集团（trading bloc）与双边协定（bilateral agreement）、汇率（exchange rate）、保护主义（protectionism）、竞争力、FDI、发达国家（developed country）去工业化（industrialisation）。",
 principle:"经验图景（WTO，官方题干）：1995–2022 年发展中经济体（developing economy）出口占世界贸易比重上升、发达经济体（developed economy）比重下降——这是本章的锚点事实。",
 causes:"逐项机制：比较优势随成本与技术变化而移动；中国与东欧开放使制造业（manufacturing sector）向发展中经济体转移；FDI 把产能建到新兴市场；贸易集团与双边协定通过贸易创造（trade creation）改变流向；汇率与「货币战争」（currency war；如中国防止人民币升值（appreciation））改变相对价格；保护主义（关税（tariff）、补贴（subsidy））扭曲流向；美英丧失低成本制造业竞争力、发达国家去工业化 (deindustrialisation)。",
 mechanism:"因素不是并列清单而是相互作用：FDI 流入 → 新兴经济体产能与出口↑ → 发达国家进口↑、转向服务与高技术 → 双边流向与构成同时改变。",
 chain:"新兴经济体开放+FDI 流入+比较优势转移 → 制造业向发展中经济体集中 → 发展中经济体出口份额↑（1995–2022）→ 发达国家去工业化、专业化（specialisation）于服务业（service sector） → 贸易构成与流向重塑",
 diagram:"ppc",diagramNote:"用比较优势数值例或 PPC 位移说明格局变化的方向；配合份额数据（发展中 vs 发达国家出口份额）作应用证据。",
 caseTxt:"官方例子：中国与东欧（前计划经济（planned economy）体）开放；美国、英国低成本制造业流失；中国已签 28 个自贸协定（free-trade agreement）并加入 RCEP（占世界 GDP 约 1/3）改变其贸易流向（202506-7e）。",
 essayUse:"202401-9：选 2 个因素写深（如比较优势 + 新兴经济体/FDI），每个因素都要落到「构成或流向如何变」；结合具体国家展开应用（是否封顶逐题以官方 MS 为准）。",
 drUse:"材料给份额或流向数据时，先判断是哪类因素在驱动（成本/政策/汇率），再用数据幅度支撑。",
 mcqTrap:"易错：把贸易量（trade volume；volume of trade） 与贸易格局 (pattern) 混为一谈——格局问的是构成与流向，不是总量。",
 confusion:"易混：贸易创造（集团内低成本来源替代高成本国内生产，福利↑）vs 贸易转移（trade diversion；高成本成员国来源替代低成本非成员来源，福利↓）——方向判断正好相反。",
 lose:"失分点：阅卷反馈——多数答案只有两环链条，够不到高档；因素罗列不排序、最后不给「组合因素更重要」的判断，评价上不去。",
 qs:["202401-9","202110-8","202506-7e"],spec:"Specification 主题 2 · 2.3 贸易格局及其影响因素"},
{id:"kp24b",theme:2,ch:"Ch.24",zh:"贸易格局（pattern of trade）的评价角度",en:"Evaluating changes in the pattern of trade",st:"full",
 defEn:"Evaluation of trade-pattern changes rests on the unrealistic assumptions of comparative advantage, rising wages and transport costs causing reshoring, exchange-rate volatility, retaliation and the fact that factors act in combination over different time horizons.",
 defZh:"贸易格局评价（官方清单）：比较优势假设不现实（comparative advantage；成本不变、要素完全流动）；中国等国工资与运输成本上升 → 制造业回流（manufacturing sector；reshoring）；汇率（exchange rate）高度波动使格局可逆；保护主义（protectionism）引发报复；国家退出贸易集团（trading bloc）与贸易转移（trade diversion）扭曲格局；因素组合作用、短长期不同、需排序。",
 principle:"评价的核心句式：单一因素很少决定格局——组合 (combination) + 时间 (SR vs LR) + 国家差异 (different economies) 是官方评价的三件套。",
 causes:"格局逆转的触发：工资上涨侵蚀成本优势、运输成本上升、汇率反转、政策报复与集团解体。",
 mechanism:"以回流为例：中国工资↑ → 单位劳动成本（unit labour cost, ULC）优势缩小 → 加上运输成本与供应链（supply chain）风险 → 部分制造业回流发达国家（developed country）或其他发展中国家（developing country） → 格局部分逆转。",
 chain:"成本优势收窄+风险上升 → 企业重新选址 → 回流/近岸化（near-shoring） → 发展中经济体（developing economy）份额增速放缓 → 格局变化趋缓甚至局部逆转",
 diagram:"",diagramNote:"",
 caseTxt:"官方例子：英国等国退出/考虑退出贸易集团；中美贸易摩擦中互相报复性关税（retaliatory tariff）改变双边流向。",
 essayUse:"202401-9 与 202110-8 的评价段：从本点选二（回流 + 汇率波动（exchange rate volatility），或假设批判 + 组合判断），结尾给出「哪一因素对哪类国家最重要」的有条件判断。",
 drUse:"材料题中出现工资、运费、汇率数据时，用本点把「当前格局会持续还是逆转」说清楚。",
 mcqTrap:"易错：认为比较优势是静态的——技术、工资与政策变化都会使比较优势移动，格局随之改变。",
 confusion:"易混：回流 (reshoring，回本国) ≠ 近岸化 (near-shoring，移到邻近国家）；两者都会改变流向但方向不同。",
 lose:"失分点：评价与分析重复（把 KAA 因素换个说法再写一遍）；没有国家差异与时间维度。",

{id:"kp25a",theme:2,ch:"Ch.25",zh:"贸易条件（terms of trade）：定义、公式与计算",en:"Terms of trade — definition, formula and calculation",st:"full",
 defEn:"The terms of trade measure the ratio of export prices to import prices: ToT index = (index of average export prices ÷ index of average import prices) × 100. An improvement means each unit of exports buys more imports.",
 defZh:"贸易条件 (terms of trade) 衡量出口价格相对进口价格的比率：贸易条件指数 =（terms of trade index；出口价格指数 ÷ 进口价格指数）× 100。改善 (improvement) = 每单位出口能换回更多进口；恶化 (worsening/deterioration) 则相反。基年指数 = 100。",
 principle:"计算三步：分别算出口与进口价格指数（基年 = 100）→ 代入公式 → 用百分比变化判断改善/恶化：%Δ =（新 − 旧）÷ 旧 × 100。",
 causes:"变动原因见 kp25b（改善）与 kp25c（恶化）：相对通胀（inflation）、相对生产率（productivity）、相对劳动成本（labour cost）、汇率（exchange rate）、大宗商品（commodity）价格、竞争程度、保护主义（protectionism）。",
 mechanism:"贸易条件是价格比率，不是数量比率：它只告诉你「交换比率」变了，不直接告诉你贸易差额（trade balance）或福利变了——福利还要看数量反应（弹性）。",
 chain:"出口价格相对进口价格↑ → ToT 指数↑ → 单位出口购买力↑ →（purchasing power；福利与差额的最终结果取决于进出口数量对价格的反应）",
 diagram:"adas",diagramNote:"贸易条件变化的宏观后果用 AD/AS 读图（见 kp25d）；公式本身要会手算：如出口价格指数 108、进口价格指数 104 → ToT = 108/104×100 ≈ 103.8，较基年改善约 3.8%。",
 caseTxt:"官方数据：2000–2020 年直布罗陀贸易条件恶化 44.6%、希腊恶化 14.3%（202310-8 题干）；2000–2018 年柬埔寨下降 31.3%（202101-8 题干）。",
 essayUse:"任何贸易条件题第一段：定义 + 公式 + 用题干数字算出方向与幅度，先把 AO1 与应用分拿到。",
 drUse:"Section A/B 计算题高频：给两组价格指数算 ToT 及其百分比变化（如 Oct 2021 Section A 即考「出口价格下降快于进口价格」→ 贸易条件恶化）。",
 mcqTrap:"最大陷阱：通胀较高、生产率较低、劳动成本较高会「改善」贸易条件（算术上出口价格更高）——却同时损害竞争力。算术方向与经济好坏不能混为一谈。",
 confusion:"易混：贸易条件改善 ≠ 贸易差额改善：价格效应与数量效应方向可能相反；若变化来自贬值（depreciation），用马歇尔-勒纳条件（Marshall–Lerner condition）判断数量效应，其他成因要具体分析，不能一概套用。",
 lose:"失分点：只写指数升降不解释含义（单位出口购买力）；计算题不写过程；把 ToT 与汇率 (exchange rate) 当同一概念。",
 qs:["202101-8","202305-7e","202310-8"],spec:"Specification 主题 2 · 2.4 贸易条件：计算"},
{id:"kp25b",theme:2,ch:"Ch.25",zh:"贸易条件（terms of trade）改善的因素",en:"Factors causing an improvement in the terms of trade",st:"full",
 defEn:"The terms of trade improve when export prices rise relative to import prices: higher relative inflation, lower relative productivity, higher relative labour costs, currency appreciation, or a rise in export (e.g. commodity) prices relative to import prices.",
 defZh:"贸易条件改善的因素（官方清单，202305-7e 核对）：(1) 相对通胀率（inflation rate）较高——出口价格涨得比贸易伙伴快；(2) 相对生产率（productivity）较低——单位成本（unit cost）高、出口价格高；(3) 相对劳动成本（labour cost；工资与非工资）较高；(4) 汇率（exchange rate）升值/重估 (appreciation/revaluation)——出口变贵、进口变便宜；(5) 出口品价格上升/进口品价格下降，如大宗商品（commodity）涨价利好净出口国（net exporter）。",
 principle:"统一记忆法：凡是推高出口价格或压低进口价格的因素都改善贸易条件——哪怕它本身是「坏事」（高通胀、低生产率），这是本章的反直觉核心。",
 causes:"按官方材料（东南亚情境）：泰国、新加坡通胀（inflation）上升快于 GDP 增长；图 1 大宗商品价格上涨；菲律宾是食品与燃料净进口国（net importer），进口价格下降才对其有利。",
 mechanism:"以升值为例：本币（domestic currency）升值 → 以外币（foreign currency）计的出口价格↑、以本币计的进口价格↓ → Px/Pm↑ → ToT 改善；但出口数量可能因变贵而下降，收入效应另算。",
 chain:"相对通胀↑（或升值/出口品涨价）→ Px 相对 Pm↑ → ToT↑ → 单位出口换回更多进口 → 实际收入与生活水平（real income；living standard；价格效应）↑",
 diagram:"jcurve",diagramNote:"延伸（仅限贬值情境）：贬值（depreciation）会使贸易条件恶化，数量调整后差额才可能改善——J 曲线（J-curve）与马歇尔-勒纳条件（Marshall–Lerner condition）是「贬值型」贸易条件题的评价搭档；进口价格上涨等其他成因造成的恶化不能套用（主题 3 将系统展开）。",
 caseTxt:"官方情境：东南亚国家中净出口大宗商品者受益于涨价；菲律宾作为食品与燃料净进口国则难以改善——同一冲击、方向相反。",
 essayUse:"202305-7e（14 分，Section B）：只选 2 个因素写深并引用材料（Extract A + Figure 1）；复制材料不作解释 = Level 1。KAA 满分 8、评价满分 6，与 20 分 Essay 的评分结构不同。",
 drUse:"本题就是 Data Response 的 (e) 问：必须「with reference to the information provided」——每个因素都要挂一条材料证据。",
 mcqTrap:"易错：认为生产率提高会改善贸易条件——恰恰相反，生产率↑ → 单位成本↓ → 出口价格↓ → 贸易条件恶化（但竞争力与数量收益可能更好）。",
 confusion:"易混：升值 (appreciation，浮动制下市场升值）vs 重估 (revaluation，固定制下官方上调）——方向相同、制度不同。",
 lose:"失分点：因素罗列超过 3 个且每个只有一环；评价不做排序、不区分净进口/净出口国、不提短期性（大宗商品价格会回落）。",
 qs:["202305-7e"],spec:"Specification 主题 2 · 2.4 贸易条件：改善因素"},
{id:"kp25c",theme:2,ch:"Ch.25",zh:"贸易条件（terms of trade）恶化的因素",en:"Factors causing a deterioration in the terms of trade",st:"full",
 defEn:"The terms of trade worsen when export prices fall relative to import prices: low relative inflation, higher relative productivity, lower relative labour costs, depreciation, higher capital investment raising productivity, commodity price movements against the country, or protectionism raising import prices.",
 defZh:"贸易条件恶化的因素（官方清单，202310-8 核对）——kp25b 的镜像：(1) 相对通胀率（inflation rate）较低；(2) 相对生产率（productivity）较高；(3) 相对劳动成本（labour cost）较低；(4) 汇率（exchange rate）贬值/低估 (depreciation/devaluation)；(5) 资本投资（capital investment）↑ → 生产率↑ → 单位成本（unit cost）↓；(6) 大宗商品（commodity）价格变动不利（净出口国（net exporter）遇价格下跌/净进口国（net importer）遇价格上涨）；(7) 出口市场竞争加剧或进口市场竞争减弱；(8) 保护主义（protectionism）关税（tariff）推高进口价格。",
 principle:"官方硬规则（本题核对清单）：只写 2 个因素、每个都走多环节箭头链；必须点名国家（不点名 KAA 封顶 Level 3 即 9 分）；只写「因素」不写「影响」；评价要对两因素排序并给出有依据的判断（informed judgement）。",
 causes:"选择策略：优先选链条最长、最易点名国家的两个——如「贬值」与「相对生产率上升」，或大宗商品价格（对净出口国）。",
 mechanism:"贬值链：本币（domestic currency）贬值 → 外币（foreign currency）计价的出口价格↓、本币计价的进口价格↑ → Px/Pm↓ → ToT 恶化；同时出口变便宜 → 数量↑（弹性足够时收入与差额反而改善）。生产率链：生产率↑ → 单位成本↓ → 出口价格↓ → ToT 恶化，但数量与竞争力收益上升。",
 chain:"贬值（或生产率↑）→ 出口价格相对进口价格↓ → ToT↓ → 单位出口换回进口减少 → 但出口数量↑可能抵消（取决于需求价格弹性（price elasticity of demand, PED））",
 diagram:"adas",diagramNote:"恶化后的宏观读图见 kp25d（AD 右移 + SRAS 左移）。本题本身重在因素链，不必硬塞图表；公式 ToT=(Px指数/Pm指数)×100 要在定义段出现。",
 caseTxt:"官方题干：直布罗陀 −44.6% 与希腊 −14.3%（2000–2020）——幅度差异本身就是评价的排序证据。",
 essayUse:"202310-8 是 Ch.25 的范文题（见范文库）：两因素深写 + 命名国家 + 评价排序，结构见范文解析。",

 mcqTrap:"易错：把「恶化」直接等同于「对国家不利」——生产率上升导致的恶化伴随数量与收入上升，可能是好事；判断福利必须结合数量效应。",

 lose:"失分点：写 3–4 个因素每个都很浅；不点名国家；评价把 Prebisch–Singer 或弹性当官方评价点堆砌——本题官方评价核心是排序、幅度、持续时间与净进口/出口国差异。",
 qs:["202310-8","202101-8"],spec:"Specification 主题 2 · 2.4 贸易条件：恶化因素"},
{id:"kp25d",theme:2,ch:"Ch.25",zh:"贸易条件（terms of trade）下降的宏观经济效应",en:"Macroeconomic effects of a fall in the terms of trade",st:"full",
 defEn:"A fall in the terms of trade means export prices have fallen relative to import prices (the ToT index falls). It may be caused by lower export prices, higher import prices, or both. Its macroeconomic effects depend on the cause: only where the fall results from a depreciation do export volumes necessarily rise — and only then is the Marshall–Lerner condition the relevant test of whether the trade balance improves.",
 defZh:"贸易条件下降 = 出口价格相对进口价格下降（指数下降）。它可能由出口价格下跌、进口价格上涨或两者共同造成；汇率（exchange rate）贬值（depreciation）只是可能成因之一，不能把贬值与贸易条件恶化当成同一个概念。宏观效应取决于成因：只有贬值造成的恶化才有「出口变便宜 → 数量上升」的传导，此时差额是否改善才由马歇尔-勒纳条件（Marshall–Lerner condition）判断；进口价格冲击或生产率（productivity）上升造成的恶化必须按各自机制分析。",
 principle:"先分清三件事：① 贸易条件是价格比率（Px 指数 ÷ Pm 指数）；② 贬值是汇率变化，只是 ToT 变动的可能原因之一；③ 马歇尔-勒纳条件讨论的是贬值对贸易差额的影响（trade balance；PEDx + PEDm > 1 时贬值改善差额），不是判断一切贸易条件变化后果的通用条件。不能写成「ToT↓ → 出口量↑/进口量↓ → (X−M)↑」的普遍规律——那只在贬值造成恶化、且弹性条件成立时才可能出现。",
 causes:"传导起点取决于成因：贬值型——出口外币（foreign currency）价格↓、进口本币（domestic currency）价格↑；进口价格冲击型（如油价上涨）——进口账单先上升、出口数量未必增加；生产率型——出口价格因单位成本（unit cost）下降而降低，但出口数量与实际收入（real income）同时上升。三种成因的净效应方向不同，必须分开写。",
 mechanism:"以贬值型恶化、且弹性足够为例：AD/AS 双向移动——AD 右移（净出口↑）推高产出与价格；进口投入品变贵使 SRAS 左移，进一步推高价格、抵消产出增益——价格水平（price level）确定上升，产出方向不确定，这是本题最有价值的评价结构。进口价格冲击型则主要是 SRAS 左移与实际收入下降，不要套用同一张图。",
 chain:"分情形：【贬值造成】贬值 → 出口变便宜、进口变贵 → ToT↓；数量调整后若 PEDx＋PEDm＞1 → (X−M)↑ → AD↑ → GDP↑、失业（unemployment）↓ → 税收（taxation）↑、转移支付（transfer payment）↓ → 预算改善；同时进口价格↑ → 成本推动通胀（inflation）↑。【进口价格上涨造成】进口价格↑ → ToT↓ → 进口账单↑、实际收入↓ → 差额与增长未必改善。【生产率上升造成】单位成本↓ → 出口价格↓ → ToT↓，但出口数量与竞争力↑ → 收入可能上升",
 diagram:"adas",diagramNote:"必画：AD 右移 + SRAS 左移的组合图，标注价格水平确定上升、实际产出方向不确定——图本身就是评价。",
 caseTxt:"官方题干：柬埔寨 2000–2018 年贸易条件下降 31.3%——幅度大，评价时可据此论证效应显著。",
 essayUse:"202101-8 问的是「对政府宏观目标的影响」：按目标组织（增长、失业、通胀、预算、经常账户、环境、公平），每个目标一条链，最后用弹性、闲置产能（spare capacity）、乘数（multiplier）大小、持续时间做评价。",
 drUse:"材料题给 ToT 与通胀/增长数据时，用 AD+SRAS 双移框架解释数据组合（如增长与通胀同升）。",
 mcqTrap:"易错：认为 ToT 下降必然恶化经常账户（current account）——官方答案相反：弹性足够时经常账户改善；且经常账户还有初次收入（primary income）与二次收入（secondary income）两部分，可能反向变动。",
 confusion:"易混：贸易条件下降（价格比率）≠ 汇率贬值（货币价格）——贬值是导致 ToT 下降的原因之一，两者不能互相定义。",
 lose:"失分点：只写一个方向的效应（只写增长不写通胀）；把任何贸易条件下降都套上「出口量↑ → 差额改善」的链（只在贬值型且弹性足够时成立）；本题（202101-8）题干明确要求 refer to a country of your choice，不点名国家封顶 Level 3；评价漏掉「取决于恶化成因与 PED」这一官方首要角度。",
 qs:["202101-8"],spec:"Specification 主题 2 · 2.4 贸易条件：变动效应"},
{id:"kp25e",theme:2,ch:"Ch.25",zh:"普雷维什-辛格假说（Prebisch–Singer hypothesis）与长期评价",en:"Prebisch–Singer hypothesis and long-run evaluation",st:"full",
 defEn:"The Prebisch–Singer hypothesis argues that the terms of trade of primary-product exporters tend to decline in the long run relative to manufactures, because demand for primary products is income-inelastic while manufactures benefit from stronger demand and pricing power.",
 defZh:"普雷维什-辛格假说 (Prebisch–Singer hypothesis)：长期看，初级产品（primary product）出口国的贸易条件（terms of trade）趋于下降——初级产品需求收入弹性（income elasticity of demand）低、价格竞争激烈，而制成品需求增长快、厂商有定价权。仅适用于长期、初级产品出口国。",
 principle:"机制：收入↑ 时对食品/原料的需求增长慢于制成品 → 初级产品相对价格长期下行；加上初级产品供给竞争激烈、易被合成替代品取代。",
 causes:"需求面：恩格尔式收入弹性差异；供给面：初级产品生产者众多、进入门槛低；技术面：节约原料的技术进步（technological progress）与替代品。",
 mechanism:"长期后果：初级产品依赖国出口购买力（purchasing power）持续被侵蚀 → 发展融资缺口 → 借债与援助依赖——连接 Ch.25 与主题 6（发展）的桥梁。",
 chain:"初级产品需求收入弹性低 → 相对价格长期↓ → 依赖初级产品出口的发展中国家（developing country） ToT 趋势性恶化 → 购买力与发展融资受损",
 diagram:"",diagramNote:"可用时间序列示意：ToT 指数长期下行趋势线（画图时标注为趋势示意、非某国真实数据）。",
 caseTxt:"官方评价呼应：202305-7e 官方评价明确提到「primary-product-dependent countries may find ToT decrease over time — Prebisch–Singer hypothesis」。",
 essayUse:"只在长期/发展语境中使用本假说；注意 202310-8 的官方评价清单并不以它为核心——用对题目比用高级概念更重要。",
 drUse:"材料给长期价格序列时，用本假说解释趋势并指出反例（大宗商品（commodity）超级周期可阶段性逆转）。",
 mcqTrap:"易错：把假说说成「所有发展中国家 ToT 必然下降」——它针对的是初级产品出口依赖国；制成品出口国（如东亚）不在此列。",
 confusion:"易混：Prebisch–Singer（价格趋势论）vs 马歇尔-勒纳（弹性条件论）——一个讲长期趋势，一个讲数量反应条件，勿混用。",
 lose:"失分点：在短期因素题里硬套长期假说冲淡主线；引用假说不给机制（收入弹性）只给名字。",
 qs:["202305-7e","202310-8","202101-8"],spec:"Specification 主题 2 · 2.4 贸易条件：长期评价"},
{id:"kp21d",theme:1,ch:"Ch.21/22",zh:"跨国公司（multinational company, MNC）与 FDI：原因、东道国（host country）影响与争议",en:"MNCs and FDI — causes, host-country effects, transfer pricing and policy influence",st:"full",
 defEn:"Foreign direct investment (FDI) is investment by a multinational company (MNC) in productive capacity in another country. MNCs invest abroad to access markets, cut costs and secure resources; host countries gain jobs, output and technology but face profit repatriation, transfer pricing and pressure on domestic policy.",
 defZh:"外国直接投资（foreign direct investment, FDI） 是跨国公司 (MNC) 在另一国建立生产能力的投资。企业对外投资为的是进入市场、降低成本、 확보资源；东道国得到就业、产出与技术，但也面临利润汇出（profit repatriation）、转移定价（transfer pricing） 与国内政策受制约的问题。",
 principle:"FDI 的原因分四类：市场寻求（绕过壁垒、贴近消费者）、效率寻求（低劳动成本（labour cost）、规模经济（economies of scale））、资源寻求（原料与能源）、战略资产寻求（品牌、技术、并购）。对东道国的影响必须分主体评估，不能一概而论。",
 causes:"推动因素：东道国市场规模与增长、低单位劳动成本（unit labour cost, ULC）、贸易集团成员身份（trading bloc；可跳板进入整个集团市场）、稳定的政策与基础设施、税收（taxation）优惠竞争。",
 mechanism:"收益链：FDI 流入 → 建厂与就业↑ → 工资收入与消费↑ → 乘数（multiplier）效应；技术与管理外溢 (spillover) → 本地企业生产率（productivity）↑；出口产能↑ → 经常账户（current account）改善。成本链：利润汇回（profit repatriation）母国（home country） → 初次收入（primary income）流出；转移定价把利润记在低税国 → 东道国税收流失；MNC 以撤资（disinvestment）相威胁游说 → 政府在税率、劳工与环境标准上让步（政策竞次）。",
 chain:"FDI 流入 → 就业与产出↑ + 技术外溢 → 增长与出口↑；同时利润汇出 + 转移定价压低税基 + 政策游说 → 净收益取决于东道国的征税与规制能力",
 diagram:"adas",diagramNote:"宏观面用 AD/AS：FDI 是投资 (I) 与长期供给能力的同时扩张——短期 AD 右移，长期 LRAS 右移，两者要分开说。",
 caseTxt:"官方语境：中国与东欧开放后 FDI 大量流入制造业（manufacturing sector），是 202201-8 与 202401-9 的核心应用素材；202310-10 直接考「FDI 流入益处」。",
 essayUse:"全球化（globalisation）与贸易格局（pattern of trade）题的机制段：FDI 是把「潜在比较优势（comparative advantage）」变成「实际出口格局」的通道；评价时用转移定价、利润汇出与政策竞次（race to the bottom）三点。",
 drUse:"材料给 FDI 数据时，先分清流入的动机类型，再分别挂收益链与成本链，不要只写「促进增长」。",
 mcqTrap:"易错：把 FDI 与证券投资（portfolio investment） 混为一谈——FDI 是对生产能力的长期控制性投资；把「利润汇出」说成经常账户的货物/服务项——它属于初次收入 (primary income)。",
 confusion:"易混：转移定价（集团内部人为定价转移利润）≠ 一般的价格歧视；政策影响（discrimination；游说、标准竞次）≠ 东道国「失去主权」的夸张表述，要落到具体的税与规制让步。",
 lose:"失分点：只写收益不写成本（或反之）；把 FDI 的好处停在「带来资金」一环，不展开就业、技术外溢与乘数链。",
 qs:["202310-10","202201-8","202401-9"],spec:"Specification 主题 1 · 跨国公司与 FDI"},
{id:"kp26a",theme:2,ch:"Ch.26",zh:"贸易集团（trading bloc）与双边贸易协定（bilateral trading agreement）",en:"Trading blocs and bilateral trading agreements",st:"full",
 defEn:"A trading bloc is a group of countries that agree to reduce or remove barriers to trade between themselves. A bilateral trading agreement is a similar arrangement between two countries. Membership creates trade between members but may divert trade away from more efficient non-members.",
 defZh:"贸易集团 (trading bloc) 是一组相互削减或取消贸易壁垒（trade barrier）的国家；双边贸易协定 (bilateral trading agreement) 是两国之间的同类安排。成员身份在成员间创造贸易 (trade creation)，但也可能把贸易从更有效率的非成员那里转移走 (trade diversion)。",
 principle:"净福利 = 贸易创造（trade creation；福利↑）− 贸易转移（trade diversion；福利↓）+ 动态收益（dynamic gains；规模经济、竞争、投资）− 调整成本（adjustment cost），方向不能预设，必须结合该集团的成本结构与一体化（integration）深度判断。",
 causes:"国家加入集团的动机：扩大市场、获得规模经济（economies of scale）、提高谈判地位、锁定改革、区域政治与安全合作。",
 mechanism:"壁垒取消 → 成员间相对价格下降 → 消费者转向成员国低成本来源（创造）或被迫转向成员国高成本来源（转移）；企业面对更大市场 → 产量↑、沿 LRAC 下行；竞争加剧 → X-低效率（X-inefficiency）↓；同时对非成员形成歧视（discrimination），引发集团间摩擦与「意大利面碗」式的规则重叠（双边协定过多时）。",
 chain:"加入集团 → 内部壁垒↓ → 贸易创造（+）与贸易转移（−）同时发生 → 企业规模经济与竞争↑ → GDP 与消费者剩余（consumer surplus）方向取决于创造与转移的相对大小",
 diagram:"tariff",diagramNote:"用关税（tariff）图读集团效应：对成员取消关税相当于价格由 Pw+T 回落至 Pw（创造）；但若成员国成本高于世界最低成本，进口来源从世界价格（world price）线转向更高的成员国供给，即转移。判读时先问：成员国是不是低成本生产者？",
 caseTxt:"官方例子：欧盟与南方共同市场（common market；Mercosur） 的贸易协定（trade agreement；202106-7e）；中国已签 28 个自贸协定（free-trade agreement）并加入 RCEP（202506-7e）；英国退出欧盟是「退出集团」的评价例子。",
 essayUse:"202301-8（加入贸易集团益处）：KAA 用贸易创造、规模经济、消费者剩余、谈判权重；评价用贸易转移、相互依存（interdependence）、地理距离差异（官方清单口径）。",
 drUse:"材料给集团内/集团外贸易份额变化时，用创造 vs 转移框架分类，再判断净方向。",
 mcqTrap:"易错：认为加入集团必然增加福利——若转移大于创造，净福利下降；认为双边协定（bilateral agreement）与多边自由化（multilateral liberalisation）等价——双边协定对非成员有歧视性。",
 confusion:"易混：贸易创造（转向低成本来源，福利↑）vs 贸易转移（转向高成本成员来源，福利↓）——先判断来源成本再下结论，方向不要写反。",
 lose:"失分点：只写创造不写转移；不点名具体集团/国家；把「贸易量（trade volume）增加」直接等同于「福利增加」。",
 qs:["202301-8","202106-7e","202506-7e"],spec:"Specification 主题 2 · 2.5 贸易集团与双边协定"},
{id:"kp26b",theme:2,ch:"Ch.26",zh:"经济一体化（economic integration）类型",en:"Types of economic integration",st:"full",
 defEn:"Economic integration deepens in stages: a preferential trade agreement (PTA) gives selected reductions in barriers; a free trade area (FTA) removes internal barriers but members keep their own external tariffs; a customs union adds a common external tariff; a common (single) market adds free movement of labour and capital; economic and monetary union adds a single currency and harmonised policies.",
 defZh:"经济一体化 (economic integration) 分阶段加深：优惠贸易协定（preferential trade agreement, PTA） 只给部分壁垒削减；自由贸易区（free-trade area；FTA） 取消内部壁垒但各成员保留各自的对外关税（external tariff）；关税同盟（customs union） 再加共同对外关税（common external tariff）；共同/单一市场（common/single market） 再加劳动力与资本自由流动；经济与货币联盟（economic and monetary union） 再加单一货币与政策协调。",
 principle:"每加深一级：一体化收益（integration；市场规模、要素配置）上升，但成员让渡的政策自主权也上升——货币联盟（monetary union）成员失去独立货币政策（monetary policy）与汇率（exchange rate）工具，这是成本收益权衡的主线。",
 causes:"一体化加深的驱动：企业对统一规则与大市场的需求、成员国锁定改革的政治意愿、地缘与安全考虑。",
 mechanism:"FTA 的特有问题：对外关税不同 → 第三国商品从低关税（tariff）成员转口进入（贸易偏转（trade deflection）），需原产地规则（rules of origin） 防堵，增加行政成本（administrative cost）；关税同盟用共同对外关税消除此问题，但成员失去单独签约的自由。单一市场再消除非关税壁垒（non-tariff barrier）与要素流动（factor mobility）障碍；货币联盟消除汇率波动（exchange rate volatility）与兑换成本，但成员在衰退（recession）时不能贬值（depreciation）、不能独立降息（一刀切政策问题）。",
 chain:"一体化加深 → 内部交易成本（transaction cost）与价格差异↓、要素流动↑ → 配置效率（allocative efficiency）与规模经济（economies of scale）↑；同时政策自主权逐级让渡 → 货币联盟阶段失去利率（interest rate）与汇率工具 → 对不对称冲击的脆弱性（vulnerability）↑",
 diagram:"",diagramNote:"本点以阶段对照为主，不配图：答题时把题目中的集团先定位到正确阶段（如 RCEP/中国-东盟为 FTA 性质、欧盟为单一市场 + 部分成员的货币联盟），再调用对应成本收益。",
 caseTxt:"官方例子：罗马尼亚加入欧元区（货币联盟）的成本题——转换成本（conversion cost）、失去独立货币政策与贬值能力、《增长与稳定公约（Stability and Growth Pact）》对财政的约束（见范文库对应 VER 条目）。",
 essayUse:"任何贸易集团（trading bloc）题的第一段先给集团定位阶段；货币联盟题必须同时涉及经济联盟（economic union）与货币联盟两个层面，只写一面会封顶（官方口径）。",
 drUse:"材料出现新集团或协定时，先判断它处于哪个一体化阶段，再预测其成本收益构成，不要把 FTA 当成货币联盟分析。",
 mcqTrap:"易错：把 FTA 与关税同盟混为一谈——区别只在「是否有共同对外关税」；把单一市场说成只有商品自由流动——还包括劳动力与资本。",
 confusion:"易混：共同市场（common market；要素可流动）≠ 关税同盟（只有共同对外关税）；货币联盟的「一刀切（one-size-fits-all）」问题是利率不合身，不是汇率问题（成员间已无汇率）。",
 lose:"失分点：阶段定位错误导致整段分析错位；货币联盟题只写贸易收益、不写失去货币政策与贬值能力的成本。",
 qs:["202301-8"],spec:"Specification 主题 2 · 2.5 一体化类型"},
{id:"kp26c",theme:2,ch:"Ch.26",zh:"贸易创造（trade creation）与贸易转移（trade diversion）",en:"Trade creation and trade diversion",st:"full",
 defEn:"Trade creation occurs when joining a bloc shifts consumption from high-cost domestic production to lower-cost member supply, raising welfare. Trade diversion occurs when imports shift from a lower-cost non-member to a higher-cost member because of preferential access, reducing welfare.",
 defZh:"贸易创造 (trade creation)：加入集团后，消费从高成本的国内生产转向低成本的成员国供给，福利上升。贸易转移 (trade diversion)：由于优惠待遇（preferential treatment），进口从低成本的非成员转向高成本的成员，福利下降。",
 principle:"判断口诀：先比较三个价格——国内成本、成员国成本、世界（非成员）最低成本。转向更低成本来源 = 创造；转向更高成本来源 = 转移。集团净效应 = 创造 − 转移。",
 causes:"创造的来源：成员国恰好是低成本生产者 + 内部壁垒完全取消。转移的来源：共同对外关税（common external tariff）/优惠安排使成员国产品在税后价格上胜过更有效率的非成员。",
 mechanism:"创造链：关税（tariff）取消 → 成员低价品进入 → 国内价格（domestic price）↓ → 消费者剩余（consumer surplus）↑ + 高成本国内产能退出（生产端无谓损失（deadweight loss）收回）。转移链：非成员产品被征税、成员产品免税 → 消费者被迫买更贵的成员产品 → 消费者剩余的部分转移变成成员国生产者的收入而非本国关税收入（tariff revenue） → 净福利损失，且全球资源配置被扭曲（resource allocation；违背比较优势（comparative advantage））。",
 chain:"加入集团 → 同一商品出现两个相对价格变化：对低成本成员 → 贸易创造（福利↑）；对高成本成员替代低成本非成员 → 贸易转移（福利↓）→ 净效应取决于两者大小与集团的成本结构",
 diagram:"tariff",diagramNote:"在关税图上叠加两条供给价格：世界价格 Pw（world price；最低）与成员国价格 Pm（Pw < Pm < Pw+T）。取消对成员的关税后价格降至 Pm：相对国内高成本生产是创造；相对原本从世界市场（world market）以 Pw 进口则是转移——同一张图、两个效应，考试要分开标注。",
 caseTxt:"官方口径：202301-8 官方评价明确把贸易转移列为加入集团的首要保留；202106-7e（EU–Mercosur）的评价同样要求讨论转移与对欧盟农民的冲击。",
 essayUse:"集团类 Essay 的标准评价段：创造写 KAA、转移写评价（或反之），最后判断哪一效应在本案例中更大——依据是成员国是否为低成本生产者。",
 drUse:"材料给成员国与非成员的成本/价格数据时，直接算出创造与转移的方向再下笔。",
 mcqTrap:"易错：把「进口增加」当作创造的证据——进口从低成本非成员转到高成本成员同样是进口结构变化，但那是转移；把转移说成对成员国也有害——受损的是进口国消费者与全球效率，成员国出口商反而得益。",
 confusion:"易混：贸易转移（trade diversion，集团语境）≠ 贸易转向/改道（企业为规避关税改走第三国）；前者是福利概念，后者是规避行为。",
 lose:"失分点：只给定义不比较成本高低；把创造与转移的方向写反；净判断不给依据（成员国成本地位）。",
 qs:["202301-8","202106-7e"],spec:"Specification 主题 2 · 2.5 贸易创造与贸易转移"},
{id:"kp27a",theme:2,ch:"Ch.27",zh:"关税（tariff）",en:"Tariffs",st:"full",
 defEn:"A tariff is a tax imposed on imports. It raises the domestic price of the imported good, expanding domestic supply, reducing consumption and imports, generating government revenue, and creating deadweight welfare losses.",
 defZh:"关税 (tariff) 是对进口商品征收的税。它抬高进口品的国内价格（domestic price）：国内供给扩大、消费与进口量缩小、政府获得税收（taxation），但产生无谓福利损失 (deadweight loss)。",
 principle:"福利分解（小国情形）：消费者剩余（consumer surplus）减少 = 生产者剩余增加（producer surplus；转移给国内生产者）+ 政府收入（转移给政府）+ 两个无谓损失三角形（deadweight loss；生产扭曲 + 消费扭曲）。大国情形下关税还可能压低世界价格（world price）、改善本国贸易条件（terms of trade），但会招致报复。",
 causes:"征收关税的理由见 kp27e：保护幼稚产业（infant industry）、就业、收入、战略与反倾销（anti-dumping）等；此处只分析其作用机制。",
 mechanism:"价格由 Pw 升至 Pw+T → 国内产量沿 S 上升、需求量沿 D 下降 → 进口量 = 两价格下的需求与供给差，缩小；进口品变贵还推高国内整体价格水平（price level；通胀（inflation）压力），并使下游产业的投入成本上升。对出口部门的间接伤害：资源被拉向受保护部门 + 贸易伙伴报复 + 本币（domestic currency）可能升值（appreciation），出口竞争力下降。",
 chain:"征收关税 → 进口价格↑ → 国内产量↑、消费↓、进口↓ → 消费者剩余↓、生产者剩余↑、政府收入↑，但无谓损失出现 → 若伙伴报复 → 出口↓、贸易战（trade war）风险↑",
 diagram:"tariff",diagramNote:"必会画：S、D、Pw、Pw+T 四条线与进口量区间；福利四块（生产者剩余增、政府收入、两个无谓损失三角形）要能逐块指出。常见错误：把 Pw 画成斜线；把政府收入矩形画错区间（应在 Pw 与 Pw+T 之间、对应关税后进口量）。",
 caseTxt:"官方语境：美国提高关税的原因（202601-7e）与关税增加的代价（202605A-8）；美国对选定进口品加征关税对全球经济的影响（范文库对应条目）——消费者承担多少取决于进口需求弹性。",
 essayUse:"保护主义（protectionism）题的图与机制核心：先用关税图给出静态福利分解，再用报复、投入成本与大国/小国差异做评价。",
 drUse:"材料给关税税率或进口量变化时，用图上的量格对应计算进口量与政府收入的变化。",
 mcqTrap:"易错：认为关税收入（tariff revenue）是净福利收益——它只是消费者剩余的转移；认为关税一定改善经常账户（current account）——报复与出口受损可使净效应反转。",
 confusion:"易混：关税（对进口征税，政府有收入）vs 配额（quota；限制数量，租金归进口商，除非拍卖许可证）；从价税 (ad valorem) vs 从量税 (specific)。",
 lose:"失分点：图上进口量区间标错；只写「保护国内产业」不做福利分解；漏掉对消费者与下游产业的成本。",
 qs:["202601-7e","202605A-8","202410-8"],spec:"Specification 主题 2 · 2.6 关税"},
{id:"kp27b",theme:2,ch:"Ch.27",zh:"配额（quota）",en:"Quotas",st:"full",
 defEn:"A quota is a physical limit on the quantity of a good that may be imported. It raises the domestic price by restricting supply; unlike a tariff, the scarcity rent normally accrues to whoever holds the import licences (or to foreign exporters under voluntary export restraints), not to the government.",
 defZh:"配额 (quota) 是对进口数量的物理上限。它通过限制供给抬高国内价格（domestic price）；与关税（tariff）不同，其稀缺租金 (quota rent) 通常归持有进口许可证者（自愿出口限制时归外国出口商），不归政府——除非政府拍卖许可证。",
 principle:"配额与等量关税的价格/数量效应相似，福利差别在租金归属与确定性：关税下进口量随需求变化，配额下数量被锁死、价格随需求波动；需求增长时配额的保护程度自动加深。",
 causes:"政府偏好配额的情形：需要确切控制进口数量（如保护衰退（recession）产业、外汇（foreign exchange）短缺时），或关税受 WTO 约束上限限制时转用数量工具。",
 mechanism:"进口量被压到配额上限 → 国内总供给（aggregate supply, AS）左移 → 价格上升 → 国内产量扩大、消费缩小；价格升幅取决于需求弹性。租金 =（国内价格 − 世界价格（world price））× 配额量。配额还削弱竞争：国内企业知道进口不会随降价而增加，涨价压力更大，垄断（monopoly）性定价风险高于关税情形。",
 chain:"设定配额 → 进口量锁死 → 国内价格↑ → 消费者剩余（consumer surplus）↓、国内生产者剩余（producer surplus）↑、租金归许可证持有者 → 需求增长时价格进一步↑、保护自动加深",
 diagram:"tariff",diagramNote:"配额图与关税图共用骨架：差别在分析顺序——先定数量（配额线），再由 S 与 D 的缺口读出价格升幅；标注租金矩形（价格差 × 配额量）而不是政府收入。",
 caseTxt:"官方语境：保护主义（protectionism）影响题（202410-8）的工具箱之一；现实中常与关税配额 (tariff-rate quota) 组合出现：配额内低税、超配额高税。",
 essayUse:"保护主义题中与关税对比写：同为限制进口，配额对数量更确定、对价格更不确定，且租金不归政府——这是现成的评价点。",
 drUse:"材料给进口上限与实际价格时，用租金公式估算租金规模并指出归属。",
 mcqTrap:"易错：说配额给政府带来收入——只有拍卖许可证时才有；说配额下价格固定——固定的是数量，价格随需求浮动。",
 confusion:"易混：配额（进口数量上限）vs 自愿出口限制 VER（voluntary export restraint, VER；出口国「自愿」限量，租金归出口商）；配额 ≠ 关税配额的混合工具要分清两段税率。",
 lose:"失分点：福利分析漏掉租金归属；把配额与关税的确定性关系写反。",
 qs:["202410-8"],spec:"Specification 主题 2 · 2.6 配额"},
{id:"kp27c",theme:2,ch:"Ch.27",zh:"补贴（subsidy）",en:"Subsidies (as protection)",st:"full",
 defEn:"A production subsidy is a payment from government to domestic producers that lowers their costs and shifts supply outwards, allowing them to compete with imports or export at lower prices without raising the consumer price directly — at a fiscal cost to the government.",
 defZh:"生产补贴 (subsidy) 是政府付给国内生产者的款项，降低其成本、使供给曲线右移，让本国产品在不直接抬高消费者价格的情况下与进口竞争或低价出口——代价是政府财政支出。",
 principle:"生产补贴通常降低国内价格（domestic price），不产生关税（tariff）式消费端无谓损失（deadweight loss），但有财政成本与资源错配；在 WTO 规则下出口补贴（export subsidy）受严格限制，且会招致反补贴税（countervailing duty）与报复。",
 causes:"补贴的理由：扶持幼稚产业（infant industry）、保就业与产能、粮食安全、纠正正外部性（positive externality；如研发）；在贸易语境中，发达国家（developed country）农业补贴是最常考的形态。",
 mechanism:"补贴 → 单位成本（unit cost）↓ → S 右移 → 国内产量↑、价格↓或不变 → 进口被替代、出口增加；过剩农产品以低于成本的价格进入世界市场（world market；倾销（dumping））→ 世界价格（world price）被压低 → 无补贴的发展中国家（developing country）生产者无法竞争 → 其农业收入与发展受损。",
 chain:"政府补贴 → 国内供给↑、成本与价格↓ → 进口替代（import substitution） + 出口↑ + 过剩品压低世界价格 → 国内就业保住，但财政成本↑ + 外国（尤其发展中）生产者受损 → 贸易摩擦与报复风险↑",
 diagram:"subsidy",diagramNote:"补贴图：S 右移到 S+补贴，价格下降、产量上升；标注政府成本 = 单位补贴 × 补贴后产量（矩形）。常见错误：移动需求曲线；忘记财政成本。",
 caseTxt:"官方题干：发达国家农业补贴对发展中国家的不利影响（202210-10，官方清单：倾销、贸易转移（trade diversion）、发展中国家无法利用农产品比较优势（comparative advantage）、增长与发展受限）。",
 essayUse:"202210-10 的 KAA 主体：以发展中国家为受影响方展开；评价可用「补贴也可纠正市场失灵（market failure；粮食安全、研发外部性（externality））+ 取决于补贴对象与期限」。",
 drUse:"材料给补贴金额与产量时，估算单位补贴与财政成本，并挂到世界价格传导链上。",
 mcqTrap:"易错：认为补贴像关税一样抬高消费者价格——补贴压低或不改变价格，受损的是纳税人与外国生产者；认为补贴没有无谓损失——生产端仍有资源错配成本，只是形态不同。",
 confusion:"易混：生产补贴（降成本、扩供给）vs 出口补贴（专门针对出口量，WTO 原则上禁止）；补贴（政府支出）vs 关税（政府收入）财政方向相反。",
 lose:"失分点：只站在补贴国写收益，不写对发展中国家与世界价格的传导；漏掉财政成本与机会成本（opportunity cost）。",
 qs:["202210-10"],spec:"Specification 主题 2 · 2.6 补贴"},
{id:"kp27d",theme:2,ch:"Ch.27",zh:"非关税壁垒（non-tariff barrier）",en:"Non-tariff barriers",st:"full",
 defEn:"Non-tariff barriers (NTBs) are restrictions on trade other than tariffs: quotas, embargoes, technical and safety standards, labelling and packaging rules, administrative delays, domestic-content requirements and exchange controls.",
 defZh:"非关税壁垒 (non-tariff barriers, NTBs) 是关税（tariff）之外的贸易限制：配额（quota）、禁运、技术与安全标准、标签与包装规则、行政拖延、国产化率要求、外汇（foreign exchange）管制等。",
 principle:"NTB 的双重性：许多 NTB 有合法目的（健康、安全、环境），但同一工具可被用作变相保护 (disguised protectionism)；判断标准是它是否对进口品构成超出必要限度的歧视（discrimination）性负担。WTO 对 NTB 的约束弱于关税，这是其在现代保护主义（protectionism）中占比上升的原因。",
 causes:"关税在 WTO 框架下被逐轮削减并封顶后，政府转向更难挑战的 NTB；国内产业游说也偏好不透明的壁垒（消费者不易察觉成本）。",
 mechanism:"合规成本↑（检测、改包装、改产线）→ 外国供给成本上升、部分中小出口商退出 → 进口量↓、价格↑，效果类似关税但无政府收入；固定合规成本对小出口商与发展中国家打击最大（developing country；规模不经济）。行政拖延则通过时间成本与不确定性抑制贸易。",
 chain:"设置 NTB → 外国企业合规与时间成本↑ → 部分出口商退出、进口供给↓ → 国内价格（domestic price）↑、竞争↓ → 国内生产者受保护，但消费者与下游企业受损，且壁垒不透明难以谈判削减",
 diagram:"",diagramNote:"NTB 一般不单独画图：需要图时借用关税图的「供给成本上升」逻辑——把 NTB 看作使外国供给曲线上移的成本楔子，并注明无政府收入这一差别。",
 caseTxt:"官方语境：202201-8 官方评价指出 WTO 对非关税壁垒乏力，是自由化不完整的证据；限制自由贸易（free trade）原因题（202201-9）中 NTB 是现代保护的主要形态。",
 essayUse:"全球化（globalisation）/保护主义题的现实感来源：解释为什么关税下降的时代保护并未消失；评价时用「合法目的 vs 变相保护」的区分显示判断力。",
 drUse:"材料出现新标准、新规或清关延误时，先判断其是合法规制还是保护工具，再分析成本传导。",
 mcqTrap:"易错：把所有标准都说成保护主义——有科学依据、国民待遇一致的标准是合法规制；把 NTB 说成有财政收入——NTB 不产生关税收入（tariff revenue）。",
 confusion:"易混：NTB（总称）与配额（NTB 的一种）是属种关系，不要并列重复计算；技术性贸易壁垒（technical barrier to trade, TBT） 与卫生检疫措施 (SPS) 是 NTB 的两个主要子类。",
 lose:"失分点：只列举 NTB 名称不分析成本传导；一律定性为保护主义而漏掉合法规制的一面。",
 qs:["202201-9","202410-8"],spec:"Specification 主题 2 · 2.6 非关税壁垒"},
{id:"kp27e",theme:2,ch:"Ch.27",zh:"保护主义（protectionism）的理由",en:"Reasons for protectionism",st:"full",
 defEn:"Governments justify protectionism on grounds including protecting infant industries, preventing structural unemployment, protecting strategic industries, preventing dumping, correcting a current account deficit, and protecting domestic living standards — each argument has specific conditions under which it is valid and is open to abuse.",
 defZh:"保护主义 (protectionism) 的常见理由：保护幼稚产业（infant industry；infant industries）、防止结构性失业（structural unemployment）、保护战略产业（strategic industry）、反倾销（anti-dumping）、纠正经常账户赤字（current account deficit）、保护国内生活水平（living standard）。每个理由都有其成立条件，也都可能被滥用——考试评价的重点正是条件与滥用。",
 principle:"逐个理由的成立条件：幼稚产业——产业须有潜在比较优势（comparative advantage）且资本市场无法提供耐心融资，保护须限时并递减；就业——只是把失业（unemployment）成本转嫁给消费者与出口部门，长期看再培训（retraining）优于保护；战略产业——限于国防与粮食等真实安全需求；反倾销——须证明低于成本销售且造成损害；经常账户（current account）——保护治标不治本（竞争力与储蓄-投资缺口才是根源）。",
 causes:"政治经济学根源：保护的收益集中于少数生产者（游说动力强），成本分散于全体消费者（反对动力弱）——这解释了为何经济学上低效的保护在政治上常见。",
 mechanism:"保护 → 受保护部门价格与利润↑ → 资源被吸入低效率部门 → 全经济配置效率（allocative efficiency）↓；贸易伙伴报复 → 出口部门受损；消费者（尤其低收入者，因进口品占其支出比重高）实际收入（real income）↓ → 收入分配（income distribution）恶化。",
 chain:"国内产业游说 + 就业/安全诉求 → 政府设置壁垒 → 受保护部门短期受益 → 消费者价格↑、配置效率↓、伙伴报复 → 净福利与生活水平长期受损（除非理由成立且措施限时、递减）",
 diagram:"tariff",diagramNote:"用关税（tariff）图量化任何一条理由的代价：无谓损失（deadweight loss）三角形的大小就是「为这个理由付出的静态成本」，评价时与理由的收益并列权衡。",
 caseTxt:"官方题干：限制自由贸易的原因（free trade；202201-9，官方口径：负面效应作 KAA、正面效应作评价或反之）；美国提高关税的原因（202601-7e）。",
 essayUse:"本题型（reasons 题）结构：每个理由 = 主张 + 成立条件 + 反驳/滥用风险，三段式写深 2 个理由，胜过罗列 5 个名词。",
 drUse:"材料中政府为壁垒辩护时，逐条对照本清单判断其援引的是哪个理由、条件是否成立。",

 confusion:"易混：倾销（dumping；低于成本/低于本国价格销售）≠ 一般的低价竞争（低成本是比较优势，不是倾销）；保护就业（短期、部门性）≠ 提高总就业（长期总就业由宏观因素决定）。",

{id:"kp27f",theme:2,ch:"Ch.27",zh:"世界贸易组织（World Trade Organization, WTO）",en:"The World Trade Organization (WTO)",st:"full",
 defEn:"The World Trade Organization (WTO), founded in 1995 as successor to the GATT, sets and enforces the rules of world trade: it organises negotiation rounds to reduce barriers, applies principles such as non-discrimination (most-favoured nation and national treatment), and operates a dispute settlement system.",
 defZh:"世界贸易组织 (WTO) 成立于 1995 年，前身是关税（tariff）与贸易总协定 (GATT)：它制定并执行世界贸易规则——组织多边谈判回合削减壁垒、推行非歧视原则（discrimination；最惠国待遇 (MFN) 与国民待遇 (national treatment)）、运行争端解决机制。",
 principle:"WTO 的作用边界：它能约束关税与显性歧视，但对非关税壁垒（non-tariff barrier）、补贴（subsidy）与产业政策的约束较弱；谈判采用全体一致原则，成员增多后达成新协议极难（多哈回合 2001 年启动至今未完成）。",
 causes:"WTO 的局限根源：主权让渡意愿有限、发达国家（developed country）与发展中国家（developing country）在农业补贴与知识产权上分歧深、争端解决的上诉机构曾因法官任命受阻而停摆。",
 mechanism:"作用链：多边削减壁垒 → 贸易创造（trade creation）与专业化（specialisation）↑ → 世界产出与生活水平（living standard）↑；争端解决 → 违规成本可预期 → 抑制单边报复螺旋。失效链：谈判停滞 → 各国转向双边/区域协定与单边措施 → 规则碎片化、贸易冲突上升 → 不确定性抑制投资与贸易。",
 chain:"WTO 规则有效时：壁垒多边下降 + 争端可裁决 → 贸易扩张、报复受控；规则失效时：谈判停滞 + 单边关税↑ → 贸易战（trade war）与集团化 → 全球福利受损——同一机构，两种状态取决于成员是否遵守与推进规则",
 diagram:"",diagramNote:"本点不配图；答题用「规则—行为—结果」链代替图示，并用多哈回合（Doha Round）与具体争端作证据。",
 caseTxt:"官方语境：多哈回合失败与 WTO 对非关税壁垒乏力是 202201-8 官方评价的既定点；关税对全球经济影响题的官方评价包含「影响取决于 WTO 的行动」。",
 essayUse:"全球化（globalisation）成因题中 WTO 是贸易自由化（trade liberalisation）的制度载体；评价段用其局限（NTB、多哈停滞、农业分歧）给「自由化持续推进」的叙事加条件。",
 drUse:"材料涉及贸易争端或新协定时，用 WTO 的职能与局限框架定位：这是规则内裁决、双边安排还是单边行动？",
 mcqTrap:"易错：说 WTO 设定商品价格或强制成员实行自由贸易（free trade）——它只提供规则与谈判平台，成员保留大量政策空间；说 WTO 可以处罚成员经济制裁——它只能授权受害方采取报复性措施。",
 confusion:"易混：最惠国待遇（most-favoured-nation treatment, MFN；对所有成员一视同仁）≠ 优惠待遇（preferential treatment；集团内部的优惠恰是 MFN 的例外，靠区域协定条款豁免）；WTO ≠ 世界银行/IMF（World Bank；后两者是金融机构）。",
 lose:"失分点：只背职能清单不谈局限；把 WTO 的争端解决说成自动执行（实际靠成员执行裁决与授权报复）。",
 qs:["202201-9","202201-8"],spec:"Specification 主题 2 · 2.6 WTO"},

 kaa:["全球化（globalisation）的理解/定义","运输成本下降：如集装箱化（containerisation；题干：1 亿吨 → 20 亿吨，+1900%）","贸易自由化（trade liberalisation）：与 WTO 工作相关的贸易壁垒（trade barrier）削减；比较优势（comparative advantage）法则的应用与专业化（specialisation）的联系","贸易集团（trading bloc）数量与规模增加：对贸易创造（trade creation）的应用","通讯成本下降：如互联网、移动技术等使沟通/分享信息变容易；新的电子支付系统","政治变化：先前封闭的经济体向世界市场（world market）开放，如中国 / 前共产主义经济体","阅卷报告：最常见的正确点是运输与通讯成本下降；许多考生写了全球化的「影响」而非「因素」，不得分"],
 eval:["优先级/重要性：如运输成本下降最重要（集装箱量上升 1900%）","贸易自由化：多哈回合（Doha Round；2001 年启动）未能削减壁垒；WTO 对非关税壁垒（non-tariff barrier）成效有限；2008 金融危机等外部冲击（external shock）带来的去全球化（deglobalisation）","贸易集团数量/规模：国家退出集团（如英国与欧盟）与威胁退出（Grexit、Italeave）","政治变化：贸易战（trade war；中美）带来的慢全球化（slowbalisation）","通讯成本：发展中国家（developing country）许多人被排除在外（贫困、文盲、无电脑系统接入）","因素重要性随时间改变：如 2020 全球卫生危机对供应链（supply chain）的 disruption 比其他因素更重要；劳动力短缺 → 商品短缺 → 贸易减少。阅卷报告：评价常做短期 vs 长期；只罗列评价点 = Level 1"],
 chain:"集装箱化/海运变便宜 + 互联网/移动通讯 + 贸易自由化（WTO、GATT 回合）+ 贸易集团 + 政治开放（中国、东欧）→ 跨境贸易成本↓ → 企业全球采购、跨国公司（multinational company, MNC）扩张、FDI↑ → 贸易/GDP↑、一体化（integration）↑ → 全球化↑"},
"202201-9":{en:"In 2020 the European Union imposed retaliatory tariffs of 25% on many US goods in a dispute over aircraft subsidies. Evaluate possible reasons why developed countries might restrict free trade.",core:false,partial:"KAA 完整清单未逐字核全；下列评价点已核对，理由清单为考纲背景（非逐字评分要点）",
 kaa:["阅卷报告：多数考生能识别两个主要理由，最常见的是保护国内产业与减少经常账户赤字（current account deficit）","进入 KAA Level 4 须点名一个自选发达国家（developed country）或欧盟","考纲层面的标准理由（背景，非逐字 MS）：保护幼稚产业（infant industry）；保护夕阳产业（sunset industry）与就业；防倾销（anti-dumping）；保护战略产业（strategic industry；国防、粮食、能源）；报复（本题：欧盟就飞机制补贴争端加征 25% 报复性关税）；纠正经常账户（current account）/贸易逆差（trade deficit）；增加税收（taxation）；防范不公平竞争/低劳工环境标准"],
 eval:["所讨论理由的优先级/重要性","措施的规模：25% 关税（tariff）相对较大，但取决于美国对欧盟产品关税规模/关税适用的商品范围","取决于所用措施：关税 vs 配额（quota） vs 补贴（subsidy） vs 非关税壁垒（non-tariff barrier）","政府难以挑选有潜在比较优势（comparative advantage）的幼稚产业；若产业无法获得规模经济（economies of scale）则浪费资源；并非每个发达国家都适用（多数产业已成熟）","若夕阳产业平均成本显著高于外国生产者，保护无效","保护就业可能无效：扭曲比较优势 → 专业化（specialisation）/贸易减少、GDP 下降 → 总就业反而下降","该部门对该国的战略重要程度","难以判断倾销（dumping）是为挤垮国内产业，还是出口商确有规模经济","对中间品过度征税抬高国内企业成本 → 价格↑、出口比进口降得更快 → 经常账户逆差反而恶化","税收在发达经济体（developed economy）政府收入中占比小（对发展中经济体（developing economy）更重要）；若进口需求价格弹性（price elasticity of demand, PED）大，收入很少","关税未必是最重要的限制——健康/安全与环境规则在发达国家可能更重要"],
 chain:"（示例：报复）美国补贴飞机制造 → 欧盟生产者受损 → 欧盟加征 25% 报复性关税（retaliatory tariff） → 美国商品在欧盟价格↑ → 欧盟消费者转向欧盟商品 → 欧盟生产者剩余（producer surplus）/就业↑、关税收入（tariff revenue）↑ → 但欧盟消费者剩余（consumer surplus）↓、福利损失、美国可能再报复 → 贸易战（trade war） → 世界贸易↓"},
"202210-9":{en:"Between 1970 and 2020 growth in international trade, a key measure of globalisation, increased significantly. Evaluate whether the benefits of globalisation outweigh the costs. Refer to a country of your choice in your answer.",core:true,model:true,partial:"成本清单后段未逐字核全；收益清单已核对。范文中的评价角度已按同系列官方口径标注",
 kaa:["对全球化（globalisation）的理解","比较优势（comparative advantage）法则 → 专业化（specialisation）、贸易、世界产出增加、生活水平（living standard）提高","消费者：价格更低（消费者剩余↑）；选择/品种更多 → 消费者剩余（consumer surplus）↑、配置效率（allocative efficiency）更高","企业：市场更大；规模经济（economies of scale） → 收入/利润更高","技术转移（technology transfer）与新管理技术共享增加","税收（taxation）↑ → 政府在公共服务（public service）上的支出增加","经历更高实际 GDP（real GDP） 的欠发达国家（less developed country）绝对贫困（absolute poverty）减少","劳动力迁移（labour migration）减少地区不平等——如东欧工人迁往西欧工作（欧盟）","竞争加剧 → 企业提高生产效率（productive efficiency；降低生产成本）","顶端收入更高最终会使所有人收入/财富增加（涓滴理论）","注：不点名国家 KAA 最高 Level 3（9 分）；收益作 KAA、成本作评价，或反之，均可得分"],

"202210-10":{en:"In 2020 developed countries that were members of the Organisation for Economic Co-operation and Development (OECD) spent $238 billion on agricultural subsidies. Evaluate the disadvantages of agricultural subsidies paid to farmers in developed countries on developing countries.",core:false,partial:"评价清单后段未逐字核全",

"202301-8":{en:"In February 2021 the UK Government applied to join one of the world's largest free-trade areas, the Comprehensive and Progressive Agreement for Trans-Pacific Partnership (CPTPP). Evaluate the likely economic benefits to a country of joining a trading bloc.",core:false,partial:"评价清单后段未逐字核全",

"202305-7e":{en:"With reference to the information provided and your own knowledge, discuss factors that might cause an improvement in the terms of trade of Southeast Asian countries.",core:true,
 kaa:["贸易条件（terms of trade）的理解/定义","相对通胀率（inflation rate）较高——「泰国与新加坡的通胀率上升快于 GDP 增长率」：若部分东南亚国家通胀（inflation）高于主要贸易伙伴，出口价格相对进口价格上升","出口价格相对进口价格上升——「食品、燃料与大宗商品（commodity）价格上涨」/ 图 1","进口价格相对出口价格下降——「菲律宾依赖大米进口，是食品与燃料的净进口国」（net importer；故此类价格下降会有利）","相对生产率（productivity）较低——若东南亚国家生产率低于贸易伙伴，出口价格相对进口价格上升","相对劳动成本（labour cost；工资与非工资）较高——出口价格相对进口价格上升","汇率（exchange rate）升值（appreciation）/重估——出口价格上升（出口相对变贵）、进口价格下降（进口相对变便宜）"],
 eval:["取决于改善的主要原因 / 对最重要因素的排序","改善可能只是暂时的，如大宗商品价格下跌时（图 1）","不同因素影响不同东南亚国家：净进口国 vs 净出口国（net exporter；图 1）","菲律宾是大宗商品净进口国，因此不太可能经历改善","劳动成本的重要性取决于该国进出口更偏劳动密集还是资本密集型商品/服务","不同因素在不同时期重要性不同；依赖初级产品（primary product）的国家长期可能贸易条件下降——普雷维什-辛格假说（Prebisch–Singer hypothesis）","取决于贸易条件上升持续多久、幅度多大；长期看「价格管制」可能使部分国家出口价格相对进口价格上升缓慢而恶化","很可能是多因素组合，而非单一因素","阅卷报告：少数考生识别出相对高通胀/劳动成本或相对低生产率并整合材料 A——达到 Level 3；照抄材料不解释 = Level 1；评价常做短期 vs 长期与幅度，但链条不完整"],
 chain:"相对通胀↑（泰国/新加坡）→ 出口价格涨得比进口价格快 → ToT = Px/Pm × 100 ↑ → 每单位出口换回更多进口 → 生活水平（living standard） / 经常账户（current account；价格效应）↑ → 但出口价格更高 → 出口量↓（弹性大时）→ 出口收入可能下降；若改善来自大宗商品价格，价格回落即逆转；净进口国（菲律宾）反而受损"},
"202310-8":{en:"Between 2000 and 2020, Gibraltar's terms of trade worsened by 44.6% and Greece's terms of trade worsened by 14.3%. Evaluate factors that might cause a country's terms of trade to worsen.",core:true,model:true,partial:"本题评价清单未逐字核全；范文评价按官方同系列口径（排序/幅度/短长期/净进口出口国）展开并已标注",
 kaa:["对贸易条件（terms of trade）与「恶化」的理解","相对通胀率（inflation rate）低 → 相对出口价格下降","相对生产率（productivity）较高 → 单位成本（unit cost）下降 → 出口价格下降","相对劳动成本（labour cost；工资与非工资）较低 → 单位成本下降 → 出口价格下降","汇率（exchange rate）贬值（depreciation）/低估 → 出口价格下降、进口价格上升","相对资本投资（capital investment）水平较高 → 生产率↑ → 单位成本与出口价格下降","大宗商品（commodity）价格变动，如石油（净出口国遇价格下跌、净进口国遇价格上涨）","一国主要进口市场竞争下降 / 主要出口市场竞争上升","保护主义政策（protectionist policy），如一国对进口品加征关税（tariff）会推高进口价格"],
 eval:["（评价清单未逐字核全——请查官方 MS 原文）同系列官方评价的通常角度：优先级/幅度——直布罗陀 −44.6% vs 希腊 −14.3%；短期 vs 长期；净进口国（net importer） vs 净出口国（net exporter）；多因素组合；初级产品（primary product）出口国的普雷维什-辛格；恶化是否真有害取决于 PED / 马歇尔-勒纳与数量效应"],
 chain:"（202305-7e 的镜像）相对生产率↑ → 单位成本↓ → 出口价格相对进口价格↓ → ToT↓ → 每单位出口换回进口减少 → 但出口更便宜 → 出口量↑ → 若 PED 弹性足够，出口收入与经常账户（current account）反而可能改善（马歇尔-勒纳）→ 增长/就业↑。贬值 → Px（外币（foreign currency）计）↓ 且 Pm↑ → ToT↓，数量抵消同理。大宗商品价格下跌（净出口国，如石油）→ Px↓ → ToT↓ 且出口收入↓"},
"202401-9":{en:"According to the World Trade Organization (WTO), between 1995 and 2022, the share of developing economies' exports in world trade increased and the share of developed economies' exports decreased. Evaluate factors influencing patterns of trade between countries.",core:true,model:true,

 ["AO4 Evaluation","排序（哪个最重要）+ 时间维度（2008 前后）+ 反证（多哈失败、脱欧、疫情）+ 有条件判断，四者缺一不可。"]],
 paras:[
 "Globalisation is the increasing integration and interdependence of national economies into a single international market, with freer movement of goods, services, capital, labour and technology. Over the last 50 years many forces have driven this process, but two stand out: the collapse in the cost of transporting goods, above all containerisation, and trade liberalisation through the GATT/WTO system and the growth of trading blocs. This essay argues that falling transport costs were the most fundamental driver, because they made every other form of integration physically and commercially possible.",
 "The single most powerful factor was the fall in transport costs caused by containerisation. Standardised containers cut the cost of loading, shipping and transferring freight between ships, trains and lorries so sharply that the cost of moving a tonne of goods across an ocean fell to a small fraction of its 1970 level. The stem illustrates the result: total global shipping container volumes rose from 100 million tonnes in 1980 to 2 billion tonnes in 2020, an increase of 1,900%. The chain of causation runs as follows. Lower freight costs reduced the delivered price of foreign goods and components, so it became profitable for firms to source inputs from the lowest-cost location worldwide rather than domestically. This encouraged multinational companies to fragment production into global supply chains and to locate stages of production in countries such as China and Vietnam, generating large flows of foreign direct investment. Rising trade in components and final goods then raised the share of trade in world GDP and deepened the interdependence of national economies — which is precisely what globalisation means. Without cheap container shipping, distant low-wage production could not have served Western markets, so this factor underpins the others.",
 "A second major factor was trade liberalisation. Successive GATT rounds and, after 1995, the WTO reduced tariffs and other barriers, while the number and size of trading blocs grew. Removing a tariff lowers the domestic price of imports from the tariff-inclusive price towards the world price, creating trade: low-cost foreign supply replaces high-cost domestic production, so countries specialise according to comparative advantage and world output rises. Political change amplified this process. China's opening after 1978 and its accession to the WTO in 2001, together with the opening of the former communist economies of Eastern Europe, brought hundreds of millions of low-cost workers into the world trading system, massively expanding both the supply of manufactures and the market for them. Cheaper communication — the internet, mobile technology and electronic payment systems — reinforced these forces by cutting the cost of coordinating production and trade across borders.",
 "Evaluating the relative importance of these factors, the evidence supports ranking transport costs first. A twenty-fold rise in container volumes is a change in physical capability, not merely in policy, and it operated continuously across the whole period. Trade liberalisation, by contrast, was neither continuous nor complete: the Doha Round, launched in 2001, failed to deliver further significant reductions in barriers, and the WTO has been much less successful against non-tariff barriers such as regulations and subsidies. Liberalisation therefore explains the timing of bursts of integration better than its overall scale.",
 "There are also important qualifications to any simple story of ever-deepening globalisation. The process has partly gone into reverse: the global financial crisis of 2008, the US–China trade war, the UK's departure from the EU — with Grexit and Italeave openly discussed — and the supply-chain disruption and labour shortages of the 2020 global health crisis all raised the cost or the risk of cross-border activity, producing what is often called slowbalisation. Nor were the gains from cheaper communication universal: many people in developing countries are excluded by poverty, illiteracy or lack of access to computer systems, so this driver integrated some economies far more than others. The significance of each factor also changes over time — in 2020–21, supply-chain disruption mattered more than any further fall in freight costs.",
 "In conclusion, increased globalisation over the last 50 years was driven above all by the fall in transport costs, which made global production physically viable; trade liberalisation and political opening then multiplied its effects by removing policy barriers and adding huge new workforces, with China the outstanding example. However, the judgement must be qualified: since 2008 the policy drivers have stalled or reversed, so globalisation should be understood as a powerful but reversible process, not an automatic one."],
 chains:"因素一链：集装箱化 → 单位运费骤降 → 全球采购/布局有利可图 → 跨国公司（multinational company, MNC）拆分生产、FDI↑ → 贸易/GDP↑ → 一体化加深。因素二链：WTO/集团削减壁垒 → 进口价格回落至世界价格（world price） → 贸易创造 → 比较优势实现 → 专业化与世界产出↑；中国开放 → 低成本劳动力进入世界体系 → 供给与市场同时扩张。",
 whyEval:"评价有效的原因：(1) 有排序且有证据——用集装箱量 20 倍的「物理能力变化」论证运输居首，而不是空喊重要；(2) 有反证——多哈失败与非关税壁垒说明自由化不完整；(3) 有时间维度——2008 年是政策驱动由正转负的拐点；(4) 有边界——通讯红利的排除效应。这正是官方 Level 3 评价「recognises different viewpoints and is critical of the evidence」的具体形态。",
 whyJudge:"判断有说服力，因为它不是各打五十大板：明确给出第一因素（运输成本）与放大机制（自由化 × 政治开放），同时用 2008 年后的证据给判断加上条件（reversible, not automatic），既回答了「哪些因素」又回答了「多重要、是否持续」。",
 lose:["写全球化的「影响」而不是「因素」——阅卷报告明确指出这类内容整段不得分","因素罗列 4–5 个、每个只有一两环链条，KAA 封顶 Level 2","不点名国家（本题要求 refer to examples of countries）","评价只重复「也有缺点」而不排序、不给判断","不用题干数据（集装箱量）——白白丢掉现成的应用证据"],
 zh:["全球化是各国经济日益融入单一国际市场、相互依存（interdependence）不断加深的过程，伴随着商品、服务、资本、劳动力和技术更自由的流动。过去 50 年有许多力量推动了这一进程，但其中两个最为突出：以集装箱化为代表的货物运输成本的崩塌式下降，以及通过 GATT/WTO 体系和贸易集团扩张实现的贸易自由化。本文认为，运输成本下降是最根本的驱动因素，因为它使其他一切形式的一体化在物理上和商业上成为可能。",
 "最强有力的单一因素是集装箱化带来的运输成本下降。标准化集装箱使装卸、海运以及在船舶、火车和卡车之间转运货物的成本大幅下降，跨洋运输每吨货物的成本降至 1970 年水平的零头。题干数据说明了结果：全球集装箱运输总量从 1980 年的 1 亿吨上升到 2020 年的 20 亿吨，增长了 1900%。因果链条如下：运费下降降低了外国商品和零部件的到岸价格，企业从全球成本最低的地点采购投入品变得有利可图，而不再局限于国内。这促使跨国公司把生产拆分到全球供应链中，把生产环节设在中国、越南等国家，产生大规模的外国直接投资（foreign direct investment, FDI）。零部件和最终产品贸易的上升进而提高了贸易占世界 GDP 的比重，加深了各国经济的相互依存——这正是全球化的含义。没有廉价的集装箱运输，远距离的低工资生产根本无法服务西方市场，因此这一因素是其他因素的基础。",
 "第二个主要因素是贸易自由化。GATT 的历次回合以及 1995 年之后的 WTO 削减了关税（tariff）和其他壁垒，贸易集团的数量和规模也不断扩大。取消关税使进口品的国内价格（domestic price）从含税价格回落到世界价格附近，产生贸易创造：低成本的外国供给替代高成本的国内生产，各国按比较优势专业化，世界产出上升。政治变化放大了这一进程。中国 1978 年后的开放和 2001 年加入 WTO，连同东欧前共产主义经济体的开放，把数以亿计的低成本劳动者带入世界贸易体系，极大地同时扩大了制成品的供给和市场。更廉价的通讯——互联网、移动技术和电子支付系统——通过降低跨境协调生产和贸易的成本，进一步强化了这些力量。",
 "在评价这些因素的相对重要性时，证据支持把运输成本排在第一位。集装箱运输量 20 倍的增长是物理能力的变化，而不仅仅是政策的变化，并且它在整个时期持续发挥作用。相比之下，贸易自由化既不连续也不完整：2001 年启动的多哈回合未能带来进一步的大幅壁垒削减，WTO 对法规、补贴（subsidy）等非关税壁垒的成效要差得多。因此，自由化更能解释一体化在某些时段的爆发，而非其整体规模。",
 "对「全球化不断加深」的简单叙事也有重要限定。这个进程已部分逆转：2008 年全球金融危机、中美贸易战、英国脱离欧盟——Grexit 和 Italeave 也被公开讨论——以及 2020 年全球卫生危机造成的供应链中断和劳动力短缺，都提高了跨境活动的成本或风险，产生了所谓的「慢全球化」。更廉价通讯的收益也不是普惠的：发展中国家的许多人因贫困、文盲或无法接入计算机系统而被排除在外，因此这一驱动因素对一些经济体的一体化作用远大于其他经济体。各因素的重要性也随时间变化——在 2020–21 年，供应链中断比运费的进一步下降更重要。",
 "总之，过去 50 年全球化的加深首要由运输成本下降驱动，它使全球生产在物理上可行；贸易自由化和政治开放随后通过拆除政策壁垒、加入庞大的新劳动力放大了其效果，中国是最突出的例子。但判断必须附带条件：2008 年以来政策驱动因素已经停滞甚至逆转，因此全球化应被理解为一个强大但可逆的过程，而不是自动的过程。"]},
