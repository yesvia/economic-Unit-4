<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Elite Economist System · Edexcel IAL Economics U4 (WEC14/01)</title>
<style>
:root{
  --bg:#FFF6F9; --bg2:#FFFDFE; --surface:#FFFFFF; --surface2:#FDEEF4; --surface3:#E9F9F0;
  --ink:#33182A; --ink2:#6E4A5E; --ink3:#9A7589;
  --pink:#D81B60; --pink-deep:#B3124F; --pink-soft:#FCE4EC; --pink-mid:#F78FB8;
  --mint:#0E9F7E; --mint-deep:#07805F; --mint-soft:#D7F5E7; --mint-mid:#7BDDBE;
  --gold:#B97A0B; --gold-soft:#FDF0D5;
  --red:#C62828; --red-soft:#FDE7E7;
  --line:#F3CFE0; --line2:#D9F0E4;
  --shadow:0 2px 14px rgba(216,27,96,.08);
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{
  --bg:#1C1017; --bg2:#241420; --surface:#2B1A26; --surface2:#38202F; --surface3:#17352A;
  --ink:#FBE9F2; --ink2:#D9AEC4; --ink3:#A97E95;
  --pink:#FF7EB0; --pink-deep:#FF9CC4; --pink-soft:#452233; --pink-mid:#C4507F;
  --mint:#4ADEB4; --mint-deep:#7BEBc9; --mint-soft:#14382C; --mint-mid:#2E7D63;
  --gold:#F2C14E; --gold-soft:#3D2F10;
  --red:#FF8A80; --red-soft:#402022;
  --line:#4A2C3E; --line2:#274A3B;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,[role="button"],select,summary,input:not([type="checkbox"]),textarea{font-family:inherit}
button{min-height:2.25rem;cursor:pointer}
a{color:var(--pink);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:1.55rem;line-height:1.3;margin:0 0 .4rem}
h2{font-size:1.25rem;margin:1.4rem 0 .6rem;line-height:1.35}
h3{font-size:1.05rem;margin:1.1rem 0 .45rem;line-height:1.4}
p{margin:.45rem 0}
small{color:var(--ink2)}
.en{font-family:Georgia,"Times New Roman",serif}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:238px;flex:0 0 238px;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 10px 30px;z-index:40}
#sidebar .brand{padding:4px 8px 10px;border-bottom:2px solid var(--mint-soft);margin-bottom:10px}
#sidebar .brand b{font-size:1.02rem;color:var(--pink-deep);display:block;line-height:1.3}
#sidebar .brand span{font-size:.78rem;color:var(--ink2)}
.navgroup{font-size:.72rem;letter-spacing:.08em;color:var(--ink3);margin:14px 8px 4px;font-weight:700}
.navitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;font-size:.92rem;color:var(--ink);min-height:2.5rem}
.navitem:hover{background:var(--surface2)}
.navitem.active{background:var(--pink-soft);color:var(--pink-deep);font-weight:700}
.navitem .dot{width:8px;height:8px;border-radius:50%;background:var(--mint-mid);flex:0 0 8px}
.navitem.active .dot{background:var(--pink)}
#main{flex:1;min-width:0;padding:20px 22px 90px;max-width:1060px;margin:0 auto;width:100%}
#topbar{display:none}
#savebar{position:fixed;right:14px;bottom:14px;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem;color:var(--ink2);box-shadow:var(--shadow);max-width:calc(100vw - 28px)}
@media (max-width:860px){#savebar{left:14px;right:14px;text-align:center;bottom:10px;font-size:.78rem}}
#savebar b{color:var(--mint-deep)}
@media (max-width:860px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25);width:262px;flex-basis:262px;display:none}
  #sidebar.open{transform:none;display:block}
  #topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line);margin:0 -14px 6px}
  #main{padding:12px 14px 90px}
  #scrim{display:none;position:fixed;inset:0;background:rgba(30,5,20,.4);z-index:35}
  #scrim.on{display:block}
}
/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.card.mint{border-color:var(--line2);background:linear-gradient(180deg,var(--surface),var(--surface3))}
.card.pink{background:linear-gradient(180deg,var(--surface),var(--surface2))}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--pink-soft);color:var(--pink-deep);margin:2px 4px 2px 0;vertical-align:middle}
.tag.mint{background:var(--mint-soft);color:var(--mint-deep)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.grey{background:var(--surface2);color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pink);background:var(--pink);color:#fff;border-radius:10px;padding:8px 14px;font-size:.9rem;font-weight:600;min-height:2.5rem}
.btn.ghost{background:var(--surface);color:var(--pink-deep)}
.btn.mint{background:var(--mint);border-color:var(--mint)}
.btn.mint.ghost{background:var(--surface);color:var(--mint-deep);border-color:var(--mint)}
.btn.sm{padding:5px 11px;font-size:.83rem;min-height:2.25rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
input[type="search"],input[type="text"],input[type="date"],input[type="number"],select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.95rem;min-height:2.6rem}
textarea{width:100%;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{font-size:1.5rem;display:block;color:var(--pink-deep);line-height:1.2}
.stat span{font-size:.83rem;color:var(--ink2)}
.empty{border:1.5px dashed var(--pink-mid);border-radius:var(--radius);padding:18px;background:var(--surface2);color:var(--ink2)}
.chain{background:var(--mint-soft);border-radius:10px;padding:10px 14px;font-size:.93rem;line-height:1.8;color:var(--ink)}
.chain b{color:var(--mint-deep)}
.kv{margin:.3rem 0}
.kv b.t{color:var(--pink-deep)}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
details>summary{padding:11px 14px;font-weight:600;cursor:pointer;list-style:none;min-height:2.75rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>div{padding:2px 16px 14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{color:var(--pink-deep);font-size:.82rem}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink-mid),var(--pink));border-radius:99px}
.bar.mint i{background:linear-gradient(90deg,var(--mint-mid),var(--mint))}
.mastery{display:inline-flex;gap:4px;flex-wrap:wrap}
.mastery button{width:2.3rem;height:2.3rem;border-radius:50%;border:1.5px solid var(--mint-mid);background:var(--surface);color:var(--ink2);font-weight:700;padding:0}
.mastery button.on{background:var(--mint);border-color:var(--mint);color:#fff}
.favbtn{border:1.5px solid var(--pink-mid);background:var(--surface);color:var(--pink);border-radius:999px;padding:5px 13px;font-size:.85rem;font-weight:700;min-height:2.3rem}
.favbtn.on{background:var(--pink);color:#fff}
.askbtn{border:1.5px solid var(--mint);background:var(--surface);color:var(--mint-deep);border-radius:999px;padding:5px 13px;font-size:.85rem;font-weight:700;min-height:2.3rem}
.notebox{width:100%;min-height:64px;margin-top:8px}
.essaytext{font-family:Georgia,"Times New Roman",serif;font-size:1.03rem;line-height:1.85}
.essaytext p{margin:.7rem 0}
.zhtrans{line-height:1.9;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:7px 0;font-size:.97rem;min-height:3rem}
.opt:hover{border-color:var(--pink-mid)}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.timer{font-size:2rem;font-weight:800;color:var(--pink-deep);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.searchhit{background:var(--gold-soft)}
.mut{color:var(--ink2)} .sm{font-size:.86rem}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
ul.tight{margin:.3rem 0 .3rem 1.1rem;padding:0}
ul.tight li{margin:.28rem 0}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.checkrow .st{flex:0 0 auto}
.secthead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pill-nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill-nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;min-height:2.4rem}
.pill-nav button.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
@media print{#sidebar,#topbar,#savebar,#toast{display:none!important}#main{padding:0}}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="主导航"></nav>
  <div id="scrim"></div>
  <main id="main">
    <div id="topbar">
      <button id="menubtn" class="btn ghost sm" aria-label="打开导航">☰ 菜单</button>
      <b style="color:var(--pink-deep)">Elite Economist System</b>
      <span class="sm mut">WEC14/01 · U4</span>
    </div>
    <div id="view"><p class="mut">正在加载…</p></div>
  </main>
</div>
<div id="savebar">数据：<b id="savestate">正在连接本机数据库…</b></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ================= 工具函数 ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arrows=s=>esc(s).replace(/→/g,'<b>→</b>');
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2600);}
function copyText(txt,okMsg){
  const done=()=>toast(okMsg||"已复制，去聊天里粘贴给 Viaana 吧");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("复制失败，请长按手动复制");}document.body.removeChild(ta);}

/* ================= 用户数据（IndexedDB，与内容数据分离） ================= */
const DBNAME="elite-economist-u4", STORE="userdata";
let U={favs:{},notes:{},mastery:{},masteryTs:{},mistakes:[],mcqLog:[],essayLog:[],settings:{theme:"dark",examDate:"",fontSize:100},planner:{},strategySeen:false};
let dbOK=false;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
let db=null, saveTimer=null;
async function loadUser(){
  try{db=await idbOpen();dbOK=true;
    const rec=await new Promise((res,rej)=>{const tx=db.transaction(STORE,"readonly").objectStore(STORE).get("state");tx.onsuccess=()=>res(tx.result);tx.onerror=()=>rej(tx.error);});
    if(rec&&typeof rec==="object"){U=Object.assign(U,rec);U.masteryTs=U.masteryTs||{};U.settings=Object.assign({theme:"dark",examDate:"",fontSize:100},rec.settings||{});
      if(U.settings.theme==="auto"){U.settings.theme="dark";saveUser();}}
    setSave("已连接本机数据库（IndexedDB）");
  }catch(e){dbOK=false;setSave("数据库不可用，数据仅保存在本次打开期间");}
  applyTheme();
}
function setSave(txt){const el=$("#savestate");if(el)el.textContent=txt;}
function saveUser(){
  setSave("保存中…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    if(!db){setSave("数据库不可用，未能持久保存");return;}
    try{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(JSON.parse(JSON.stringify(U)),"state");
      tx.oncomplete=()=>setSave("已自动保存 · "+new Date().toLocaleTimeString("zh-CN",{hour12:false}));
      tx.onerror=()=>setSave("保存失败，请到「设置」导出 JSON 备份");
    }catch(e){setSave("保存失败，请到「设置」导出 JSON 备份");}
  },250);
}
function applyTheme(){
  const t=U.settings.theme||"dark";
  const dark=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  if(dark)document.documentElement.setAttribute("data-theme","dark");else document.documentElement.removeAttribute("data-theme");
  document.body.style.fontSize=(U.settings.fontSize||100)+"%";
}

/* ================= 经济学图表（内嵌 SVG，含标注） ================= */
function svgWrap(inner,label){return '<svg viewBox="0 0 340 250" style="width:100%;max-width:430px;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px" role="img" aria-label="'+esc(label)+'">'+inner+'</svg>';}
const AX='<line x1="45" y1="15" x2="45" y2="215" stroke="var(--ink2)" stroke-width="1.5"/><line x1="45" y1="215" x2="325" y2="215" stroke="var(--ink2)" stroke-width="1.5"/>';
const DIAGRAMS={
ppc:{name:"生产可能性边界 (Production Possibility Curve, PPC)",draw(){return svgWrap(AX+
 '<path d="M60 35 Q 200 60 300 190" fill="none" stroke="var(--pink)" stroke-width="2.5"/>'+
 '<circle cx="215" cy="98" r="4" fill="var(--mint)"/><text x="222" y="94" font-size="12" fill="var(--ink)">贸易后消费点</text>'+
 '<circle cx="180" cy="112" r="4" fill="var(--ink2)"/><text x="120" y="130" font-size="12" fill="var(--ink2)">贸易前消费点</text>'+
 '<text x="8" y="30" font-size="12" fill="var(--ink)">资本品</text><text x="255" y="235" font-size="12" fill="var(--ink)">消费品</text>',"PPC 图：专业化后消费点位于 PPC 之外");},
 steps:"纵轴资本品、横轴消费品；画一条向外弯曲的 PPC（机会成本递增）；标出贸易前消费点（在 PPC 上），再按比较优势专业化生产、按贸易条件交换，消费点移到 PPC 之外——这是贸易收益的核心图。常见错误：把消费点仍画在 PPC 上；忘记标注交换后消费点在曲线之外。"},
tariff:{name:"关税图 (Tariff diagram)",draw(){return svgWrap(AX+
 '<line x1="60" y1="180" x2="300" y2="45" stroke="var(--pink)" stroke-width="2.5"/><text x="285" y="40" font-size="12" fill="var(--pink)">S（国内供给）</text>'+
 '<line x1="60" y1="45" x2="300" y2="180" stroke="var(--mint-deep)" stroke-width="2.5"/><text x="272" y="196" font-size="12" fill="var(--mint-deep)">D（国内需求）</text>'+
 '<line x1="45" y1="120" x2="320" y2="120" stroke="var(--ink2)" stroke-dasharray="5 4"/><text x="250" y="114" font-size="12" fill="var(--ink)">Pw 世界价格</text>'+
 '<line x1="45" y1="88" x2="320" y2="88" stroke="var(--pink-deep)" stroke-width="2"/><text x="238" y="82" font-size="12" fill="var(--pink-deep)">Pw+T 关税后价格</text>'+
 '<text x="8" y="30" font-size="12" fill="var(--ink)">价格</text><text x="285" y="235" font-size="12" fill="var(--ink)">数量</text>',"关税图：价格由 Pw 升至 Pw+T");},
 steps:"画国内供给 S（向上倾斜）与需求 D（向下倾斜）；画水平世界价格线 Pw（完全弹性供给）；加关税后价格线升至 Pw+T：国内产量扩大、消费量缩小、进口量 = 两价格下需求量与供给量之差。福利：消费者剩余减少，生产者剩余增加（a 区），政府收入（c 区），无谓损失为两个小三角形（b 生产扭曲 + d 消费扭曲）。取消关税（自贸协定）即反向读图。常见错误：把 Pw 画成倾斜线；进口量标注错位。"},
adas:{name:"总需求/总供给 (AD/AS)",draw(){return svgWrap(AX+
 '<line x1="60" y1="50" x2="290" y2="185" stroke="var(--pink)" stroke-width="2.5"/><text x="262" y="200" font-size="12" fill="var(--pink)">AD</text>'+
 '<line x1="60" y1="185" x2="200" y2="70" stroke="var(--mint-deep)" stroke-width="2.5"/><text x="196" y="62" font-size="12" fill="var(--mint-deep)">SRAS</text>'+
 '<line x1="235" y1="20" x2="235" y2="215" stroke="var(--ink2)" stroke-width="2"/><text x="240" y="30" font-size="12" fill="var(--ink2)">LRAS</text>'+
 '<text x="8" y="30" font-size="12" fill="var(--ink)">价格水平</text><text x="245" y="235" font-size="12" fill="var(--ink)">实际产出</text>',"AD/AS 图");},
 steps:"纵轴价格水平、横轴实际产出（real GDP）；AD 向下倾斜，SRAS 向上倾斜，LRAS 垂直于充分就业产出。分析时先判断冲击移动哪条曲线、向哪边移，再读新均衡的价格与产出变化。例如贸易条件下降：(X−M) 改善使 AD 右移，同时进口投入品变贵使 SRAS 左移——价格水平确定上升，产出方向不确定，这正是评价点。常见错误：混淆 SRAS 与 LRAS 的移动原因；移动曲线却不标新均衡。"},
lrac:{name:"长期平均成本 (LRAC) 与规模经济",draw(){return svgWrap(AX+
 '<path d="M60 45 Q 160 165 235 168 Q 300 165 318 90" fill="none" stroke="var(--pink)" stroke-width="2.5"/>'+
 '<circle cx="235" cy="168" r="4" fill="var(--mint)"/><text x="180" y="190" font-size="12" fill="var(--ink)">最低效率规模 MES</text>'+
 '<text x="70" y="70" font-size="12" fill="var(--ink2)">规模经济</text><text x="255" y="80" font-size="12" fill="var(--ink2)">规模不经济</text>'+
 '<text x="8" y="30" font-size="12" fill="var(--ink)">平均成本</text><text x="285" y="235" font-size="12" fill="var(--ink)">产量</text>',"LRAC 图：U 形曲线与最低效率规模");},
 steps:"画 U 形 LRAC：产量扩大初期因规模经济（economies of scale）成本下降，越过最低效率规模 (MES) 后因规模不经济上升。全球化/加入贸易集团使企业面对更大市场、产量扩大，沿 LRAC 下行段移动 → 单位成本下降 → 出口价格下降 → 国际竞争力上升。常见错误：把 LRAC 与 SRAC 混为一谈；只画下降段不标 MES。"},
lorenz:{name:"洛伦兹曲线与基尼系数 (Lorenz curve & Gini coefficient)",draw(){return svgWrap(AX+
 '<line x1="45" y1="215" x2="320" y2="15" stroke="var(--ink2)" stroke-dasharray="5 4"/><text x="225" y="35" font-size="12" fill="var(--ink2)">绝对平等线</text>'+

 steps:"横轴人口累计百分比、纵轴收入累计百分比；45° 线为绝对平等线。洛伦兹曲线越向右下弯曲，收入分配越不平等。基尼系数 (Gini coefficient) = 平等线与洛伦兹曲线之间的面积 ÷ 平等线以下总面积，介于 0（完全平等）与 1（完全不平等）之间。常见错误：两轴标反；把基尼系数说成百分比时不换算（0.35 即 35）。"},

{id:"kp22a",theme:1,ch:"Ch.22",zh:"全球化的收益",en:"Benefits of globalisation",st:"full",
 defEn:"The benefits of globalisation arise mainly from comparative advantage: specialisation and trade raise world output, lower prices and increase choice, while competition and technology transfer raise efficiency.",
 defZh:"全球化的收益 (benefits of globalisation) 主要来自比较优势：专业化与贸易提高世界产出、压低价格、增加选择；竞争与技术转移提高效率。以下五点为官方评分要点。",
 principle:"五大收益（官方 Mark Scheme 核对）：(1) 比较优势 → 专业化 → 世界产出↑、生活水平↑；(2) 消费者：价格↓、选择↑ → 消费者剩余 (consumer surplus)↑、配置效率 (allocative efficiency)↑；(3) 企业：市场扩大 → 规模经济 (economies of scale)、收入与利润↑；(4) 技术转移与管理技术扩散；竞争加剧 → 生产效率↑（X-低效率下降）；(5) 政府税收↑ → 公共服务支出↑；欠发达国家实际 GDP↑ → 绝对贫困↓；劳动力迁移缩小地区差距（如东欧工人西迁）。",
 causes:"收益的来源是交易成本下降后比较优势得以实现（见 kp21b、kp23a）。",
 mechanism:"每个主体的收益链：消费者——进口竞争压价；企业——市场规模突破本国需求上限后沿 LRAC 下行；政府——利润与收入扩大税基；欠发达国家——出口部门与 FDI 带来就业、收入与技术。",
 chain:"比较优势实现 → 专业化+贸易 → 世界产出↑ → 价格↓、选择↑、企业规模经济、技术转移 → 收入与税收↑ → 欠发达国家绝对贫困↓",
 diagram:"lrac",diagramNote:"企业收益用 LRAC 图：市场扩大使产量沿 LRAC 下行段移动，单位成本下降。消费者收益可用 PPC（消费点移出曲线外）。",
 caseTxt:"官方例子：欧盟内东欧劳动者向西欧迁移缩小地区收入差距；按比较优势出口的欠发达国家实现实际 GDP 增长、绝对贫困下降。",
 essayUse:"202210-9：收益作 KAA、成本作评价（或反之）官方均认可 (KAA can be treated as evaluation and vice versa)；本题要求结合一个自选国家展开，不点名国家会明显削弱应用（是否构成 KAA 封顶以该题官方 Mark Scheme 原文为准，不扩展为所有 Essay 的通用规则）。",
 drUse:"材料给某国出口/FDI/贫困数据时，把数据挂到五大收益链的对应环节上引用，避免只描述数据。",
 mcqTrap:"易错：「涓滴理论 (trickle-down)」——官方原文指出几乎没有证据表明涓滴效应在实践中有效，不能把它当作无条件收益。",
 confusion:"易混：消费者剩余上升（价格下降）≠ 生产者剩余上升；进口国消费者得益的同时本国竞争企业可能受损，要分主体写。",
 lose:"失分点：202210-9 阅卷反馈——写「全球化的成因」离题不得分；只列收益点不展开链条停留在 Level 1；没有有依据的判断则评价封顶低档。",
 qs:["202210-9"],spec:"Specification 主题 1 · 1.3 全球化的影响（收益面）"},
{id:"kp22b",theme:1,ch:"Ch.22",zh:"全球化的成本与净效应判断",en:"Costs of globalisation and the net-effect judgement",st:"full",
 defEn:"The costs of globalisation include over-dependence on imports, labour exploitation, negative externalities, rising inequality and vulnerability to external shocks; whether benefits outweigh costs depends on the country, the time horizon and government policy.",
 defZh:"全球化的成本 (costs of globalisation) 包括：过度依赖进口、劳动剥削、负外部性、不平等加剧、对外部冲击的脆弱性。净效应取决于国家、时间跨度与政府政策。",
 principle:"五大成本（官方 Mark Scheme 核对）：(1) 过度依赖进口 → 经常账户恶化；(2) 劳动剥削：童工与女性劳工、低工资、长工时、安全卫生差；(3) 负外部性：生产与空运/海运的污染、不可再生资源加速消耗，损害后代实现可持续增长的能力；(4) 不平等加剧：发达与欠发达国家之间、以及各国内部；(5) 脆弱性：外部冲击跨境传导、衰退部门结构性失业。",
 causes:"成本的根源：各国劳动与环境标准不同、企业追逐最低成本、收益分配机制缺失、经济相互依存放大冲击传导。",
 mechanism:"成本链示例：企业迁往低标准国家 → 当地劳工被剥削 + 本国衰退行业工人结构性失业；贸易量↑ → 运输排放与资源消耗↑ → 负外部性由社会承担。",
 chain:"成本导向型全球布局 → 劳工标准竞次 (race to the bottom) + 污染与资源消耗↑ + 进口依赖↑ → 不平等↑、脆弱性↑ → 若无再分配与规制，净福利受损",
 diagram:"lorenz",diagramNote:"不平等成本用洛伦兹曲线/基尼系数表达：全球化后曲线更弯曲 = 国内不平等加剧（官方图表角度之一）。",
 caseTxt:"官方评价素材：中国增长放缓对全球经济的传导（202506A-8）正是「相互依存 → 冲击传导」的现实版：2024 年中国出口 3.6 万亿、进口 2.6 万亿美元，其需求下降直接压低伙伴国增长。",
 essayUse:"净效应判断模板（非机械套用）：先分主体（消费者/企业/劳工/政府/环境）与时间（短/长期）比较，再指出决定条件——是否有再分配（税收与转移支付、再培训）与环境规制，最后给有优先级的判断。",
 drUse:"材料题中成本类数据（失业、排放、逆差）要链接到具体成本链，并用材料数字说明幅度 (magnitude)。",
 mcqTrap:"易错：把「经常账户逆差」本身说成全球化的必然结果——它取决于该国在分工中的位置与竞争力，不是全球化的定义性结果。",
 confusion:"易混：全球化导致的不平等有两层——国家之间 (between countries) 与国家内部 (within countries)，官方评分点分开计算，答题要分开写。",
 lose:"失分点：只写成本不比较收益（本题问 outweigh）；判断句没有条件与依据（depends on… 必须落到具体条件）；本题要求结合自选国家，全程不点名国家会削弱应用得分（封顶规则逐题以官方 MS 为准）。",
 qs:["202210-9","202506A-8"],spec:"Specification 主题 1 · 1.3 全球化的影响（成本面与判断）"},
{id:"kp23a",theme:2,ch:"Ch.23",zh:"绝对优势、比较优势与专业化",en:"Absolute advantage, comparative advantage and specialisation",st:"full",
 defEn:"A country has a comparative advantage in a good if it can produce it at a lower opportunity cost than another country. Countries gain by specialising in goods where they have a comparative advantage and trading for the rest.",
 defZh:"比较优势 (comparative advantage)：一国生产某商品的机会成本 (opportunity cost) 低于另一国时，即在该商品上拥有比较优势。绝对优势 (absolute advantage) 指用更少要素投入生产同一商品。各国按比较优势专业化 (specialisation) 并进行贸易，双方消费都能超出各自的 PPC。",
 principle:"机会成本 = 生产 1 单位 B 所放弃的 A 的数量。专业化方向由机会成本低者决定，与绝对效率高低无关——这是全章最核心、也最常考错的一点。",
 causes:"比较优势的来源：要素禀赋、气候、技术、劳动生产率与技能结构不同（如英国、美国在服务业）。",
 mechanism:"各国把资源集中到机会成本最低的产品 → 世界总产出↑ → 按介于两国机会成本比率之间的贸易条件交换 → 两国消费点都移到 PPC 之外。",
 chain:"机会成本不同 → 各自专业化于低机会成本产品 → 世界产出↑ → 交换后两国消费超出各自 PPC → 生活水平↑",
 diagram:"ppc",diagramNote:"考试画法：两国各自 PPC + 专业化生产点 + 贸易后消费点（在 PPC 之外）。或用数值表算机会成本比率。贸易条件必须落在两国机会成本比率之间，双方才都有利。",
 caseTxt:"官方题干：英国与美国服务业占 GDP 比重远高于意大利与加拿大——202110-9 即以发达国家服务业专业化为情境。",
 essayUse:"202110-9 的第一段：定义 + 数值或图示比较优势 → 消费超出 PPC，这是 L4 KAA 要求「examples fully integrated」的标准开局。",
 drUse:"材料给两国产量/成本数据时，先算机会成本再判断专业化方向，不要凭「产量大」判断优势。",
 mcqTrap:"高频陷阱：产量更高（绝对优势）≠ 应该出口；判断出口方向只看机会成本。另一陷阱：贸易条件落在机会成本比率区间之外时，一方无利可图、不会自愿贸易。",
 confusion:"易混：比较优势看机会成本（相对概念），绝对优势看单位投入产出（绝对概念）；一国可以在所有产品上都有绝对优势，但不可能在所有产品上都有比较优势。",
 lose:"失分点：只背定义不做数值/图示推导；专业化段落不接贸易收益（产出、价格、就业），链条断裂停留在 Level 2。",
 qs:["202110-9","202401-9","202506-7e"],spec:"Specification 主题 2 · 2.1 比较优势与专业化"},
{id:"kp23b",theme:2,ch:"Ch.23",zh:"贸易收益、模型假设与局限",en:"Gains from trade; assumptions and limitations of the model",st:"full",
 defEn:"The gains from trade include higher world output, economies of scale, lower prices and greater choice; the comparative advantage model assumes no transport costs, perfect mobility of factors and constant costs — assumptions that often fail in reality.",
 defZh:"贸易收益 (gains from trade)：世界产出上升、规模经济、价格下降、选择增加、贸易平衡与增长改善。模型假设：无运输成本、要素完全流动、无递减收益（成本不变）——现实中常不成立，这正是官方评价清单。",
 principle:"收益链（官方）：专业化 → 规模经济 → LRAC↓ → 服务出口价格↓ → 国际竞争力↑ → 出口↑ → (X−M) 与 AD↑ → 增长、服务业投资与就业↑、生活水平↑；配置效率提高还压低全球通胀。",
 causes:"收益大小取决于：专业化程度、所专业化行业的需求与价格弹性、贸易条件落在机会成本区间内的位置。",
 mechanism:"局限如何咬人：要素不能完全流动 → 衰退行业工人面临职业流动性障碍 (occupational immobility) → 结构性失业；运输成本存在 → 部分「比较优势」被运费吃掉；长供应链/准时制 (JIT) 在中断时造成短缺与涨价。",
 chain:"模型假设不成立 → 结构性失业 + 外部冲击脆弱性 + 供应链中断风险 + 资源过度开发与运输污染 → 静态收益被动态成本部分抵消",
 diagram:"lrac",diagramNote:"收益面用 LRAC（规模经济）；局限面可用 PPC 说明资源错配，或文字说明贸易条件区间。",
 caseTxt:"官方评价例子：疫情与关键零部件短缺暴露长供应链脆弱性；发达国家专业化于服务业后对进口制成品形成过度依赖、外汇缺口 (foreign-currency gap) 风险。",
 essayUse:"202110-9 评价段直接取材本点：模型假设（运输成本、要素流动、成本不变）+ 脆弱性 + 贸易条件区间 + 结构性失业，四选二写深，并做优先级判断。",
 drUse:"材料出现失业或供应链数据时，用「假设不成立」框架解释，而不是泛泛说「有坏处」。",
 mcqTrap:"易错：把「规模经济」说成比较优势的来源——规模经济是专业化的结果/收益，不是机会成本差异的来源。",
 confusion:"易混：静态收益（一次性产出与价格改善）vs 动态成本（脆弱性、失业调整成本）；评价时要分开时间维度。",
 lose:"失分点：评价只写「模型不现实」一句不展开后果链；或收益段与局限段重复同一内容。官方要求评价须「recognises different viewpoints + informed judgement」。",
 qs:["202110-9"],spec:"Specification 主题 2 · 2.2 贸易收益与模型局限"},
{id:"kp24a",theme:2,ch:"Ch.24",zh:"贸易格局：定义、经验图景与影响因素",en:"Pattern of trade — definition, evidence and influencing factors",st:"full",
 defEn:"The pattern of trade is the composition of exports and imports (what is traded) and their geographical distribution (with whom). It is influenced by comparative advantage, emerging economies, trading blocs, exchange rates, protectionism, competitiveness and FDI.",
 defZh:"贸易格局 (pattern of trade) = 贸易的构成（交易什么）+ 地理分布（与谁交易）。影响因素（官方清单）：比较优势、新兴经济体崛起、贸易集团与双边协定、汇率、保护主义、竞争力、FDI、发达国家去工业化。",
 principle:"经验图景（WTO，官方题干）：1995–2022 年发展中经济体出口占世界贸易比重上升、发达经济体比重下降——这是本章的锚点事实。",
 causes:"逐项机制：比较优势随成本与技术变化而移动；中国与东欧开放使制造业向发展中经济体转移；FDI 把产能建到新兴市场；贸易集团与双边协定通过贸易创造改变流向；汇率与「货币战争」（如中国防止人民币升值）改变相对价格；保护主义（关税、补贴）扭曲流向；美英丧失低成本制造业竞争力、发达国家去工业化 (deindustrialisation)。",
 mechanism:"因素不是并列清单而是相互作用：FDI 流入 → 新兴经济体产能与出口↑ → 发达国家进口↑、转向服务与高技术 → 双边流向与构成同时改变。",
 chain:"新兴经济体开放+FDI 流入+比较优势转移 → 制造业向发展中经济体集中 → 发展中经济体出口份额↑（1995–2022）→ 发达国家去工业化、专业化于服务业 → 贸易构成与流向重塑",
 diagram:"ppc",diagramNote:"用比较优势数值例或 PPC 位移说明格局变化的方向；配合份额数据（发展中 vs 发达国家出口份额）作应用证据。",
 caseTxt:"官方例子：中国与东欧（前计划经济体）开放；美国、英国低成本制造业流失；中国已签 28 个自贸协定并加入 RCEP（占世界 GDP 约 1/3）改变其贸易流向（202506-7e）。",
 essayUse:"202401-9：选 2 个因素写深（如比较优势 + 新兴经济体/FDI），每个因素都要落到「构成或流向如何变」；结合具体国家展开应用（是否封顶逐题以官方 MS 为准）。",
 drUse:"材料给份额或流向数据时，先判断是哪类因素在驱动（成本/政策/汇率），再用数据幅度支撑。",
 mcqTrap:"易错：把贸易量 (volume of trade) 与贸易格局 (pattern) 混为一谈——格局问的是构成与流向，不是总量。",
 confusion:"易混：贸易创造（集团内低成本来源替代高成本国内生产，福利↑）vs 贸易转移（高成本成员国来源替代低成本非成员来源，福利↓）——方向判断正好相反。",
 lose:"失分点：阅卷反馈——多数答案只有两环链条，够不到高档；因素罗列不排序、最后不给「组合因素更重要」的判断，评价上不去。",
 qs:["202401-9","202110-8","202506-7e"],spec:"Specification 主题 2 · 2.3 贸易格局及其影响因素"},
{id:"kp24b",theme:2,ch:"Ch.24",zh:"贸易格局的评价角度",en:"Evaluating changes in the pattern of trade",st:"full",
 defEn:"Evaluation of trade-pattern changes rests on the unrealistic assumptions of comparative advantage, rising wages and transport costs causing reshoring, exchange-rate volatility, retaliation and the fact that factors act in combination over different time horizons.",
 defZh:"贸易格局评价（官方清单）：比较优势假设不现实（成本不变、要素完全流动）；中国等国工资与运输成本上升 → 制造业回流 (reshoring)；汇率高度波动使格局可逆；保护主义引发报复；国家退出贸易集团与贸易转移扭曲格局；因素组合作用、短长期不同、需排序。",
 principle:"评价的核心句式：单一因素很少决定格局——组合 (combination) + 时间 (SR vs LR) + 国家差异 (different economies) 是官方评价的三件套。",
 causes:"格局逆转的触发：工资上涨侵蚀成本优势、运输成本上升、汇率反转、政策报复与集团解体。",
 mechanism:"以回流为例：中国工资↑ → 单位劳动成本优势缩小 → 加上运输成本与供应链风险 → 部分制造业回流发达国家或其他发展中国家 → 格局部分逆转。",
 chain:"成本优势收窄+风险上升 → 企业重新选址 → 回流/近岸化 → 发展中经济体份额增速放缓 → 格局变化趋缓甚至局部逆转",
 diagram:"",diagramNote:"",
 caseTxt:"官方例子：英国等国退出/考虑退出贸易集团；中美贸易摩擦中互相报复性关税改变双边流向。",
 essayUse:"202401-9 与 202110-8 的评价段：从本点选二（回流 + 汇率波动，或假设批判 + 组合判断），结尾给出「哪一因素对哪类国家最重要」的有条件判断。",
 drUse:"材料题中出现工资、运费、汇率数据时，用本点把「当前格局会持续还是逆转」说清楚。",
 mcqTrap:"易错：认为比较优势是静态的——技术、工资与政策变化都会使比较优势移动，格局随之改变。",
 confusion:"易混：回流 (reshoring，回本国) ≠ 近岸化 (near-shoring，移到邻近国家）；两者都会改变流向但方向不同。",

{id:"kp25a",theme:2,ch:"Ch.25",zh:"贸易条件：定义、公式与计算",en:"Terms of trade — definition, formula and calculation",st:"full",
 defEn:"The terms of trade measure the ratio of export prices to import prices: ToT index = (index of average export prices ÷ index of average import prices) × 100. An improvement means each unit of exports buys more imports.",
 defZh:"贸易条件 (terms of trade) 衡量出口价格相对进口价格的比率：贸易条件指数 =（出口价格指数 ÷ 进口价格指数）× 100。改善 (improvement) = 每单位出口能换回更多进口；恶化 (worsening/deterioration) 则相反。基年指数 = 100。",
 principle:"计算三步：分别算出口与进口价格指数（基年 = 100）→ 代入公式 → 用百分比变化判断改善/恶化：%Δ =（新 − 旧）÷ 旧 × 100。",

 mechanism:"贸易条件是价格比率，不是数量比率：它只告诉你「交换比率」变了，不直接告诉你贸易差额或福利变了——福利还要看数量反应（弹性）。",
 chain:"出口价格相对进口价格↑ → ToT 指数↑ → 单位出口购买力↑ → （福利与差额的最终结果取决于进出口数量对价格的反应）",

 principle:"统一记忆法：凡是推高出口价格或压低进口价格的因素都改善贸易条件——哪怕它本身是「坏事」（高通胀、低生产率），这是本章的反直觉核心。",

{id:"kp25d",theme:2,ch:"Ch.25",zh:"贸易条件下降的宏观经济效应",en:"Macroeconomic effects of a fall in the terms of trade",st:"full",
 defEn:"A fall in the terms of trade means export prices have fallen relative to import prices (the ToT index falls). It may be caused by lower export prices, higher import prices, or both. Its macroeconomic effects depend on the cause: only where the fall results from a depreciation do export volumes necessarily rise — and only then is the Marshall–Lerner condition the relevant test of whether the trade balance improves.",
 defZh:"贸易条件下降 = 出口价格相对进口价格下降（指数下降）。它可能由出口价格下跌、进口价格上涨或两者共同造成；汇率贬值只是可能成因之一，不能把贬值与贸易条件恶化当成同一个概念。宏观效应取决于成因：只有贬值造成的恶化才有「出口变便宜 → 数量上升」的传导，此时差额是否改善才由马歇尔-勒纳条件（Marshall–Lerner condition）判断；进口价格冲击或生产率上升造成的恶化必须按各自机制分析。",
 principle:"先分清三件事：① 贸易条件是价格比率（Px 指数 ÷ Pm 指数）；② 贬值是汇率变化，只是 ToT 变动的可能原因之一；③ 马歇尔-勒纳条件讨论的是贬值对贸易差额的影响（PEDx + PEDm > 1 时贬值改善差额），不是判断一切贸易条件变化后果的通用条件。不能写成「ToT↓ → 出口量↑/进口量↓ → (X−M)↑」的普遍规律——那只在贬值造成恶化、且弹性条件成立时才可能出现。",
 causes:"传导起点取决于成因：贬值型——出口外币价格↓、进口本币价格↑；进口价格冲击型（如油价上涨）——进口账单先上升、出口数量未必增加；生产率型——出口价格因单位成本下降而降低，但出口数量与实际收入同时上升。三种成因的净效应方向不同，必须分开写。",
 mechanism:"以贬值型恶化、且弹性足够为例：AD/AS 双向移动——AD 右移（净出口↑）推高产出与价格；进口投入品变贵使 SRAS 左移，进一步推高价格、抵消产出增益——价格水平确定上升，产出方向不确定，这是本题最有价值的评价结构。进口价格冲击型则主要是 SRAS 左移与实际收入下降，不要套用同一张图。",
 chain:"分情形：【贬值造成】贬值 → 出口变便宜、进口变贵 → ToT↓；数量调整后若 PEDx＋PEDm＞1 → (X−M)↑ → AD↑ → GDP↑、失业↓ → 税收↑、转移支付↓ → 预算改善；同时进口价格↑ → 成本推动通胀↑。【进口价格上涨造成】进口价格↑ → ToT↓ → 进口账单↑、实际收入↓ → 差额与增长未必改善。【生产率上升造成】单位成本↓ → 出口价格↓ → ToT↓，但出口数量与竞争力↑ → 收入可能上升",
 diagram:"adas",diagramNote:"必画：AD 右移 + SRAS 左移的组合图，标注价格水平确定上升、实际产出方向不确定——图本身就是评价。",
 caseTxt:"官方题干：柬埔寨 2000–2018 年贸易条件下降 31.3%——幅度大，评价时可据此论证效应显著。",

 drUse:"材料题给 ToT 与通胀/增长数据时，用 AD+SRAS 双移框架解释数据组合（如增长与通胀同升）。",

{id:"kp25e",theme:2,ch:"Ch.25",zh:"普雷维什-辛格假说与长期评价",en:"Prebisch–Singer hypothesis and long-run evaluation",st:"full",
 defEn:"The Prebisch–Singer hypothesis argues that the terms of trade of primary-product exporters tend to decline in the long run relative to manufactures, because demand for primary products is income-inelastic while manufactures benefit from stronger demand and pricing power.",
 defZh:"普雷维什-辛格假说 (Prebisch–Singer hypothesis)：长期看，初级产品出口国的贸易条件趋于下降——初级产品需求收入弹性低、价格竞争激烈，而制成品需求增长快、厂商有定价权。",
 principle:"机制：收入↑ 时对食品/原料的需求增长慢于制成品 → 初级产品相对价格长期下行；加上初级产品供给竞争激烈、易被合成替代品取代。",
 causes:"需求面：恩格尔式收入弹性差异；供给面：初级产品生产者众多、进入门槛低；技术面：节约原料的技术进步与替代品。",
 mechanism:"长期后果：初级产品依赖国出口购买力持续被侵蚀 → 发展融资缺口 → 借债与援助依赖——连接 Ch.25 与主题 6（发展）的桥梁。",
 chain:"初级产品需求收入弹性低 → 相对价格长期↓ → 依赖初级产品出口的发展中国家 ToT 趋势性恶化 → 购买力与发展融资受损",

 caseTxt:"官方评价呼应：202305-7e 官方评价明确提到「primary-product-dependent countries may find ToT decrease over time — Prebisch–Singer hypothesis」。",

{id:"kp21d",theme:1,ch:"Ch.21/22",zh:"跨国公司与 FDI：原因、东道国影响与争议",en:"MNCs and FDI — causes, host-country effects, transfer pricing and policy influence",st:"full",
 defEn:"Foreign direct investment (FDI) is investment by a multinational company (MNC) in productive capacity in another country. MNCs invest abroad to access markets, cut costs and secure resources; host countries gain jobs, output and technology but face profit repatriation, transfer pricing and pressure on domestic policy.",
 defZh:"外国直接投资 (FDI) 是跨国公司 (MNC) 在另一国建立生产能力的投资。企业对外投资为的是进入市场、降低成本、 확보资源；东道国得到就业、产出与技术，但也面临利润汇出、转移定价 (transfer pricing) 与国内政策受制约的问题。",
 principle:"FDI 的原因分四类：市场寻求（绕过壁垒、贴近消费者）、效率寻求（低劳动成本、规模经济）、资源寻求（原料与能源）、战略资产寻求（品牌、技术、并购）。对东道国的影响必须分主体评估，不能一概而论。",
 causes:"推动因素：东道国市场规模与增长、低单位劳动成本、贸易集团成员身份（可跳板进入整个集团市场）、稳定的政策与基础设施、税收优惠竞争。",
 mechanism:"收益链：FDI 流入 → 建厂与就业↑ → 工资收入与消费↑ → 乘数效应；技术与管理外溢 (spillover) → 本地企业生产率↑；出口产能↑ → 经常账户改善。成本链：利润汇回母国 → 初次收入流出；转移定价把利润记在低税国 → 东道国税收流失；MNC 以撤资相威胁游说 → 政府在税率、劳工与环境标准上让步（政策竞次）。",
 chain:"FDI 流入 → 就业与产出↑ + 技术外溢 → 增长与出口↑；同时利润汇出 + 转移定价压低税基 + 政策游说 → 净收益取决于东道国的征税与规制能力",
 diagram:"adas",diagramNote:"宏观面用 AD/AS：FDI 是投资 (I) 与长期供给能力的同时扩张——短期 AD 右移，长期 LRAS 右移，两者要分开说。",
 caseTxt:"官方语境：中国与东欧开放后 FDI 大量流入制造业，是 202201-8 与 202401-9 的核心应用素材；202310-10 直接考「FDI 流入益处」。",

{id:"kp26a",theme:2,ch:"Ch.26",zh:"贸易集团与双边贸易协定",en:"Trading blocs and bilateral trading agreements",st:"full",
 defEn:"A trading bloc is a group of countries that agree to reduce or remove barriers to trade between themselves. A bilateral trading agreement is a similar arrangement between two countries. Membership creates trade between members but may divert trade away from more efficient non-members.",
 defZh:"贸易集团 (trading bloc) 是一组相互削减或取消贸易壁垒的国家；双边贸易协定 (bilateral trading agreement) 是两国之间的同类安排。成员身份在成员间创造贸易 (trade creation)，但也可能把贸易从更有效率的非成员那里转移走 (trade diversion)。",
 principle:"净福利 = 贸易创造（福利↑）− 贸易转移（福利↓）+ 动态收益（规模经济、竞争、投资）− 调整成本，方向不能预设，必须结合该集团的成本结构与一体化深度判断。",
 causes:"国家加入集团的动机：扩大市场、获得规模经济、提高谈判地位、锁定改革、区域政治与安全合作。",
 mechanism:"壁垒取消 → 成员间相对价格下降 → 消费者转向成员国低成本来源（创造）或被迫转向成员国高成本来源（转移）；企业面对更大市场 → 产量↑、沿 LRAC 下行；竞争加剧 → X-低效率↓；同时对非成员形成歧视，引发集团间摩擦与「意大利面碗」式的规则重叠（双边协定过多时）。",
 chain:"加入集团 → 内部壁垒↓ → 贸易创造（+）与贸易转移（−）同时发生 → 企业规模经济与竞争↑ → GDP 与消费者剩余方向取决于创造与转移的相对大小",
 diagram:"tariff",diagramNote:"用关税图读集团效应：对成员取消关税相当于价格由 Pw+T 回落至 Pw（创造）；但若成员国成本高于世界最低成本，进口来源从世界价格线转向更高的成员国供给，即转移。判读时先问：成员国是不是低成本生产者？",
 caseTxt:"官方例子：欧盟与南方共同市场 (Mercosur) 的贸易协定（202106-7e）；中国已签 28 个自贸协定并加入 RCEP（202506-7e）；英国退出欧盟是「退出集团」的评价例子。",
 essayUse:"202301-8（加入贸易集团益处）：KAA 用贸易创造、规模经济、消费者剩余、谈判权重；评价用贸易转移、相互依存、地理距离差异（官方清单口径）。",
 drUse:"材料给集团内/集团外贸易份额变化时，用创造 vs 转移框架分类，再判断净方向。",
 mcqTrap:"易错：认为加入集团必然增加福利——若转移大于创造，净福利下降；认为双边协定与多边自由化等价——双边协定对非成员有歧视性。",
 confusion:"易混：贸易创造（转向低成本来源，福利↑）vs 贸易转移（转向高成本成员来源，福利↓）——先判断来源成本再下结论，方向不要写反。",
 lose:"失分点：只写创造不写转移；不点名具体集团/国家；把「贸易量增加」直接等同于「福利增加」。",
 qs:["202301-8","202106-7e","202506-7e"],spec:"Specification 主题 2 · 2.5 贸易集团与双边协定"},
{id:"kp26b",theme:2,ch:"Ch.26",zh:"经济一体化类型",en:"Types of economic integration",st:"full",
 defEn:"Economic integration deepens in stages: a preferential trade agreement (PTA) gives selected reductions in barriers; a free trade area (FTA) removes internal barriers but members keep their own external tariffs; a customs union adds a common external tariff; a common (single) market adds free movement of labour and capital; economic and monetary union adds a single currency and harmonised policies.",
 defZh:"经济一体化 (economic integration) 分阶段加深：优惠贸易协定 (PTA) 只给部分壁垒削减；自由贸易区 (FTA) 取消内部壁垒但各成员保留各自的对外关税；关税同盟 (customs union) 再加共同对外关税；共同/单一市场 (common/single market) 再加劳动力与资本自由流动；经济与货币联盟 (economic and monetary union) 再加单一货币与政策协调。",
 principle:"每加深一级：一体化收益（市场规模、要素配置）上升，但成员让渡的政策自主权也上升——货币联盟成员失去独立货币政策与汇率工具，这是成本收益权衡的主线。",
 causes:"一体化加深的驱动：企业对统一规则与大市场的需求、成员国锁定改革的政治意愿、地缘与安全考虑。",
 mechanism:"FTA 的特有问题：对外关税不同 → 第三国商品从低关税成员转口进入（贸易偏转 trade deflection），需原产地规则 (rules of origin) 防堵，增加行政成本；关税同盟用共同对外关税消除此问题，但成员失去单独签约的自由。单一市场再消除非关税壁垒与要素流动障碍；货币联盟消除汇率波动与兑换成本，但成员在衰退时不能贬值、不能独立降息（一刀切政策问题）。",
 chain:"一体化加深 → 内部交易成本与价格差异↓、要素流动↑ → 配置效率与规模经济↑；同时政策自主权逐级让渡 → 货币联盟阶段失去利率与汇率工具 → 对不对称冲击的脆弱性↑",
 diagram:"",diagramNote:"本点以阶段对照为主，不配图：答题时把题目中的集团先定位到正确阶段（如 RCEP/中国-东盟为 FTA 性质、欧盟为单一市场 + 部分成员的货币联盟），再调用对应成本收益。",
 caseTxt:"官方例子：罗马尼亚加入欧元区（货币联盟）的成本题——转换成本、失去独立货币政策与贬值能力、《增长与稳定公约》对财政的约束（见范文库对应 VER 条目）。",
 essayUse:"任何贸易集团题的第一段先给集团定位阶段；货币联盟题必须同时涉及经济联盟与货币联盟两个层面，只写一面会封顶（官方口径）。",
 drUse:"材料出现新集团或协定时，先判断它处于哪个一体化阶段，再预测其成本收益构成，不要把 FTA 当成货币联盟分析。",
 mcqTrap:"易错：把 FTA 与关税同盟混为一谈——区别只在「是否有共同对外关税」；把单一市场说成只有商品自由流动——还包括劳动力与资本。",
 confusion:"易混：共同市场（要素可流动）≠ 关税同盟（只有共同对外关税）；货币联盟的「一刀切」问题是利率不合身，不是汇率问题（成员间已无汇率）。",
 lose:"失分点：阶段定位错误导致整段分析错位；货币联盟题只写贸易收益、不写失去货币政策与贬值能力的成本。",
 qs:["202301-8"],spec:"Specification 主题 2 · 2.5 一体化类型"},
{id:"kp26c",theme:2,ch:"Ch.26",zh:"贸易创造与贸易转移",en:"Trade creation and trade diversion",st:"full",
 defEn:"Trade creation occurs when joining a bloc shifts consumption from high-cost domestic production to lower-cost member supply, raising welfare. Trade diversion occurs when imports shift from a lower-cost non-member to a higher-cost member because of preferential access, reducing welfare.",
 defZh:"贸易创造 (trade creation)：加入集团后，消费从高成本的国内生产转向低成本的成员国供给，福利上升。贸易转移 (trade diversion)：由于优惠待遇，进口从低成本的非成员转向高成本的成员，福利下降。",
 principle:"判断口诀：先比较三个价格——国内成本、成员国成本、世界（非成员）最低成本。转向更低成本来源 = 创造；转向更高成本来源 = 转移。集团净效应 = 创造 − 转移。",
 causes:"创造的来源：成员国恰好是低成本生产者 + 内部壁垒完全取消。转移的来源：共同对外关税/优惠安排使成员国产品在税后价格上胜过更有效率的非成员。",
 mechanism:"创造链：关税取消 → 成员低价品进入 → 国内价格↓ → 消费者剩余↑ + 高成本国内产能退出（生产端无谓损失收回）。转移链：非成员产品被征税、成员产品免税 → 消费者被迫买更贵的成员产品 → 消费者剩余的部分转移变成成员国生产者的收入而非本国关税收入 → 净福利损失，且全球资源配置被扭曲（违背比较优势）。",
 chain:"加入集团 → 同一商品出现两个相对价格变化：对低成本成员 → 贸易创造（福利↑）；对高成本成员替代低成本非成员 → 贸易转移（福利↓）→ 净效应取决于两者大小与集团的成本结构",
 diagram:"tariff",diagramNote:"在关税图上叠加两条供给价格：世界价格 Pw（最低）与成员国价格 Pm（Pw < Pm < Pw+T）。取消对成员的关税后价格降至 Pm：相对国内高成本生产是创造；相对原本从世界市场以 Pw 进口则是转移——同一张图、两个效应，考试要分开标注。",
 caseTxt:"官方口径：202301-8 官方评价明确把贸易转移列为加入集团的首要保留；202106-7e（EU–Mercosur）的评价同样要求讨论转移与对欧盟农民的冲击。",
 essayUse:"集团类 Essay 的标准评价段：创造写 KAA、转移写评价（或反之），最后判断哪一效应在本案例中更大——依据是成员国是否为低成本生产者。",
 drUse:"材料给成员国与非成员的成本/价格数据时，直接算出创造与转移的方向再下笔。",
 mcqTrap:"易错：把「进口增加」当作创造的证据——进口从低成本非成员转到高成本成员同样是进口结构变化，但那是转移；把转移说成对成员国也有害——受损的是进口国消费者与全球效率，成员国出口商反而得益。",
 confusion:"易混：贸易转移（trade diversion，集团语境）≠ 贸易转向/改道（企业为规避关税改走第三国）；前者是福利概念，后者是规避行为。",
 lose:"失分点：只给定义不比较成本高低；把创造与转移的方向写反；净判断不给依据（成员国成本地位）。",
 qs:["202301-8","202106-7e"],spec:"Specification 主题 2 · 2.5 贸易创造与贸易转移"},
{id:"kp27a",theme:2,ch:"Ch.27",zh:"关税",en:"Tariffs",st:"full",
 defEn:"A tariff is a tax imposed on imports. It raises the domestic price of the imported good, expanding domestic supply, reducing consumption and imports, generating government revenue, and creating deadweight welfare losses.",
 defZh:"关税 (tariff) 是对进口商品征收的税。它抬高进口品的国内价格：国内供给扩大、消费与进口量缩小、政府获得税收，但产生无谓福利损失 (deadweight loss)。",
 principle:"福利分解（小国情形）：消费者剩余减少 = 生产者剩余增加（转移给国内生产者）+ 政府收入（转移给政府）+ 两个无谓损失三角形（生产扭曲 + 消费扭曲）。大国情形下关税还可能压低世界价格、改善本国贸易条件，但会招致报复。",
 causes:"征收关税的理由见 kp27e：保护幼稚产业、就业、收入、战略与反倾销等；此处只分析其作用机制。",
 mechanism:"价格由 Pw 升至 Pw+T → 国内产量沿 S 上升、需求量沿 D 下降 → 进口量 = 两价格下的需求与供给差，缩小；进口品变贵还推高国内整体价格水平（通胀压力），并使下游产业的投入成本上升。对出口部门的间接伤害：资源被拉向受保护部门 + 贸易伙伴报复 + 本币可能升值，出口竞争力下降。",
 chain:"征收关税 → 进口价格↑ → 国内产量↑、消费↓、进口↓ → 消费者剩余↓、生产者剩余↑、政府收入↑，但无谓损失出现 → 若伙伴报复 → 出口↓、贸易战风险↑",
 diagram:"tariff",diagramNote:"必会画：S、D、Pw、Pw+T 四条线与进口量区间；福利四块（生产者剩余增、政府收入、两个无谓损失三角形）要能逐块指出。常见错误：把 Pw 画成斜线；把政府收入矩形画错区间（应在 Pw 与 Pw+T 之间、对应关税后进口量）。",
 caseTxt:"官方语境：美国提高关税的原因（202601-7e）与关税增加的代价（202605A-8）；美国对选定进口品加征关税对全球经济的影响（范文库对应条目）——消费者承担多少取决于进口需求弹性。",
 essayUse:"保护主义题的图与机制核心：先用关税图给出静态福利分解，再用报复、投入成本与大国/小国差异做评价。",
 drUse:"材料给关税税率或进口量变化时，用图上的量格对应计算进口量与政府收入的变化。",
 mcqTrap:"易错：认为关税收入是净福利收益——它只是消费者剩余的转移；认为关税一定改善经常账户——报复与出口受损可使净效应反转。",
 confusion:"易混：关税（对进口征税，政府有收入）vs 配额（限制数量，租金归进口商，除非拍卖许可证）；从价税 (ad valorem) vs 从量税 (specific)。",
 lose:"失分点：图上进口量区间标错；只写「保护国内产业」不做福利分解；漏掉对消费者与下游产业的成本。",
 qs:["202601-7e","202605A-8","202410-8"],spec:"Specification 主题 2 · 2.6 关税"},
{id:"kp27b",theme:2,ch:"Ch.27",zh:"配额",en:"Quotas",st:"full",
 defEn:"A quota is a physical limit on the quantity of a good that may be imported. It raises the domestic price by restricting supply; unlike a tariff, the scarcity rent normally accrues to whoever holds the import licences (or to foreign exporters under voluntary export restraints), not to the government.",
 defZh:"配额 (quota) 是对进口数量的物理上限。它通过限制供给抬高国内价格；与关税不同，其稀缺租金 (quota rent) 通常归持有进口许可证者（自愿出口限制时归外国出口商），不归政府——除非政府拍卖许可证。",
 principle:"配额与等量关税的价格/数量效应相似，福利差别在租金归属与确定性：关税下进口量随需求变化，配额下数量被锁死、价格随需求波动；需求增长时配额的保护程度自动加深。",
 causes:"政府偏好配额的情形：需要确切控制进口数量（如保护衰退产业、外汇短缺时），或关税受 WTO 约束上限限制时转用数量工具。",
 mechanism:"进口量被压到配额上限 → 国内总供给左移 → 价格上升 → 国内产量扩大、消费缩小；价格升幅取决于需求弹性。租金 =（国内价格 − 世界价格）× 配额量。配额还削弱竞争：国内企业知道进口不会随降价而增加，涨价压力更大，垄断性定价风险高于关税情形。",
 chain:"设定配额 → 进口量锁死 → 国内价格↑ → 消费者剩余↓、国内生产者剩余↑、租金归许可证持有者 → 需求增长时价格进一步↑、保护自动加深",
 diagram:"tariff",diagramNote:"配额图与关税图共用骨架：差别在分析顺序——先定数量（配额线），再由 S 与 D 的缺口读出价格升幅；标注租金矩形（价格差 × 配额量）而不是政府收入。",
 caseTxt:"官方语境：保护主义影响题（202410-8）的工具箱之一；现实中常与关税配额 (tariff-rate quota) 组合出现：配额内低税、超配额高税。",
 essayUse:"保护主义题中与关税对比写：同为限制进口，配额对数量更确定、对价格更不确定，且租金不归政府——这是现成的评价点。",
 drUse:"材料给进口上限与实际价格时，用租金公式估算租金规模并指出归属。",
 mcqTrap:"易错：说配额给政府带来收入——只有拍卖许可证时才有；说配额下价格固定——固定的是数量，价格随需求浮动。",
 confusion:"易混：配额（进口数量上限）vs 自愿出口限制 VER（出口国「自愿」限量，租金归出口商）；配额 ≠ 关税配额的混合工具要分清两段税率。",
 lose:"失分点：福利分析漏掉租金归属；把配额与关税的确定性关系写反。",
 qs:["202410-8"],spec:"Specification 主题 2 · 2.6 配额"},
{id:"kp27c",theme:2,ch:"Ch.27",zh:"补贴",en:"Subsidies (as protection)",st:"full",
 defEn:"A production subsidy is a payment from government to domestic producers that lowers their costs and shifts supply outwards, allowing them to compete with imports or export at lower prices without raising the consumer price directly — at a fiscal cost to the government.",
 defZh:"生产补贴 (subsidy) 是政府付给国内生产者的款项，降低其成本、使供给曲线右移，让本国产品在不直接抬高消费者价格的情况下与进口竞争或低价出口——代价是政府财政支出。",
 principle:"补贴 vs 关税的关键差别：补贴不扭曲消费价格（无消费端无谓损失），但有财政成本与机会成本；在 WTO 规则下出口补贴受严格限制，且会招致反补贴税与报复。",
 causes:"补贴的理由：扶持幼稚产业、保就业与产能、粮食安全、纠正正外部性（如研发）；在贸易语境中，发达国家农业补贴是最常考的形态。",
 mechanism:"补贴 → 单位成本↓ → S 右移 → 国内产量↑、价格↓或不变 → 进口被替代、出口增加；过剩农产品以低于成本的价格进入世界市场（倾销 dumping）→ 世界价格被压低 → 无补贴的发展中国家生产者无法竞争 → 其农业收入与发展受损。",

{id:"kp27d",theme:2,ch:"Ch.27",zh:"非关税壁垒",en:"Non-tariff barriers",st:"full",

 principle:"NTB 的双重性：许多 NTB 有合法目的（健康、安全、环境），但同一工具可被用作变相保护 (disguised protectionism)；判断标准是它是否对进口品构成超出必要限度的歧视性负担。WTO 对 NTB 的约束弱于关税，这是其在现代保护主义中占比上升的原因。",

{id:"kp27e",theme:2,ch:"Ch.27",zh:"保护主义的理由",en:"Reasons for protectionism",st:"full",

 principle:"逐个理由的成立条件：幼稚产业——产业须有潜在比较优势且资本市场无法提供耐心融资，保护须限时并递减；就业——只是把失业成本转嫁给消费者与出口部门，长期看再培训优于保护；战略产业——限于国防与粮食等真实安全需求；反倾销——须证明低于成本销售且造成损害；经常账户——保护治标不治本（竞争力与储蓄-投资缺口才是根源）。",

 mechanism:"保护 → 受保护部门价格与利润↑ → 资源被吸入低效率部门 → 全经济配置效率↓；贸易伙伴报复 → 出口部门受损；消费者（尤其低收入者，因进口品占其支出比重高）实际收入↓ → 收入分配恶化。",

 paras:[
 "Globalisation is the increasing integration and interdependence of national economies into a single international market, with freer movement of goods, services, capital, labour and technology. Over the last 50 years many forces have driven this process, but two stand out: the collapse in the cost of transporting goods, above all containerisation, and trade liberalisation through the GATT/WTO system and the growth of trading blocs. This essay argues that falling transport costs were the most fundamental driver, because they made every other form of integration physically and commercially possible.",
 "The single most powerful factor was the fall in transport costs caused by containerisation. Standardised containers cut the cost of loading, shipping and transferring freight between ships, trains and lorries so sharply that the cost of moving a tonne of goods across an ocean fell to a small fraction of its 1970 level. The stem illustrates the result: total global shipping container volumes rose from 100 million tonnes in 1980 to 2 billion tonnes in 2020, an increase of 1,900%. The chain of causation runs as follows. Lower freight costs reduced the delivered price of foreign goods and components, so it became profitable for firms to source inputs from the lowest-cost location worldwide rather than domestically. This encouraged multinational companies to fragment production into global supply chains and to locate stages of production in countries such as China and Vietnam, generating large flows of foreign direct investment. Rising trade in components and final goods then raised the share of trade in world GDP and deepened the interdependence of national economies — which is precisely what globalisation means. Without cheap container shipping, distant low-wage production could not have served Western markets, so this factor underpins the others.",
 "A second major factor was trade liberalisation. Successive GATT rounds and, after 1995, the WTO reduced tariffs and other barriers, while the number and size of trading blocs grew. Removing a tariff lowers the domestic price of imports from the tariff-inclusive price towards the world price, creating trade: low-cost foreign supply replaces high-cost domestic production, so countries specialise according to comparative advantage and world output rises. Political change amplified this process. China's opening after 1978 and its accession to the WTO in 2001, together with the opening of the former communist economies of Eastern Europe, brought hundreds of millions of low-cost workers into the world trading system, massively expanding both the supply of manufactures and the market for them. Cheaper communication — the internet, mobile technology and electronic payment systems — reinforced these forces by cutting the cost of coordinating production and trade across borders.",
 "Evaluating the relative importance of these factors, the evidence supports ranking transport costs first. A twenty-fold rise in container volumes is a change in physical capability, not merely in policy, and it operated continuously across the whole period. Trade liberalisation, by contrast, was neither continuous nor complete: the Doha Round, launched in 2001, failed to deliver further significant reductions in barriers, and the WTO has been much less successful against non-tariff barriers such as regulations and subsidies. Liberalisation therefore explains the timing of bursts of integration better than its overall scale.",
 "There are also important qualifications to any simple story of ever-deepening globalisation. The process has partly gone into reverse: the global financial crisis of 2008, the US–China trade war, the UK's departure from the EU — with Grexit and Italeave openly discussed — and the supply-chain disruption and labour shortages of the 2020 global health crisis all raised the cost or the risk of cross-border activity, producing what is often called slowbalisation. Nor were the gains from cheaper communication universal: many people in developing countries are excluded by poverty, illiteracy or lack of access to computer systems, so this driver integrated some economies far more than others. The significance of each factor also changes over time — in 2020–21, supply-chain disruption mattered more than any further fall in freight costs.",
 "In conclusion, increased globalisation over the last 50 years was driven above all by the fall in transport costs, which made global production physically viable; trade liberalisation and political opening then multiplied its effects by removing policy barriers and adding huge new workforces, with China the outstanding example. However, the judgement must be qualified: since 2008 the policy drivers have stalled or reversed, so globalisation should be understood as a powerful but reversible process, not an automatic one."],
 chains:"因素一链：集装箱化 → 单位运费骤降 → 全球采购/布局有利可图 → 跨国公司拆分生产、FDI↑ → 贸易/GDP↑ → 一体化加深。因素二链：WTO/集团削减壁垒 → 进口价格回落至世界价格 → 贸易创造 → 比较优势实现 → 专业化与世界产出↑；中国开放 → 低成本劳动力进入世界体系 → 供给与市场同时扩张。",

 lose:["写全球化的「影响」而不是「因素」——阅卷报告明确指出这类内容整段不得分","因素罗列 4–5 个、每个只有一两环链条，KAA 封顶 Level 2","不点名国家（本题要求 refer to examples of countries）","评价只重复「也有缺点」而不排序、不给判断","不用题干数据（集装箱量）——白白丢掉现成的应用证据"],
 zh:["全球化是各国经济日益融入单一国际市场、相互依存不断加深的过程，伴随着商品、服务、资本、劳动力和技术更自由的流动。过去 50 年有许多力量推动了这一进程，但其中两个最为突出：以集装箱化为代表的货物运输成本的崩塌式下降，以及通过 GATT/WTO 体系和贸易集团扩张实现的贸易自由化。本文认为，运输成本下降是最根本的驱动因素，因为它使其他一切形式的一体化在物理上和商业上成为可能。",
 "最强有力的单一因素是集装箱化带来的运输成本下降。标准化集装箱使装卸、海运以及在船舶、火车和卡车之间转运货物的成本大幅下降，跨洋运输每吨货物的成本降至 1970 年水平的零头。题干数据说明了结果：全球集装箱运输总量从 1980 年的 1 亿吨上升到 2020 年的 20 亿吨，增长了 1900%。因果链条如下：运费下降降低了外国商品和零部件的到岸价格，企业从全球成本最低的地点采购投入品变得有利可图，而不再局限于国内。这促使跨国公司把生产拆分到全球供应链中，把生产环节设在中国、越南等国家，产生大规模的外国直接投资。零部件和最终产品贸易的上升进而提高了贸易占世界 GDP 的比重，加深了各国经济的相互依存——这正是全球化的含义。没有廉价的集装箱运输，远距离的低工资生产根本无法服务西方市场，因此这一因素是其他因素的基础。",
 "第二个主要因素是贸易自由化。GATT 的历次回合以及 1995 年之后的 WTO 削减了关税和其他壁垒，贸易集团的数量和规模也不断扩大。取消关税使进口品的国内价格从含税价格回落到世界价格附近，产生贸易创造：低成本的外国供给替代高成本的国内生产，各国按比较优势专业化，世界产出上升。政治变化放大了这一进程。中国 1978 年后的开放和 2001 年加入 WTO，连同东欧前共产主义经济体的开放，把数以亿计的低成本劳动者带入世界贸易体系，极大地同时扩大了制成品的供给和市场。更廉价的通讯——互联网、移动技术和电子支付系统——通过降低跨境协调生产和贸易的成本，进一步强化了这些力量。",
 "在评价这些因素的相对重要性时，证据支持把运输成本排在第一位。集装箱运输量 20 倍的增长是物理能力的变化，而不仅仅是政策的变化，并且它在整个时期持续发挥作用。相比之下，贸易自由化既不连续也不完整：2001 年启动的多哈回合未能带来进一步的大幅壁垒削减，WTO 对法规、补贴等非关税壁垒的成效要差得多。因此，自由化更能解释一体化在某些时段的爆发，而非其整体规模。",
 "对「全球化不断加深」的简单叙事也有重要限定。这个进程已部分逆转：2008 年全球金融危机、中美贸易战、英国脱离欧盟——Grexit 和 Italeave 也被公开讨论——以及 2020 年全球卫生危机造成的供应链中断和劳动力短缺，都提高了跨境活动的成本或风险，产生了所谓的「慢全球化」。更廉价通讯的收益也不是普惠的：发展中国家的许多人因贫困、文盲或无法接入计算机系统而被排除在外，因此这一驱动因素对一些经济体的一体化作用远大于其他经济体。各因素的重要性也随时间变化——在 2020–21 年，供应链中断比运费的进一步下降更重要。",
 "总之，过去 50 年全球化的加深首要由运输成本下降驱动，它使全球生产在物理上可行；贸易自由化和政治开放随后通过拆除政策壁垒、加入庞大的新劳动力放大了其效果，中国是最突出的例子。但判断必须附带条件：2008 年以来政策驱动因素已经停滞甚至逆转，因此全球化应被理解为一个强大但可逆的过程，而不是自动的过程。"]},

 paras:[
 "Globalisation is the increasing integration of national economies, shown by rising trade, foreign direct investment, migration and technology transfer. Whether its benefits outweigh its costs cannot be answered in the abstract: it depends on the country, on who gains and who loses within it, and on the policies that accompany it. This essay uses China, the largest single beneficiary — and contributor — of the last four decades of integration. On balance, for China the benefits have outweighed the costs, but the margin depends critically on redistribution and regulation, and the costs are concentrated on groups least able to bear them.",
 "The central benefit comes from the law of comparative advantage. By specialising in labour-intensive manufactures, where its opportunity cost was lowest, and importing capital- and technology-intensive goods, China moved to consumption and production possibilities beyond what its own resources allowed: specialisation raised world output, and trade let China share in that gain. Export production at world scale generated economies of scale, lowering long-run average costs and raising competitiveness further, in a cumulative process. Export earnings and FDI inflows raised investment and AD, producing decades of rapid growth. Government tax revenues rose with profits and incomes, funding infrastructure and public services that reinforced the process. The diagram of a production possibility curve captures the static gain: after specialisation and trade, the consumption point lies outside the curve that constrained the economy in autarky.",
 "Consumers and workers gained directly. Competition from imports and the expansion of supply lowered prices and increased choice, raising consumer surplus and allocative efficiency, while technology transfer and new managerial techniques diffused through joint ventures and supply chains. Most importantly for a developing economy, higher real GDP in export-led sectors created hundreds of millions of jobs and produced a historic fall in absolute poverty: workers moved from low-productivity agriculture into higher-productivity industry, raising real incomes across the economy. Labour migration within the integrated world economy has similarly reduced geographical inequality elsewhere, for example Eastern European workers moving to Western Europe within the EU.",
 "Against this stand serious costs, and they qualify the judgement in three ways. First, inequality rose sharply within China: the gains accrued disproportionately to coastal provinces, to owners of capital and to skilled workers, while interior regions and unskilled workers gained far less. The claim that higher earnings at the top eventually trickle down to everyone is weak — the official verdict on trickle-down theory is that there is very little evidence that it works in practice. Second, integration was partly built on exploited labour: low wages, long hours and poor health and safety in export factories. Third, there are external costs. Expanded production and long-distance freight increased pollution and the consumption of non-renewable resources, imposing costs on others and on future generations, and making sustainable growth harder to achieve.",
 "A further cost is vulnerability. An economy specialised for export markets is exposed to external shocks: when global demand falls, or when a partner raises tariffs, the export sector transmits the shock directly into domestic employment. The same interdependence works in reverse — when China's own growth slowed to 5% in 2024, its import demand fell (imports were $2.6 trillion in 2024), reducing the export earnings and growth of the commodity and capital-goods producers that supply it. Over-dependence on imports can also worsen the current account of countries on the other side of the relationship. These costs are real, but note their character: they are mostly costs of how globalisation is governed — weak labour and environmental standards, absent redistribution — rather than proof that trade itself reduces welfare.",
 "Weighing the two sides for China, the benefits outweigh the costs. The gains — higher output, lower prices, mass employment and the largest reduction in absolute poverty in history — are economy-wide and cumulative, while the main costs fall on identifiable groups and can be mitigated by the very tax revenues globalisation generates: transfers and retraining for displaced workers, enforced labour standards and pollution controls. The judgement is nevertheless conditional. For a country that cannot tax, regulate or retrain — or a primary exporter facing deteriorating terms of trade — the same forces could plausibly produce costs exceeding benefits. Globalisation's net effect is therefore not a fact about trade but a fact about policy."],
 chains:"收益链：比较优势专业化 → 世界产出↑、规模经济 → 出口与 FDI↑ → AD 与税收↑ → 就业与收入↑ → 绝对贫困↓、消费者剩余↑。成本链：低标准竞争 → 劳工剥削 + 沿海/技能群体独享收益 → 国内不平等↑；产量与运输↑ → 污染与资源耗竭（负外部性）；出口专业化 → 外部冲击直接传导至就业。",
 whyEval:"评价有效的原因：(1) 分主体——消费者、企业、劳工、政府、环境各自结算，而不是笼统说「有利有弊」；(2) 用官方证据批判涓滴理论，把「收益会自动扩散」这一隐含假设拆掉；(3) 区分成本的性质——治理成本 vs 贸易本身的成本，这决定了判断的方向；(4) 判断带条件（能征税、能规制、能再培训的国家 vs 不能的国家），符合 Level 3「informed judgement」的定义。",
 whyJudge:"判断有说服力，因为它先承认成本的真实性与集中性，再论证收益的规模（经济整体性、累积性）与成本的可治理性能构成不对称，最后把结论落到可检验的条件上——读者能清楚知道什么证据会推翻这个判断。",
 lose:["本题要求自选国家却全程不点名——应用明显削弱（封顶以官方 MS 为准）","写全球化的「成因」——阅卷报告明确指出离题不得分","收益与成本只罗列名词、没有机制链","判断句缺席或只有「有利有弊」——Evaluation 停在 Level 1–2","把涓滴理论当作无条件成立的收益——与官方表述相反"],
 zh:["全球化是各国经济一体化程度不断加深的过程，表现为贸易、外国直接投资、移民和技术转移的增加。「收益是否大于成本」无法抽象地回答：它取决于具体的国家、国内谁得益谁受损，以及与之配套的政策。本文以中国为例——中国是过去四十年一体化最大的单一受益者，也是最大的贡献者。总体而言，对中国来说收益大于成本，但优势幅度关键取决于再分配和规制，而且成本集中落在最无力承受的群体身上。",
 "核心收益来自比较优势法则。中国专业化于劳动密集型制成品——其机会成本最低的领域——并进口资本与技术密集型产品，从而达到了仅靠自身资源无法实现的消费和生产水平：专业化提高了世界产出，贸易使中国分享了这一收益。以世界规模进行出口生产带来了规模经济，压低了长期平均成本，进一步提高了竞争力，形成累积过程。出口收入和 FDI 流入提高了投资和总需求，带来了数十年的高速增长。政府税收随利润和收入上升，为基础设施和公共服务提供资金，又反过来强化这一过程。生产可能性边界图刻画了这一静态收益：专业化和贸易之后，消费点位于自给自足时约束经济的那条曲线之外。",
 "消费者和劳动者直接受益。进口竞争和供给扩张压低了价格、增加了选择，提高了消费者剩余和配置效率；技术转移和新管理技术通过合资企业和供应链扩散。最重要的是，对一个发展中经济体而言，出口导向部门更高的实际 GDP 创造了数以亿计的就业，并使绝对贫困出现了历史性下降：劳动者从低生产率的农业转移到高生产率的工业，全经济的实际收入上升。在一体化世界经济中的劳动力迁移同样缩小了其他地方的地区不平等，例如欧盟内东欧工人迁往西欧。",
 "与之相对的是严重的成本，它们从三个方面限定上述判断。第一，中国国内不平等急剧加剧：收益不成比例地流向沿海省份、资本所有者和技能劳动者，而内陆地区和非技能劳动者获益要少得多。「顶端收入更高最终会涓滴到所有人」的说法站不住脚——官方对涓滴理论的结论是：几乎没有证据表明它在实践中有效。第二，一体化部分建立在被剥削的劳动之上：出口工厂的低工资、长工时和差的健康安全条件。第三，存在外部成本。生产扩张和长途货运增加了污染和不可再生资源消耗，把成本加诸他人和后代，使可持续增长更难实现。",
 "另一个成本是脆弱性。为出口市场专业化的经济体暴露于外部冲击：当全球需求下降，或伙伴国提高关税时，出口部门会把冲击直接传导到国内就业。同样的相互依存也反向运作——当中国自身增长在 2024 年放缓到 5% 时，其进口需求下降（2024 年进口 2.6 万亿美元），压低了向其供应大宗商品和资本品的生产者的出口收入和增长。对进口的过度依赖也会恶化关系另一端国家的经常账户。这些成本是真实的，但要注意它们的性质：它们大多是全球化「如何被治理」的成本——薄弱的劳工与环境标准、缺失的再分配——而不是贸易本身降低福利的证明。",
 "对中国权衡两侧，收益大于成本。收益——更高的产出、更低的价格、大规模就业和历史上最大规模的绝对贫困削减——是全经济范围且累积的；而主要成本落在可识别的群体身上，并且可以用全球化本身产生的税收来缓解：对被 displaced 的工人的转移支付和再培训、强制执行的劳工标准和污染管制。但这一判断是有条件的。对一个无法征税、无法规制或无法再培训的国家——或一个面临贸易条件恶化的初级产品出口国——同样的力量完全可能产生超过收益的成本。因此，全球化的净效应不是关于贸易的事实，而是关于政策的事实。"]},
"202110-9":{ch:"Ch.23",diagram:"ppc",

 command:"Evaluate the possible benefits：表面问收益，评分上收益作 KAA 主体、局限与风险作 Evaluation（官方清单即如此安排）。本题题干要求选定一个发达国家，不选定会削弱应用（封顶规则以该题官方 MS 为准）。",
 structure:[["第 1 段 · 定义与选定国家","定义专业化与比较优势；选定英国（服务业专业化国），预告判断。"],
 ["第 2 段 · 收益一：比较优势与 PPC（KAA）","机会成本逻辑 + PPC 图：贸易后消费点在 PPC 之外；世界产出与生活水平↑。"],

 ["第 4 段 · 评价一：模型假设（Evaluation）","无运输成本、要素完全流动、成本不变三大假设不现实 → 结构性失业与调整成本。"],
 ["第 5 段 · 评价二：脆弱性与贸易条件（Evaluation）","外部冲击、供应链、对进口的依赖；贸易互利要求贸易条件落在机会成本比率之间。"],
 ["第 6 段 · 判断","收益总体大于局限，但取决于专业化的行业、可调整性与贸易条件位置。"]],
 ao:[["AO1 Knowledge","比较优势定义与机会成本计算逻辑准确；收益点取官方清单：PPC 外消费、规模经济、贸易差额、配置效率。"],
 ["AO2 Application","英国服务业（金融、专业服务）贯穿全篇；题干四国对比要用上。"],
 ["AO3 Analysis","每条收益走完链：专业化 → 规模经济 → LRAC → 价格 → 竞争力 → 出口 → AD → 就业。"],
 ["AO4 Evaluation","假设批判要落到后果（结构性失业、供应链中断），不能只说「模型不现实」；判断给出收益成立的条件。"]],
 paras:[
 "Specialisation means concentrating resources on producing a narrower range of goods and services, and the law of comparative advantage states that a country gains by specialising in what it can produce at the lowest opportunity cost and trading for the rest. The United Kingdom illustrates the question: services account for a much higher share of UK (and US) GDP than in Italy or Canada, reflecting a comparative advantage in financial, professional and creative services. This essay evaluates the benefits of that specialisation for the UK, and argues that they are substantial but conditional on the terms of trade obtained and on the economy's capacity to adjust.",
 "The fundamental benefit is that trade allows consumption beyond the production possibility curve. If the UK devotes resources to services, in which its opportunity cost is low, and imports manufactures in which its opportunity cost is high, total world output rises because each unit of resources is used where it is relatively most productive. Through trade at a price between the two countries' opportunity cost ratios, the UK can consume a combination of goods and services outside its own PPC — a combination that is simply unattainable in autarky. Living standards rise because the same national resources now command a larger bundle of goods and services. This is a real-income gain, and it is the analytical core of every other benefit.",
 "Specialisation also generates dynamic gains through economies of scale. Concentrating on services lets UK firms serve a world market rather than a domestic one of 67 million people; as output expands, firms move down their long-run average cost curves, spreading the fixed costs of technology, compliance and reputation over far more transactions. Lower LRAC means lower export prices for services, which raises the UK's international competitiveness in exactly the sectors where world demand is growing fastest. The result is a stronger trade balance in services, higher AD and growth, and increased investment and employment in the service sector. There is a further welfare gain: greater allocative efficiency in world markets lowers prices generally, contributing to lower global inflation.",
 "These benefits, however, rest on a model with unrealistic assumptions, and this is the first qualification. The comparative advantage model ignores transport costs, which for some traded services and goods eat into the margin that makes trade worthwhile. More seriously, it assumes factors of production are perfectly mobile between industries with no diminishing returns. In reality, workers released from declining UK manufacturing face occupational immobility — their skills, location and age do not transfer costlessly to financial services in London — so specialisation creates structural unemployment and regional decline during the adjustment, a cost the static model simply assumes away. The benefits also depend on which services a country specialises in and how far it can specialise: a narrow specialisation in volatile financial services transmits global shocks straight into the domestic economy, as in 2008.",
 "Second, specialisation increases vulnerability. A country that imports most of its food, energy or manufactures is exposed to changes in global commodity prices and to suppressed global demand, and long supply chains run on just-in-time principles break down when key components are in short supply, producing shortages and higher prices for consumers. There is also a distributional and intertemporal catch: trade after specialisation is mutually beneficial only if the terms of trade settle between the two opportunity cost ratios; if the UK's export prices deteriorate relative to its import prices, part of the gain leaks abroad. Finally, expanded output can mean over-exploitation of resources and external costs, such as the pollution and global warming caused by increased transportation, which the PPC diagram does not record.",
 "Overall, the benefits of specialisation and trade for the UK outweigh these qualifications: the PPC gain and the scale economies in services are large, permanent and reinforced by growing world demand for services, whereas the main costs are transitional (adjustment and structural unemployment) or manageable through policy (diversification of suppliers, strategic reserves, retraining). But the judgement is genuinely conditional — the benefits are largest when the terms of trade lie comfortably inside the opportunity cost range and when labour markets can reallocate workers; a developed country that specialised narrowly, on deteriorating terms of trade, with immobile labour, would capture far less of the theoretical gain."],
 chains:"收益链：比较优势（服务业机会成本低）→ 专业化 → 世界产出↑ → 贸易后消费超出 PPC；规模链：世界市场 → 产量↑ → 沿 LRAC 下行 → 出口价格↓ → 竞争力↑ → 服务贸易顺差、AD↑、就业↑。风险链：要素不完全流动 → 衰退行业工人职业流动性障碍 → 结构性失业；专业化过窄 + 长供应链 → 外部冲击与中断直接传导。",
 whyEval:"评价有效的原因：(1) 假设批判不停留在「不现实」，而是逐个落到后果（运输成本吃掉贸易边际、要素不流动产生结构性失业）；(2) 提出贸易互利的精确条件——贸易条件须落在机会成本比率之间，这是官方清单里最能显示理解深度的评价点；(3) 脆弱性用了 2008 与供应链中断作证据。这样的评价是「critical of the evidence」，不是套话。",
 whyJudge:"判断有说服力，因为它把收益与成本按性质分类：收益是大的、永久的、被需求增长强化的；成本是过渡性的或可由政策管理的——分类本身给出了权衡的理由，最后再用三个可检验条件收口。",
 lose:["不选定发达国家——应用落空，本题最常见的丢分（封顶以官方 MS 为准）","只写收益不评价：Evaluate 题没有判断进不了高档","比较优势只背定义、不做机会成本/PPC 推导，链条停在 Level 2","评价只说「模型假设不现实」而不展开后果","混淆绝对优势与比较优势：用「英国服务业产出大」论证应出口服务"],
 zh:["专业化是指把资源集中于生产较窄范围的商品和服务；比较优势法则指出，一国专业化于其机会成本最低的产品、其余靠贸易获得，即可获益。英国正是本题的例证：服务业占英国（和美国）GDP 的比重远高于意大利和加拿大，反映了其在金融、专业和创意服务上的比较优势。本文评价这种专业化对英国的收益，并认为收益可观，但以所获贸易条件和经济的调整能力为条件。",
 "最根本的收益是贸易使消费能够超出生产可能性边界。如果英国把资源投入机会成本低的服务业，进口机会成本高的制成品，由于每一单位资源都被用在相对最有效率的地方，世界总产出上升。通过按介于两国机会成本比率之间的价格进行贸易，英国可以消费一个位于自身 PPC 之外的商品与服务组合——一个在自给自足下根本无法达到的组合。生活水平上升，因为同样的国民资源现在能换得更大的商品与服务束。这是实际收入的收益，也是其他一切收益的分析核心。",
 "专业化还通过规模经济产生动态收益。专注于服务业使英国企业面对的是世界市场，而不是 6700 万人的国内市场；随着产量扩大，企业沿长期平均成本曲线下行，把技术、合规和声誉的固定成本分摊到多得多的交易上。LRAC 下降意味着服务出口价格更低，这恰好提高了英国在世界需求增长最快的部门中的国际竞争力。结果是服务贸易差额更强、总需求和增长更高、服务业投资和就业增加。还有一层福利收益：世界市场配置效率的提高普遍压低价格，有助于降低全球通胀。",
 "然而，这些收益建立在一个假设不现实的模型之上，这是第一点限定。比较优势模型忽略运输成本，而对某些贸易的服务和商品来说，运费会吃掉使贸易值得进行的边际。更严重的是，它假设生产要素在产业间完全流动且没有递减收益。现实中，从衰落的英国制造业释放出的工人面临职业流动性障碍——他们的技能、地点和年龄无法无成本地转移到伦敦的金融服务业——因此专业化在调整期会造成结构性失业和地区衰落，而静态模型把这种成本直接假设掉了。收益还取决于一国专业化于哪些服务、能专业化到什么程度：狭窄地专业化于波动性大的金融服务，会把全球冲击直接传导到国内经济，2008 年就是如此。",
 "第二，专业化增加了脆弱性。一个大部分食品、能源或制成品依赖进口的国家，暴露于全球大宗商品价格变动和全球需求受压之下；建立在准时制原则上的长供应链在关键部件短缺时会断裂，造成短缺和消费者价格上升。还有分配和跨期的问题：专业化之后的贸易只有在贸易条件落在两个机会成本比率之间时才互利；如果英国的出口价格相对进口价格恶化，部分收益就会漏到国外。最后，产出扩张可能意味着资源的过度开发和外部成本，如运输增加造成的污染和全球变暖，而 PPC 图并不会记录这些。",
 "总体而言，专业化与贸易对英国的收益大于这些限定：PPC 收益和服务业的规模经济是巨大的、永久的，并被世界服务需求的增长所强化；而主要成本是过渡性的（调整与结构性失业）或可由政策管理的（供应商多元化、战略储备、再培训）。但这一判断确实是有条件的——当贸易条件稳稳落在机会成本区间内、且劳动力市场能重新配置工人时，收益最大；一个狭窄专业化、贸易条件恶化、劳动力无法流动的发达国家，能获得的理论收益要少得多。"]}

"202401-9":{ch:"Ch.24",diagram:"ppc",
 demand:"题目用 WTO 数据锚定现象：1995–2022 年发展中经济体出口份额上升、发达经济体份额下降；要求评价「影响国家间贸易格局的因素」。贸易格局 = 构成（交易什么）+ 地理分布（与谁交易），每个因素都必须落到这两个维度之一，并结合自选国家展开应用。",
 command:"Evaluate factors：因素题的标准打法是 2 个因素深写 + 评价排序/组合判断。官方阅卷反馈：多数答案只有两环链条、够不到高档——链条长度是本题的第一竞争力。",
 structure:[["第 1 段 · 定义与框架","定义贸易格局（构成 + 流向）；预告两个主因素：比较优势的转移、新兴经济体开放与 FDI；判断先行：组合作用大于单一因素。"],

 ["第 3 段 · 因素二：开放、FDI 与贸易集团（KAA）","中国与东欧开放 + FDI 把产能建到发展中经济体 + 集团与双边协定的贸易创造 → 发展中份额上升的制度通道。"],
 ["第 4 段 · 评价一：假设与回流（Evaluation）","比较优势假设不现实；中国工资与运输成本上升 → 回流/近岸化，格局可部分逆转。"],
 ["第 5 段 · 评价二：汇率、报复与组合（Evaluation）","汇率波动使格局不稳定；保护主义报复改变流向；因素组合与短长期差异；排序判断。"],
 ["第 6 段 · 判断","格局变化主要由成本驱动的比较优势转移解释，制度因素（开放、集团、FDI）决定速度；未来取决于工资收敛与政策环境。"]],
 ao:[["AO1 Knowledge","贸易格局定义准确；因素取官方清单：比较优势、新兴经济体开放、贸易集团/双边协定、汇率、保护主义、竞争力、FDI、去工业化。"],
 ["AO2 Application","WTO 份额数据（1995–2022）要嵌入论证；国家例子：中国、东欧、美英去工业化。"],
 ["AO3 Analysis","每个因素走满链：成本/制度变化 → 企业选址与专业化 → 出口构成变化 → 份额变化。"],
 ["AO4 Evaluation","回流、汇率波动、报复与退出集团构成「可逆性」评价；结尾给组合与排序判断。"]],
 paras:[
 "The pattern of trade describes both the composition of a country's exports and imports — what is traded — and their geographical distribution — with whom it is traded. Between 1995 and 2022, according to the WTO, the share of developing economies in world exports rose while the share of developed economies fell. This essay argues that the shift is explained mainly by a movement in comparative advantage towards emerging economies, made effective by their opening to the world economy and by large inflows of FDI; trading blocs, exchange rates and protectionism then modified the speed and direction of the change. No single factor suffices: the pattern changed because the factors acted together.",
 "The deepest factor is comparative advantage, which is not fixed. A country exports goods in which its opportunity cost is lowest, and opportunity costs change as wages, technology and endowments change. In the 1990s China's unit labour costs in manufacturing were a small fraction of those in the USA or UK, while its workforce was increasingly literate and disciplined; its comparative advantage therefore lay in labour-intensive manufactures. As resources worldwide were reallocated towards that advantage, the composition of world trade changed: manufactures increasingly originated in developing economies, while developed economies, losing their low-cost manufacturing, specialised further in services and high-technology goods in which their opportunity costs were lower. The geographical pattern changed with the composition — trade routes and supply chains re-centred on East Asia. A numerical or PPC illustration makes the mechanism precise: when relative opportunity costs move, the specialisation pattern, and hence the pattern of trade, must move with them.",
 "Comparative advantage alone, however, explains potential rather than actual trade; two institutional factors converted it into the observed shift. First, political opening: the collapse of communism and the reform of China brought previously closed economies into the world market, and FDI followed — multinational firms built manufacturing capacity inside developing economies, which directly raised those economies' manufactured exports. Second, the growth of trading blocs and bilateral trading agreements increased trade creation between members, redirecting flows towards partner countries; China's 28 free-trade agreements and its membership of RCEP, a bloc contributing one-third of world GDP, are the clearest current example. Developed economies meanwhile experienced deindustrialisation, with manufacturing shrinking as a share of national output, which entrenched the new pattern from the other side.",
 "Several qualifications limit any single-factor story. The law of comparative advantage rests on unrealistic assumptions — constant costs and perfectly mobile resources — so actual adjustment is slower and more painful than the model implies. More concretely, the process contains its own brake: as Chinese wages and transport costs rise, the cost advantage narrows, and some manufacturing has already returned to developed economies or moved to other developing economies (reshoring and near-shoring), partially reversing the pattern. Exchange rates add instability: they are highly volatile, and a currency movement — or a deliberate policy of preventing appreciation, as China has been accused of practising — can redraw relative prices and flows again in the long run. Protectionism cuts both ways, since tariffs and subsidies make imports relatively more expensive and provoke retaliation, and countries leaving trading blocs can suddenly reverse years of trade creation.",
 "Time horizon matters throughout. In the short run, contracts, sunk investment in factories and existing supply chains fix the pattern; in the long run, costs, technology and policy all move. The factors also differ in importance between economies: exchange-rate policy matters most for countries managing their currencies, bloc membership most for small open economies, and FDI most for economies with the infrastructure to absorb it.",
 "In conclusion, the changing pattern of trade since 1995 is best explained by comparative advantage shifting towards emerging economies as their costs and capabilities changed, with opening, FDI and trading agreements determining how fast the shift occurred; China's trajectory is the paradigm case. But the pattern is not locked in: rising wages, reshoring, volatile exchange rates and protectionist retaliation can each bend it back, so the most defensible judgement is that cost-driven comparative advantage sets the direction, institutions set the pace, and policy shocks set the exceptions."],
 chains:"因素一链：工资/技术变化 → 机会成本移动 → 制造业比较优势移向新兴经济体 → 专业化与流向重塑 → 发展中份额↑。因素二链：政治开放 → FDI 流入建产能 → 制成品出口↑；集团/双边协定 → 贸易创造 → 流向向成员国集中。评价链：工资↑+运费↑ → 成本优势收窄 → 回流 → 格局部分逆转。",
 whyEval:"评价有效的原因：(1) 指出模型假设与现实调整的差距（成本不变、要素完全流动）；(2) 提出自我制动机制——成功本身推高工资、侵蚀优势，这是高阶评价而非清单式「缺点」；(3) 汇率与报复说明格局的可逆性；(4) 明确短长期与国家差异。官方清单中的评价点几乎全部落地，且组织成论证而非罗列。",
 whyJudge:"判断有说服力，因为它给因素分工：方向（比较优势）、速度（制度）、例外（政策冲击）——这种「分层判断」比简单排序更能解释 1995–2022 的数据，也能解释为什么同一时期不同国家轨迹不同。",
 lose:["把贸易格局写成贸易量——构成与流向一个不落才算切题","因素罗列 4 个以上、每个只有两环（阅卷报告点名的典型低分形态）","不结合具体国家，应用停留在抽象层面","评价与 KAA 重复：把因素换个说法再说一遍","漏掉 FDI 与开放这两个把「潜在优势」变成「实际格局」的通道"],
 zh:["贸易格局既指一国进出口的构成——交易什么——也指其地理分布——与谁交易。据 WTO 数据，1995 年至 2022 年间，发展中经济体在世界出口中的份额上升，发达经济体的份额下降。本文认为，这一变化主要由比较优势向新兴经济体的转移来解释，而新兴经济体向世界经济开放和大规模 FDI 流入使这种转移成为现实；贸易集团、汇率和保护主义则改变了变化的速度和方向。没有任何单一因素足够：格局之所以改变，是因为各因素共同作用。",
 "最深层的因素是比较优势，而比较优势不是固定的。一国出口其机会成本最低的商品，而机会成本随工资、技术和禀赋的变化而变化。1990 年代，中国制造业的单位劳动成本只是美国或英国的零头，其劳动力识字率和纪律性又不断提高；因此其比较优势在于劳动密集型制成品。随着全球资源向这一优势重新配置，世界贸易的构成改变了：制成品越来越多地源自发展中经济体，而发达经济体在失去低成本制造业后，进一步专业化于其机会成本更低的服务和高技术商品。地理格局随构成一起改变——贸易路线和供应链重新以东亚为中心。数值例或 PPC 图可以把机制说精确：当相对机会成本移动时，专业化格局、进而贸易格局必然随之移动。",
 "然而，比较优势本身解释的是潜在贸易而非实际贸易；两个制度因素把潜力转化成了观察到的变化。第一是政治开放：共产主义的垮台和中国的改革把此前封闭的经济体带入世界市场，FDI 随之而来——跨国公司在发展中经济体内部建设制造产能，直接提高了这些经济体的制成品出口。第二，贸易集团和双边贸易协定的增长增加了成员之间的贸易创造，把流向重新导向伙伴国；中国签署的 28 个自由贸易协定及其加入的 RCEP——一个贡献世界 GDP 三分之一的集团——是当前最清晰的例子。与此同时，发达经济体经历了去工业化，制造业占国民产出的比重下降，从另一侧固化了新格局。",
 "几点限定使任何单一因素叙事都站不住。比较优势法则基于不现实的假设——成本不变、资源完全流动——因此实际调整比模型暗示的更慢、更痛苦。更具体地说，这个过程包含自身的刹车：随着中国工资和运输成本上升，成本优势收窄，一些制造业已经回流发达国家或转移到其他发展中国家（回流与近岸化），部分逆转了格局。汇率增加了不稳定性：汇率高度波动，一次货币变动——或像中国被指责的那样蓄意阻止升值的政策——长期内可以重新绘制相对价格和流向。保护主义的作用是双向的：关税和补贴使进口相对变贵并引发报复，而国家退出贸易集团可以突然逆转多年的贸易创造。",
 "时间维度贯穿始终。短期内，合同、工厂的沉没投资和既有供应链固定了格局；长期内，成本、技术和政策都在移动。各因素对不同经济体的重要性也不同：汇率政策对管理本币的国家最重要，集团成员资格对小型开放经济体最重要，FDI 对有基础设施承接它的经济体最重要。",
 "总之，1995 年以来贸易格局的变化，最好由比较优势随新兴经济体成本和能力变化而转移来解释，开放、FDI 和贸易协定决定了转移的速度；中国的轨迹是典范案例。但格局并未锁定：工资上升、回流、汇率波动和保护主义报复都可能使其回摆。因此最站得住的判断是：成本驱动的比较优势决定方向，制度决定速度，政策冲击决定例外。"]},

 command:"Evaluate factors：与 202101-8（问影响）正好镜像——本题写「影响」整段偏题。KAA 12 分看两条链的深度与国家应用；Evaluation 8 分看排序、幅度、持续时间与国家类型差异。注：本题官方评价清单未逐字核全，范文评价按排序/幅度/短长期/净进口-出口国等官方同系列口径展开。",
 structure:[["第 1 段 · 定义与框架","定义贸易条件 + 公式；声明只深写两个因素：贬值、相对生产率上升；预告排序判断。"],
 ["第 2 段 · 因素一：汇率贬值（KAA）","贬值 → 外币计价出口价↓、本币计价进口价↑ → Px/Pm↓ → 贸易条件恶化；以希腊/欧元区背景与英镑贬值作国家落点。"],

 ["第 4 段 · 评价一：排序与幅度（Evaluation）","对两国数据排序：直布罗陀 −44.6% 远大于希腊 −14.3%；贬值是价格水平的即时冲击，生产率是缓慢趋势——持续性与可逆性不同。"],

 ao:[["AO1 Knowledge","贸易条件定义与公式准确；因素取官方清单中的两个（贬值、相对生产率↑——含资本投资→生产率一条）。"],
 ["AO2 Application","题干两国数据（−44.6% / −14.3%）用进评价排序；链条中点名具体国家与情境。"],
 ["AO3 Analysis","每条因素链至少 4 环，且方向逐步推导（价格如何一步步传导到 Px/Pm）。"],
 ["AO4 Evaluation","排序 + 幅度 + 持续时间/可逆性 + 净进口/出口国差异 + 「恶化≠福利受损」的批判性判断。"]],
 paras:[
 "The terms of trade measure the ratio of a country's export prices to its import prices, expressed as an index: (index of export prices ÷ index of import prices) × 100. A worsening, or deterioration, means that each unit of exports now buys fewer imports. Between 2000 and 2020 the terms of trade worsened by 44.6% in Gibraltar and by 14.3% in Greece. Many factors can produce such a deterioration, but this essay examines two in depth — a depreciation of the exchange rate, and a rise in relative productivity — and argues that depreciation is normally the more powerful short-run factor, while productivity determines the long-run trend.",
 "First, depreciation of the currency worsens the terms of trade directly through prices. When a currency depreciates, the price of the country's exports expressed in foreign currency falls, because foreign buyers now need less of their own currency to buy them; at the same time the price of imports expressed in domestic currency rises, because each unit of foreign currency costs more. Export prices therefore fall relative to import prices, and the terms of trade index falls. The mechanism is immediate and mechanical: it requires no change in real quantities at all. Greece illustrates the constraint version of this channel — as a euro member it could not depreciate externally after 2010, so adjustment took other forms — whereas a country with its own floating currency, such as the UK when sterling fell sharply in 2016, experiences an instant deterioration in its terms of trade through exactly this price channel, with import prices rising across the whole basket of traded goods.",
 "Second, a rise in relative productivity worsens the terms of trade, paradoxically, by making the country more efficient. If productivity in a country's export industries rises faster than in its trading partners — for example through higher levels of capital investment, which raise output per worker — then unit labour costs fall. Facing competition in world markets, firms pass part of the cost reduction into lower export prices to gain market share. Import prices, determined abroad, are unchanged, so export prices fall relative to import prices and the terms of trade deteriorate. This is the channel associated with persistently efficient manufacturing exporters such as Germany: decades of productivity growth in export industries have been partly given away to foreign consumers through lower prices rather than fully retained as higher domestic incomes. Lower relative labour costs and lower relative inflation work through the same route — anything that holds export prices down relative to import prices worsens the index.",
 "Evaluating the two factors, they differ in speed, size and reversibility. Depreciation is fast and can be large: a sharp currency fall moves every export and import price at once, which is consistent with a deterioration on the scale of Gibraltar's 44.6% over a period that includes major currency and price shocks. Productivity-driven deterioration is slow and cumulative — a trend of a fraction of a percent a year, closer in character to Greece's 14.3% over two decades. Depreciation can also reverse if the currency recovers, whereas productivity gains are permanent. On magnitude and speed, therefore, the exchange rate is the more significant factor for explaining a large worsening over a defined period; on persistence, productivity matters more.",
 "A second evaluation point is that a worsening caused by these factors is not necessarily harmful, and this affects how much weight each factor deserves in explaining welfare-relevant change. Cheaper exports after a depreciation sell in larger quantities, so export revenue and the current account may improve even as the terms of trade worsen, provided the Marshall–Lerner condition holds — the sum of the price elasticities of demand for exports and imports exceeding one. Likewise, productivity-driven deterioration accompanies rising output and real incomes: the country gives away part of its efficiency gain in prices but keeps the rest in volume. Which factor dominates also depends on the country's trade structure: for a net exporter of commodities, a fall in commodity prices can swamp both channels, while for a net importer the same price movement improves the terms of trade instead.",
 "In conclusion, a country's terms of trade worsen when export prices fall relative to import prices, and of the two factors examined, depreciation is the more powerful explanation of a large deterioration in the short run because it reprices all trade immediately, while rising relative productivity produces a slower, permanent deterioration that is partly a sign of economic strength. The ranking reverses over long horizons, and for commodity-dependent economies both can be overridden by world commodity prices — the correct judgement is therefore conditional on the period and on the structure of the country's trade, as the contrast between Gibraltar's 44.6% and Greece's 14.3% deterioration itself suggests."],
 chains:"因素一链：贬值 → 外币计价出口价格↓ + 本币计价进口价格↑ → Px/Pm↓ → 贸易条件恶化（即时、纯价格效应）。因素二链：资本投资↑ → 生产率↑ → 单位劳动成本↓ → 竞争迫使出口价格↓ → Px 相对 Pm↓ → 贸易条件恶化（缓慢、趋势性）。",
 whyEval:"评价有效的原因：(1) 排序有维度——速度、幅度、可逆性、持续性四个标准逐项比较两个因素，而不是笼统说「都很重要」；(2) 用题干数据作排序证据（−44.6% 的量级更像汇率/价格冲击，−14.3% 更像趋势）；(3) 拆穿「恶化 = 受害」的直觉：数量效应（马歇尔-勒纳）与生产率的收入效应使福利判断反转；(4) 指出第三类因素（大宗商品价格）何时压倒前两者，判断因此有边界。",
 whyJudge:"判断有说服力，因为它不给绝对排名，而是「短期汇率主导、长期生产率主导、商品依赖型经济例外」的条件式结论——与题目给出的两国数据差异相互印证，考官能看到判断是从证据里长出来的。",
 lose:["写贸易条件恶化的「影响」——本题问因素，影响整段偏题（与 202101-8 串答案是最典型的翻车）","写 3–4 个因素每个都很浅：官方规则是 2 个因素写深","不点名国家：KAA 封顶 Level 3（9 分）","把 Prebisch-Singer 或弹性当作评价主体堆砌：本题评价的核心是排序、幅度、持续时间与国家类型","因素链断裂：只说「贬值使贸易条件恶化」不推导价格传导的中间环节"],
 zh:["贸易条件衡量一国出口价格与进口价格的比率，以指数表示：（出口价格指数 ÷ 进口价格指数）× 100。恶化意味着每单位出口现在能换回的进口更少。2000 年至 2020 年间，直布罗陀的贸易条件恶化了 44.6%，希腊恶化了 14.3%。许多因素可以造成这种恶化，但本文深入考察其中两个——汇率贬值和相对生产率上升——并认为贬值通常是更强的短期因素，而生产率决定长期趋势。",
 "第一，货币贬值通过价格直接恶化贸易条件。当一国货币贬值时，以外币表示的该国出口价格下降，因为外国买家现在只需更少本币即可购买；与此同时，以本币表示的进口价格上升，因为每单位外币的成本更高。因此出口价格相对进口价格下降，贸易条件指数下跌。这一机制即时且机械：它根本不需要实际数量发生任何变化。希腊展示了这一渠道的受约束版本——作为欧元成员国，它在 2010 年后无法对外部贬值，调整只能采取其他形式——而拥有自己浮动货币的国家，如 2016 年英镑大幅下跌时的英国，会通过完全相同的价格渠道经历贸易条件的即时恶化，整个贸易品篮子的进口价格上升。",
 "第二，相对生产率上升会恶化贸易条件——悖论在于，它是通过让国家更有效率来实现的。如果一国出口产业的生产率上升快于其贸易伙伴——例如通过更高水平的资本投资提高人均产出——那么单位劳动成本下降。面对世界市场的竞争，企业把成本下降的一部分转化为更低的出口价格以争夺市场份额。进口价格由国外决定、保持不变，因此出口价格相对进口价格下降，贸易条件恶化。这是与德国这类持续高效的制造业出口国相联系的渠道：出口产业数十年的生产率增长，有一部分通过更低的价格让给了外国消费者，而没有完全以更高的国内收入形式保留下来。较低的相对劳动成本和较低的相对通胀通过同一路径起作用——凡是把出口价格相对进口价格压低的因素，都会使指数恶化。",
 "在评价这两个因素时，它们在速度、幅度和可逆性上不同。贬值快且可以很大：一次大幅的货币下跌会同时重新定价所有出口和进口价格，这与直布罗陀在包含重大货币和价格冲击的时期内 44.6% 的恶化量级相符。生产率驱动的恶化缓慢而累积——每年零点几个百分点的趋势，性质上更接近希腊二十年里 14.3% 的变化。贬值在货币回升时也可以逆转，而生产率收益是永久的。因此，在幅度和速度上，汇率是解释一段确定时期内大幅恶化的更重要因素；在持续性上，生产率更重要。",
 "第二个评价点是：由这些因素造成的恶化未必有害，这影响每个因素在解释与福利相关的变化时应占的权重。贬值后更便宜的出口品销量更大，因此即使贸易条件恶化，出口收入和经常账户也可能改善，前提是马歇尔-勒纳条件成立——进出口需求价格弹性之和大于 1。同样，生产率驱动的恶化伴随着产出和实际收入的上升：国家在价格上让出了一部分效率收益，但以数量形式保留了其余部分。哪个因素占主导还取决于国家的贸易结构：对大宗商品净出口国来说，大宗商品价格下跌可以压倒这两个渠道，而对净进口国，同样的价格变动反而改善贸易条件。",
 "总之，当出口价格相对进口价格下降时，一国贸易条件恶化；在所考察的两个因素中，贬值是短期内大幅恶化更有力的解释，因为它即时重新定价全部贸易；而相对生产率上升产生更缓慢、永久性的恶化，且部分是经济强健的标志。这一排序在长期会逆转，对依赖大宗商品的经济体，两者都可能被世界大宗商品价格压倒——因此正确的判断取决于时期和该国贸易结构，正如直布罗陀 44.6% 与希腊 14.3% 的恶化对比本身所提示的。"]}
});
</script>
